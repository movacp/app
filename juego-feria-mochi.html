<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Feria de Mochi · MOVA</title><meta name="theme-color" content="#F5F3FA"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--n:#1E3A5F;--ink:#15192B;--bg:#F5F3FA}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
body{min-height:100dvh;background:radial-gradient(circle at 1px 1px,rgba(30,58,95,.08) 1px,transparent 1.6px) 0 0/22px 22px,linear-gradient(160deg,#FFF1F8,#F2EEFF 45%,#E9F6F0)}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:7px;background:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px;text-decoration:none;color:var(--ink);box-shadow:0 4px 14px rgba(30,58,95,.08)}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin:0}
/* Inicio */
.hero{position:relative;background:linear-gradient(135deg,#FFE58A,#FFD1E8);border-radius:30px;padding:24px 22px;min-height:178px;overflow:hidden;box-shadow:0 10px 30px rgba(30,58,95,.08)}
.hero .k{display:inline-block;background:#fff;border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-size:36px;line-height:1;margin-top:12px;max-width:62%}
.hero p{margin:8px 0 0;font-size:14.5px;line-height:1.45;max-width:58%;color:#3B4262}
.hero .hm{position:absolute;right:6px;bottom:-6px;width:40%}
.mochi{width:100%;display:block;user-select:none}
.mochi.idle{animation:bob 2.2s ease-in-out infinite alternate}.mochi.happy{animation:jump .5s 2}.mochi.sad{animation:shake .4s}
@keyframes bob{to{transform:translateY(-6px)}}@keyframes jump{50%{transform:translateY(-16px) rotate(-4deg)}}
.sub{font-size:15px;font-weight:700;margin:22px 4px 10px;color:#5B5F78}
.games{display:grid;gap:12px}
.gcard{display:flex;align-items:center;gap:14px;border:0;background:#fff;border-radius:24px;padding:12px;text-align:left;box-shadow:0 6px 18px rgba(30,58,95,.07);transition:transform .15s}
.gcard:active{transform:scale(.98)}
.gart{flex:none;width:118px;height:84px;border-radius:18px;background:var(--s);display:grid;place-items:center;padding:6px}.gart svg{width:100%;height:100%}
.gtx b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:19px;line-height:1.1}.gtx small{display:block;font-size:13px;color:#6B6F86;margin-top:4px}
/* Elegir sílabas */
.setup{background:#fff;border-radius:30px;padding:20px;box-shadow:0 10px 30px rgba(30,58,95,.08)}
.sh{display:flex;gap:14px;align-items:center}.sh .gart{width:132px;height:94px}
.sh h2{font-size:26px;line-height:1.05}.sh p{margin:6px 0 0;font-size:13.5px;color:#6B6F86}
.lbl{font-weight:800;font-size:15px;margin:22px 2px 10px}
.vowels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vbtn{border:2.5px solid transparent;background:var(--s);border-radius:20px;padding:14px 8px;text-align:center}
.vbtn .vl{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;color:var(--c);line-height:1}
.vbtn[data-v="all"] .vl{font-size:18px;padding:6px 0}
.vbtn .vn{display:block;font-size:11.5px;font-weight:700;margin-top:6px;color:#3B4262}
.vbtn.on{border-color:var(--c);background:#fff;box-shadow:0 0 0 4px var(--s)}
.go{display:block;width:100%;margin-top:20px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:800;padding:16px;box-shadow:0 5px 0 #D7F36A}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #D7F36A}
/* Juego */
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph h3{flex:1;font-size:18px}
.x{width:42px;height:42px;border:0;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(30,58,95,.08)}
.dots{display:flex;gap:5px;justify-content:center;margin:2px 0 12px}.dots i{width:22px;height:8px;border-radius:999px;background:rgba(30,58,95,.12)}.dots i.ok{background:#7FC8A9}.dots i.miss{background:#FFD36B}
.board{position:relative;background:#fff;border-radius:30px;padding:16px;box-shadow:0 10px 30px rgba(30,58,95,.08);overflow:hidden}
.pm{position:absolute;right:8px;top:6px;width:70px;z-index:3;pointer-events:none}
.ask{display:flex;align-items:center;gap:12px;padding-right:70px;min-height:56px}
.ask b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:20px;line-height:1.1}.ask small{display:block;font-size:13px;color:#6B6F86;margin-top:3px}
.say{flex:none;width:52px;height:52px;border:0;border-radius:18px;background:var(--s);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--c)}
.say.ghost{color:#FFD36B}.say.ghost svg{width:26px}
.msg{min-height:26px;text-align:center;font-weight:800;font-size:16px;margin:12px 0 0}.msg.ok{color:#2F7A55}.msg.bad{color:#C2407F}
.pic{width:100%;height:100%}
.wcard{position:relative;width:132px;height:124px;margin:10px auto 0;background:var(--s);border-radius:24px;padding:8px}
.wcard.big{width:160px;height:150px}.wcard.glow{animation:glow .9s ease}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(255,211,107,.5);transform:scale(1.05)}}
.wsay{position:absolute;right:-10px;bottom:-10px;width:40px;height:40px;border:0;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(30,58,95,.15)}
.wsay svg{width:20px}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* Globos */
.sky{position:relative;height:380px;margin:10px -16px -16px;background:linear-gradient(#FFF7FB,#EAF4FF);overflow:hidden}
.balloon{position:absolute;left:var(--x);bottom:-150px;width:86px;border:0;background:none;padding:0;animation:rise var(--d) linear var(--dl) infinite}
.balloon svg{width:100%;display:block}
.balloon span{position:absolute;left:0;right:0;top:26px;text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-size:27px;font-weight:800;color:var(--n)}
.balloon.shake{animation:rise var(--d) linear var(--dl) infinite,shake .4s}
.balloon.popped{animation:none;transition:transform .2s,opacity .2s;transform:scale(1.5);opacity:0}
@keyframes rise{0%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-280px) rotate(3deg)}100%{transform:translateY(-560px) rotate(-3deg)}}
/* Pesca */
.pond{position:relative;height:270px;margin:16px -16px -16px;background:linear-gradient(#BFE6FF,#8ECDF2);overflow:hidden}
.pond:before{content:"";position:absolute;inset:0 0 auto;height:14px;background:repeating-radial-gradient(circle at 20px -6px,#fff 0 12px,transparent 13px) 0 0/40px 14px;opacity:.55}
.fish{position:absolute;top:var(--y);left:-160px;width:136px;border:0;background:none;padding:0;animation:swim var(--d) linear var(--dl) infinite}
.fish.rev{animation-name:swimr}.fish.rev svg{transform:scaleX(-1)}
.fish svg{width:100%;display:block}
.fish span{position:absolute;left:18px;right:28px;top:20px;text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-size:25px;font-weight:800;color:var(--n)}
.fish.rev span{left:28px;right:18px}
.fish.caught{animation:caught .9s forwards}
@keyframes swim{from{left:-150px}to{left:105%}}@keyframes swimr{from{left:105%}to{left:-150px}}
@keyframes caught{to{transform:translateY(-260px) rotate(-20deg);opacity:0}}
.weed{position:absolute;bottom:-6px;width:26px;height:80px}.w1{left:8%}.w2{right:10%}
/* Sílaba perdida y tren */
.slots{display:flex;justify-content:center;gap:8px;margin:18px 0 6px}
.slot{min-width:76px;padding:12px 10px;border-radius:18px;background:#fff;border:2.5px solid var(--n);text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-size:32px;font-weight:800;color:var(--n)}
.slot.empty{border-style:dashed;border-color:var(--c);color:var(--c);background:var(--s)}
.slot.fill{border-color:#7FC8A9;background:#E3F5EA;animation:jump .4s}
.opts{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:16px}
.tile{min-width:82px;padding:14px 12px;border:0;border-radius:18px;background:var(--s);font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;color:var(--n);box-shadow:0 5px 0 var(--c)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--c)}.tile.used{opacity:.25;pointer-events:none}
.track{margin:18px -16px 0;padding:0 8px 16px;border-bottom:4px solid var(--n);overflow:hidden}
.train{display:flex;align-items:flex-end;gap:6px;transition:transform 1.4s cubic-bezier(.5,0,.75,0)}.train.leave{transform:translateX(130%)}
.engine{flex:none;width:96px}.engine svg{width:100%;display:block}
.car{position:relative;flex:none;width:78px;height:62px;border-radius:12px;background:#fff;border:2.5px dashed #B9BFD9;display:grid;place-items:center;margin-bottom:12px}
.car i{position:absolute;bottom:-12px;width:18px;height:18px;border-radius:50%;background:var(--n)}.car i:first-of-type{left:10px}.car i:last-of-type{right:10px}
.car.full{border:2.5px solid var(--n);background:var(--s);animation:jump .4s}
.cs{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;color:var(--n)}
.puff{animation:puff 1.4s ease-in-out infinite}@keyframes puff{50%{transform:translate(-6px,-6px) scale(1.3);opacity:.4}}
/* Memorama */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;perspective:800px}
.mc{position:relative;aspect-ratio:3/3.4;border:0;background:none;padding:0}
.mc>span{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;transition:transform .45s;display:grid;place-items:center}
.mc .back{background:linear-gradient(135deg,var(--c),#FF8FC8);box-shadow:0 4px 0 rgba(30,58,95,.15)}.mc .back svg{width:58%}
.mc .face{background:#fff;border:2.5px solid #E6E1F2;transform:rotateY(180deg);padding:8px}
.mc .face.w b{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800;color:var(--n)}
.mc.up .back{transform:rotateY(180deg)}.mc.up .face{transform:rotateY(360deg)}
.mc.done .face{border-color:#7FC8A9;background:#E9F7EF}
/* Final */
.end{background:#fff;border-radius:30px;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(30,58,95,.08)}
.end .em{width:150px;margin:0 auto}
.estars{display:flex;justify-content:center;gap:8px;margin:10px 0}.estars span{width:52px;color:#E6E2EE}.estars span.on{color:#FFD36B;animation:jump .5s}
.end h2{font-size:26px}.end p{color:#6B6F86;font-size:14.5px;margin:6px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.row2 .go{margin:0;font-size:17px}.go.lt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px #E6E1F2}
#fx{position:fixed;left:0;right:0;top:40%;height:0;pointer-events:none;z-index:50}
#fx i{position:absolute;width:10px;height:14px;border-radius:3px;animation:conf 1.1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
[hidden]{display:none!important}
</style></head><body><div class="app">
<section id="s-home" hidden>
  <div class="top"><a class="pill" href="./#/lectoescritura"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Lectoescritura</a></div>
  <div class="hero"><span class="k">Lectoescritura</span><h1>La Feria de Mochi</h1><p>Juegos para leer sílabas y palabras, escuchando a Mochi.</p><div class="hm" id="h-mochi"></div></div>
  <div class="sub">Elige un juego</div>
  <div class="games" id="games"></div>
</section>
<section id="s-setup" hidden>
  <div class="top"><button type="button" class="pill" id="su-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Juegos</button></div>
  <div class="setup"><div class="sh"><span class="gart" id="su-art"></span><div><h2 id="su-title"></h2><p id="su-skill"></p></div></div>
  <div class="lbl">¿Con qué sílabas quieres jugar?</div><div class="vowels" id="vowels"></div>
  <button type="button" class="go" id="play">Jugar</button></div>
</section>
<section id="s-play" hidden>
  <div class="ph"><button type="button" class="x" id="p-close" aria-label="Salir"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><h3 id="p-title"></h3></div>
  <div class="dots" id="dots"></div>
  <div class="board"><div class="pm" id="pmochi"></div><div class="stage" id="stage"></div></div>
  <p class="msg" id="msg"></p>
</section>
<section id="s-end" hidden>
  <div class="end"><div class="em" id="e-mochi"></div><div class="estars" id="e-stars"></div><h2 id="e-title"></h2><p id="e-sub"></p>
  <div class="row2"><button type="button" class="go lt" id="e-other">Otro juego</button><button type="button" class="go" id="e-again">Otra vez</button></div></div>
</section>
</div><div id="fx"></div>
<script src="mova-auth.js"></script>

const wordsFor = v => Object.keys(WORDS).filter(w => v === "all" || WORDS[w].some(s => vowelOf(s) === v));
const sylsFor = v => {
  const vs = v === "all" ? ["a", "e", "i", "o", "u"] : [v];
  const out = []; CONS.forEach(c => vs.forEach(x => { const s = sylFor(c)(x); if (s) out.push(s); }));

  const out = [];

  shuffle(same).forEach(s => { if (out.length < n && !out.includes(s)) out.push(s); });
  shuffle(cands).forEach(s => { if (out.length < n && !out.includes(s)) out.push(s); });

/* ---------- Voz y sonidos ---------- */
const synth = ("speechSynthesis" in window) ? speechSynthesis : null; let voice = null;
function pv() { if (!synth) return; const vs = synth.getVoices(); voice = vs.find(v => /es[-_]MX/i.test(v.lang)) || vs.find(v => /es[-_](US|419)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null; }
if (synth) { pv(); synth.onvoiceschanged = pv; }
function speak(t, r) { if (!synth) return; try { synth.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "es-MX"; u.rate = r || .78; u.pitch = 1.12; if (voice) u.voice = voice; synth.speak(u); } catch (e) {} }
let ac = null;
function unlock() { try { if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); } if (ac && ac.state === "suspended") ac.resume(); } catch (e) {} }
function tones(f, step, type, vol) { if (!ac) return; const t0 = ac.currentTime; f.forEach((fr, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type || "sine"; o.frequency.value = fr; const s = t0 + i * step; g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(vol || .14, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + step + .12); o.connect(g).connect(ac.destination); o.start(s); o.stop(s + step + .15); }); }
const chime = () => tones([660, 880, 1175], .09, "triangle");
const pop = () => tones([520, 980], .05, "square", .08);
const buzz = () => tones([220, 180], .1, "sine", .1);
const fanfare = () => tones([523, 659, 784, 1046, 1318], .11, "triangle", .16);

/* ---------- Mochi ---------- */
const POSES = { lee: "mochi-lee.webp", hola: "mochi-hola.webp", salta: "mochi-salta.webp", piensa: "mochi-piensa.webp" };
Object.values(POSES).forEach(s => { const i = new Image(); i.src = s; });
function mochi(el, pose) { el.innerHTML = `<img class="mochi idle" src="${POSES[pose]}" alt="Mochi" draggable="false" data-base="${pose}">`; return el.firstChild; }
function react(ok) { const m = $("#pmochi img"); if (!m) return; clearTimeout(m._b); m.src = POSES[ok ? "salta" : "piensa"]; m.className = "mochi " + (ok ? "happy" : "sad"); m._b = setTimeout(() => { m.src = POSES[m.dataset.base]; m.className = "mochi idle"; }, 1400); }
const PRAISE = ["¡Muy bien!", "¡Excelente!", "¡Lo lograste!", "¡Bravo!", "¡Perfecto!", "¡Qué bien lees!"];
const RETRY = ["¡Casi! Inténtalo otra vez.", "Escucha bien y vuelve a intentarlo.", "Tú puedes, prueba de nuevo."];

/* ---------- Estado ---------- */
const st = { g: null, v: "a", round: 0, score: 0, first: true, lock: false, timers: [], moves: 0, pairs: 0 };
const later = (f, ms) => { const t = setTimeout(f, ms); st.timers.push(t); return t; };
function clear() { st.timers.forEach(clearTimeout); st.timers = []; if (synth) synth.cancel(); }
function show(id) { ["home", "setup", "play", "end"].forEach(s => $("#s-" + s).hidden = s !== id); window.scrollTo(0, 0); }

/* ---------- Pantallas ---------- */
function home() {
  clear(); show("home");
  $("#games").innerHTML = GAMES.map(g => `<button type="button" class="gcard" data-g="${g.id}" style="--c:${g.c};--s:${g.s}"><span class="gart">${gameArt(g.id)}</span><span class="gtx"><b>${g.name}</b><small>${g.skill}</small></span></button>`).join("");
}
function setup(g) {
  clear(); st.g = g; const G = GAMES.find(x => x.id === g); show("setup");
  $("#su-title").textContent = G.name; $("#su-skill").textContent = G.skill;
  $("#su-art").innerHTML = gameArt(g); $("#s-setup").style.setProperty("--c", G.c); $("#s-setup").style.setProperty("--s", G.s);
  $("#vowels").innerHTML = VOWELS.map(V => `<button type="button" class="vbtn${V.v === st.v ? " on" : ""}" data-v="${V.v}" style="--c:${V.c};--s:${V.s}"><span class="vl">${V.v === "all" ? "a e i o u" : V.v.toUpperCase()}</span><span class="vn">${V.name}</span></button>`).join("");
}
function start() {
  clear(); unlock(); st.round = 0; st.score = 0; st.moves = 0; st.pairs = 0; show("play");
  const G = GAMES.find(x => x.id === st.g);
  $("#s-play").style.setProperty("--c", G.c); $("#s-play").style.setProperty("--s", G.s);
  $("#p-title").textContent = G.name; mochi($("#pmochi"), "lee");
  $("#dots").innerHTML = st.g === "memorama" ? "" : Array.from({ length: ROUNDS }, (_, i) => `<i data-i="${i}"></i>`).join("");
  next();
}
function next() {
  st.first = true; st.lock = false;
  if (st.g !== "memorama" && st.round >= ROUNDS) return finish();
  $("#stage").className = "stage g-" + st.g;
  ({ globos, pesca, perdida, tren, memorama })[st.g]();
}
function mark(ok) {
  const d = $(`#dots i[data-i="${st.round}"]`); if (d) d.className = ok ? "ok" : "miss";
}
function right(after) {
  st.lock = true; chime(); react(true);
  if (st.first) st.score++; mark(st.first);
  $("#msg").textContent = pick(PRAISE); $("#msg").className = "msg ok";
  burst();
  later(() => { st.round++; $("#msg").textContent = ""; $("#msg").className = "msg"; next(); }, after || 1300);
}
function wrong(el) {
  st.first = false; buzz(); react(false);
  $("#msg").textContent = pick(RETRY); $("#msg").className = "msg bad";
  if (el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
}
function stars() {
  if (st.g === "memorama") return st.moves <= 8 ? 3 : st.moves <= 12 ? 2 : 1;
  return st.score >= 9 ? 3 : st.score >= 7 ? 2 : 1;
}
function finish() {
  clear(); show("end"); fanfare();
  const n = stars(), V = VOWELS.find(x => x.v === st.v), G = GAMES.find(x => x.id === st.g);
  mochi($("#e-mochi"), "salta");
  $("#e-stars").innerHTML = [1, 2, 3].map(k => `<span class="${k <= n ? "on" : ""}">${STAR}</span>`).join("");
  $("#e-title").textContent = n === 3 ? "¡Eres un campeón de la lectura!" : n === 2 ? "¡Muy buen trabajo!" : "¡Buen intento! Sigue practicando.";
  $("#e-sub").textContent = st.g === "memorama" ? `Encontraste las 6 parejas en ${st.moves} intentos.` : `${st.score} de ${ROUNDS} a la primera · ${V.name}`;
  speak(n >= 2 ? "¡Muy bien! Lo hiciste excelente." : "¡Buen intento! Vamos a practicar otra vez.");
  for (let i = 0; i < 3; i++) later(burst, i * 350);
  try {
    if (window.MovaAuth && MovaAuth.save) {
      const sc = st.g === "memorama" ? n : st.score, tot = st.g === "memorama" ? 3 : ROUNDS;
      MovaAuth.save("feria-mochi", G.name + " · " + V.name, sc, tot, { game: st.g, v: st.v, stars: n, moves: st.moves || undefined });
    }

/* ---------- 1. Atrapa la sílaba (globos) ---------- */
function globos() {
  const pool = sylsFor(st.v), target = pick(pool), opts = shuffle([target].concat(distractors(target, 3, pool)));
  const cols = ["#FF8FC8", "#8FB8FF", "#FFD36B", "#9BDDB5", "#C7B5FF"];
  $("#stage").innerHTML = `<div class="ask"><button type="button" class="say" id="say">${SPK}</button><div><b>Revienta el globo</b><small>Escucha la sílaba que dice Mochi</small></div></div>
  <div class="sky" id="sky">${opts.map((s, i) => `<button type="button" class="balloon" data-s="${s}" style="--x:${8 + i * 23}%;--d:${7 + Math.random() * 2.5}s;--dl:-${Math.random() * 5}s;--b:${cols[(i + st.round) % cols.length]}"><svg viewBox="0 0 80 120"><path d="M40 4C18 4 6 22 6 42c0 24 20 42 34 46 14-4 34-22 34-46C74 22 62 4 40 4Z" fill="var(--b)" stroke="#1E3A5F" stroke-width="3"/><path d="M22 22c4-8 12-11 18-11" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".6"/><path d="M34 88l6 8 6-8z" fill="var(--b)" stroke="#1E3A5F" stroke-width="2.5" stroke-linejoin="round"/><path d="M40 96c-6 8 6 14 0 22" stroke="#1E3A5F" stroke-width="2" fill="none"/></svg><span>${s}</span></button>`).join("")}</div>`;

/* ---------- 2. ¿Con qué empieza? (pesca) ---------- */
function pesca() {
  const w = pick(wordsFor(st.v)), target = WORDS[w][0];
  const pool = sylsFor(st.v === "all" ? vowelOf(target) : st.v).concat(Object.values(WORDS).map(x => x[0]));
  const opts = shuffle([target].concat(distractors(target, 3, [...new Set(pool)])));
  const fc = ["#FF9E7A", "#FFD36B", "#8FB8FF", "#C7B5FF"];
  $("#stage").innerHTML = `<div class="ask"><button type="button" class="say" id="say">${SPK}</button><div><b>¿Con qué sílaba empieza?</b><small>Pesca el pez correcto</small></div></div>

  <div class="pond" id="pond">${opts.map((s, i) => `<button type="button" class="fish${i % 2 ? " rev" : ""}" data-s="${s}" style="--y:${10 + i * 22}%;--d:${6 + Math.random() * 3}s;--dl:-${Math.random() * 6}s;--f:${fc[i]}"><svg viewBox="0 0 140 80"><path d="M100 40 L132 16 L128 40 L132 64Z" fill="var(--f)" stroke="#1E3A5F" stroke-width="3" stroke-linejoin="round"/><ellipse cx="62" cy="40" rx="50" ry="30" fill="var(--f)" stroke="#1E3A5F" stroke-width="3"/><circle cx="28" cy="34" r="5" fill="#1E3A5F"/><circle cx="29.5" cy="32.5" r="1.6" fill="#fff"/><path d="M60 14c8 6 8 46 0 52" stroke="#1E3A5F" stroke-width="2" fill="none" opacity=".25"/></svg><span>${s}</span></button>`).join("")}
  <svg class="weed w1" viewBox="0 0 40 90"><path d="M20 90C8 70 30 56 18 36S26 10 20 0" stroke="#7FB89E" stroke-width="6" fill="none" stroke-linecap="round"/></svg><svg class="weed w2" viewBox="0 0 40 90"><path d="M20 90C30 70 10 56 22 36S14 10 20 0" stroke="#9BDDB5" stroke-width="6" fill="none" stroke-linecap="round"/></svg></div>`;
  const sayIt = () => speak(w + ". ¿Con qué sílaba empieza " + w + "?", .78);
  $("#say").onclick = sayIt; $("#wsay").onclick = () => speak(w, .7); later(sayIt, 400);

    else wrong(f);
  };
}

/* ---------- 3. La sílaba perdida ---------- */
function perdida() {
  const w = pick(wordsFor(st.v)), syl = WORDS[w], hide = Math.floor(Math.random() * syl.length), target = syl[hide];
  const pool = [...new Set(sylsFor(vowelOf(target)).concat(Object.values(WORDS).flat()))];
  const opts = shuffle([target].concat(distractors(target, 2, pool)));
  $("#stage").innerHTML = `<div class="ask"><button type="button" class="say" id="say">${SPK}</button><div><b>¿Qué sílaba falta?</b><small>Completa la palabra del dibujo</small></div></div>
  <div class="lost"><div class="wcard big" id="lpic">${pic(w)}</div>
  <div class="slots">${syl.map((s, i) => i === hide ? `<span class="slot empty" id="slot">?</span>` : `<span class="slot">${s}</span>`).join("")}</div>
  <div class="opts" id="opts">${opts.map(s => `<button type="button" class="tile" data-s="${s}">${s}</button>`).join("")}</div></div>`;
  const sayIt = () => speak(w, .72);
  $("#say").onclick = sayIt; later(sayIt, 400);
  $("#opts").onclick = e => {
    const t = e.target.closest(".tile"); if (!t || st.lock) return;

      const sl = $("#slot"); sl.textContent = target; sl.className = "slot fill"; t.classList.add("used");

/* ---------- 4. El tren de las palabras ---------- */
function tren() {
  let w = pick(wordsFor(st.v)); const syl = WORDS[w]; let k = 0;
  const tiles = shuffle(syl.map((s, i) => ({ s, i })));
  $("#stage").innerHTML = `<div class="ask"><button type="button" class="say" id="say">${SPK}</button><div><b>Arma la palabra</b><small>Toca las sílabas en orden</small></div></div>
  <div class="train-wrap"><div class="wcard">${pic(w)}</div>
  <div class="track"><div class="train" id="train">${ENGINE}${syl.map((s, i) => `<span class="car" id="car${i}"><span class="cs"></span><i></i><i></i></span>`).join("")}</div></div>
  <div class="opts" id="opts">${tiles.map(t => `<button type="button" class="tile" data-s="${t.s}" data-i="${t.i}">${t.s}</button>`).join("")}</div></div>`;
  const sayIt = () => speak(w, .72);
  $("#say").onclick = sayIt; later(sayIt, 400);
  $("#opts").onclick = e => {
    const t = e.target.closest(".tile"); if (!t || st.lock || t.classList.contains("used")) return;
    if (t.dataset.s === syl[k]) {

      speak(syl[k], .7); k++;

    } else wrong(t);
  };
}

/* ---------- 5. Memorama de palabras ---------- */
function memorama() {
  $("#dots").innerHTML = "";
  let ws = shuffle(wordsFor(st.v)); if (ws.length < 6) ws = ws.concat(shuffle(Object.keys(WORDS).filter(x => !ws.includes(x)))).slice(0, 6); else ws = ws.slice(0, 6);
  const cards = shuffle(ws.flatMap(w => [{ w, t: "p" }, { w, t: "w" }]));
  $("#stage").innerHTML = `<div class="ask"><span class="say ghost">${STAR}</span><div><b>Encuentra las parejas</b><small>Une cada dibujo con su palabra · <span id="mv">0</span> intentos</small></div></div>
  <div class="mem" id="mem">${cards.map((c, i) => `<button type="button" class="mc" data-w="${c.w}" data-i="${i}"><span class="back">${MCARD}</span><span class="face ${c.t}">${c.t === "p" ? pic(c.w) : `<b>${c.w}</b>`}</span></button>`).join("")}</div>`;
  let open = [];
  $("#mem").onclick = e => {
    const c = e.target.closest(".mc"); if (!c || st.lock || c.classList.contains("up") || c.classList.contains("done")) return;
    c.classList.add("up"); pop(); open.push(c);
    const face = c.querySelector(".face"); if (face.classList.contains("w")) speak(c.dataset.w, .75);
    if (open.length === 2) {
      st.moves++; $("#mv").textContent = st.moves; st.lock = true;
      const [a, b] = open; open = [];
      if (a.dataset.w === b.dataset.w) {
        later(() => { a.classList.add("done"); b.classList.add("done"); chime(); react(true); speak(a.dataset.w, .75); st.pairs++; st.lock = false; burst();
          if (st.pairs === 6) later(finish, 1200); }, 450);
      } else later(() => { a.classList.remove("up"); b.classList.remove("up"); st.lock = false; react(false); }, 1100);
    }
  };
}

/* ---------- Confeti ---------- */

  for (let i = 0; i < 18; i++) {

    p.style.setProperty("--dx", (Math.random() - .5) * 360 + "px"); p.style.setProperty("--dy", -(140 + Math.random() * 220) + "px"); p.style.setProperty("--r", Math.random() * 720 + "deg");

}

document.addEventListener("click", e => {

  const v = e.target.closest(".vbtn"); if (v) { st.v = v.dataset.v; document.querySelectorAll(".vbtn").forEach(b => b.classList.toggle("on", b === v)); return; }
});
$("#play").onclick = start;
$("#su-back").onclick = home;
$("#p-close").onclick = () => setup(st.g);
$("#e-again").onclick = start;
$("#e-other").onclick = home;
(function boot() {
  mochi($("#h-mochi"), "hola");
  const q = new URLSearchParams(location.search), g = q.get("m"), v = q.get("v");
  if (v && VOWELS.some(x => x.v === v)) st.v = v;
  if (g && GAMES.some(x => x.id === g)) setup(g); else home();
})();
