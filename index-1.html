<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOVA Learning Studio</title>
<meta name="description" content="MOVA Learning Studio: English readings, games, and teaching resources by MOVA Centro Pedagógico.">
<meta name="theme-color" content="#F3EFE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MOVA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== Design tokens ===================== */
:root{
  --paper:#F3EFE8; --surface:#FFFDFA; --surface-2:#E9E4DB; --ink:#16181D; --ink-2:#4A4D55; --ink-3:#7A7D84; --line:#DAD4CA;
  --navy:#1E3A5F; --navy-ink:#FFFFFF; --navy-soft:#DCE5EF;
  --mint:#5E9E82; --mint-soft:#DDEEE5; --sky:#3F7FB5; --sky-soft:#DBE9F5; --mustard:#A97A14; --mustard-soft:#F5E7C5; --coral:#C35A3F; --coral-soft:#F7DDD4;
  --ok:#2E7050; --ok-soft:#DCEFE3; --bad:#B03C2E; --bad-soft:#F7DCD6;
  --chalk-mint:#7FB89E; --chalk-sky:#6FA8D6; --chalk-mustard:#E0B04A; --chalk-coral:#E8846B;
  --shadow:0 1px 1px rgba(22,24,29,.04),0 12px 28px -16px rgba(22,24,29,.28);
  --font-ui:"Poppins","Century Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-read:"Literata",Georgia,"Times New Roman",serif;
  --tabbar-h:66px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121417; --surface:#1B1E23; --surface-2:#252930; --ink:#F1EEE8; --ink-2:#C4C1BB; --ink-3:#8E8F94; --line:#30343B;
    --navy:#8DB4E2; --navy-ink:#0E1A2A; --navy-soft:#1E2B3B;
    --mint:#8CCBAE; --mint-soft:#1D2E27; --sky:#8DBEE6; --sky-soft:#1C2A38; --mustard:#E6BF63; --mustard-soft:#33291A; --coral:#EE9A80; --coral-soft:#3A241E;
    --ok:#8CCBAE; --ok-soft:#1D2E27; --bad:#F09A8B; --bad-soft:#3A2220;
    --shadow:0 1px 1px rgba(0,0,0,.2),0 12px 28px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121417; --surface:#1B1E23; --surface-2:#252930; --ink:#F1EEE8; --ink-2:#C4C1BB; --ink-3:#8E8F94; --line:#30343B;
  --navy:#8DB4E2; --navy-ink:#0E1A2A; --navy-soft:#1E2B3B;
  --mint:#8CCBAE; --mint-soft:#1D2E27; --sky:#8DBEE6; --sky-soft:#1C2A38; --mustard:#E6BF63; --mustard-soft:#33291A; --coral:#EE9A80; --coral-soft:#3A241E;
  --ok:#8CCBAE; --ok-soft:#1D2E27; --bad:#F09A8B; --bad-soft:#3A2220;
  --shadow:0 1px 1px rgba(0,0,0,.2),0 12px 28px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
img,svg{max-width:100%}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.ico{width:var(--s,22px);height:var(--s,22px);flex:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.narrow{max-width:720px;margin:0 auto;padding:0 20px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--navy);color:var(--navy-ink);border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 10px)}

/* ===================== Header & navigation ===================== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);margin-right:auto}
.logo b{font-weight:800;font-size:23px;letter-spacing:.04em}
.logo span{font-size:13px;font-weight:500;color:var(--ink-2)}
.logo i{display:inline-flex;gap:3px;margin-left:2px;transform:translateY(-3px)}
.logo i::before,.logo i::after,.logo i em{content:"";display:block;width:6px;height:6px;border-radius:50%}
.logo i::before{background:var(--chalk-coral)} .logo i em{background:var(--chalk-mustard)} .logo i::after{background:var(--chalk-sky)}
.nav{display:none;gap:4px}
.nav a{text-decoration:none;font-size:14.5px;font-weight:500;color:var(--ink-2);padding:8px 14px;border-radius:999px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.saved-link{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface)}
.saved-link[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.badge[hidden]{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;text-decoration:none;color:var(--ink-3);font-size:11.5px;font-weight:500}
.tabbar a[aria-current="page"]{color:var(--ink)}
.tabbar a[aria-current="page"] .ico{color:var(--navy)}
.tabbar a[aria-current="page"]::after{content:"";width:18px;height:3px;border-radius:3px;background:var(--navy);margin-top:1px}
main{display:block;padding-bottom:calc(var(--tabbar-h) + 40px);outline:none}
.site-foot{padding:28px 0 calc(var(--tabbar-h) + 28px);border-top:1px solid var(--line);color:var(--ink-3);font-size:13px;margin-top:-20px}
.site-foot .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
@media (min-width:860px){
  .nav{display:flex}
  .tabbar{display:none}
  main{padding-bottom:64px}
  .site-foot{padding-bottom:28px}
}

/* ===================== Type & generic blocks ===================== */
h1,h2,h3{line-height:1.15;margin:0;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:clamp(30px,6.4vw,46px);font-weight:700}
h2{font-size:clamp(21px,4vw,26px);font-weight:700}
h3{font-size:18px;font-weight:600}
p{margin:0}
.lead{font-size:17px;color:var(--ink-2);max-width:60ch}
.page-head{padding:32px 20px 18px}
.page-head h1{margin:4px 0 10px}
.kicker{font-size:14px;font-weight:600;color:var(--navy)}
.section{margin-top:44px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.section-head a{font-size:14.5px;font-weight:600;color:var(--navy);text-decoration:none;white-space:nowrap}
.section-head a:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid transparent;font-weight:600;font-size:15px;text-decoration:none;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--navy);color:var(--navy-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn-ghost[aria-pressed="true"]{border-color:var(--coral);color:var(--coral)}
.btn-ghost[aria-pressed="true"] .ico{fill:currentColor}
.btn-done{background:var(--surface);border-color:var(--line)}
.btn-done.is-done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14.5px;padding:8px 0;min-height:44px}
.back:hover{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.lvl::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.lvl[data-level="Pre-A1"]{background:var(--mint-soft);color:var(--mint)}
.lvl[data-level="A1"]{background:var(--sky-soft);color:var(--sky)}
.lvl[data-level="A2"]{background:var(--mustard-soft);color:var(--mustard)}
.lvl[data-level="B1"]{background:var(--coral-soft);color:var(--coral)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ===================== Home ===================== */
.hero{padding:36px 0 8px}
.hero .wrap{display:grid;gap:28px}
.hero-brand{font-size:15px;font-weight:600;color:var(--ink-2)}
.hero h1{font-size:clamp(46px,13vw,104px);font-weight:800;line-height:.98;letter-spacing:-.035em;margin:10px 0 0}
.hero h1 span{display:block;width:max-content;position:relative}
.hero h1 span::after{content:"";position:absolute;left:2px;right:-4px;bottom:.05em;height:.13em;border-radius:6px;z-index:-1;transform:rotate(-1.2deg);opacity:.85}
.hero h1 span:nth-child(1)::after{background:var(--chalk-coral)}
.hero h1 span:nth-child(2)::after{background:var(--chalk-mustard);transform:rotate(.8deg)}
.hero h1 span:nth-child(3)::after{background:var(--chalk-sky);transform:rotate(-.6deg)}
.hero h1 span::after{animation:chalk .7s cubic-bezier(.3,.7,.2,1) both;transform-origin:left center}
.hero h1 span:nth-child(2)::after{animation-delay:.18s} .hero h1 span:nth-child(3)::after{animation-delay:.36s}
@keyframes chalk{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.hero p.lead{margin-top:18px}
@media (min-width:980px){.hero .wrap{grid-template-columns:1.25fr 1fr;align-items:end;gap:48px}.hero{padding-top:56px}}
.hero h1{isolation:isolate}
.search{position:relative;max-width:560px}
.search .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px 0 48px;font-size:16px}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px var(--navy-soft)}
.search-results{margin-top:14px;display:grid;gap:8px;max-width:720px}
.sr-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.sr-item:hover{border-color:var(--ink-3)}
.sr-kind{font-size:12px;font-weight:600;color:var(--ink-3);min-width:74px}
.sr-title{font-weight:600}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:860px){.areas{grid-template-columns:repeat(4,1fr);gap:16px}}
.area{position:relative;display:flex;flex-direction:column;gap:10px;min-height:168px;padding:18px;border-radius:22px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.area:hover{border-color:var(--ink-3)}
.area-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.area h3{font-size:17px;margin-top:6px}
.area p{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.area[data-c="coral"] .area-mark{background:var(--coral-soft);color:var(--coral)}
.area[data-c="sky"] .area-mark{background:var(--sky-soft);color:var(--sky)}
.area[data-c="mustard"] .area-mark{background:var(--mustard-soft);color:var(--mustard)}
.area[data-c="mint"] .area-mark{background:var(--mint-soft);color:var(--mint)}
.progress-strip{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding:18px 20px;border-radius:22px;background:var(--ink);color:var(--paper)}
.progress-strip strong{font-size:28px;font-weight:700}
.progress-strip p{color:color-mix(in srgb,var(--paper) 75%,transparent);font-size:14px}
.progress-strip a{margin-left:auto;color:var(--paper);font-weight:600;font-size:14.5px}
.meter{flex:1 1 180px;height:8px;border-radius:8px;background:color-mix(in srgb,var(--paper) 20%,transparent);overflow:hidden}
.meter i{display:block;height:100%;background:var(--chalk-mustard);border-radius:8px}

/* ===================== Cards & grids ===================== */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:620px){.grid.cols{grid-template-columns:repeat(2,1fr)}}
@media (min-width:980px){.grid.cols{grid-template-columns:repeat(3,1fr)}}
.item{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.item:hover{border-color:var(--ink-3)}
.item-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:44px}
.item-title{font-size:18.5px;font-weight:600}
.item-title a{text-decoration:none}
.stretch::after{content:"";position:absolute;inset:0;border-radius:inherit}
.item-desc{font-size:14.5px;color:var(--ink-2);line-height:1.5}
.item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin-top:auto}
.done-tag{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:600}
.fav{position:relative;z-index:2;margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-3)}
.fav:hover{color:var(--coral);border-color:var(--coral)}
.fav[aria-pressed="true"]{color:var(--coral);border-color:var(--coral-soft);background:var(--coral-soft)}
.fav[aria-pressed="true"] .ico{fill:currentColor}

/* ===================== Filters ===================== */
.filters{display:grid;gap:12px;padding-bottom:6px}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.fchip{flex:none;height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.selects{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.select{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--ink-2)}
.select select{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-size:15px;color:var(--ink);appearance:auto}
.count{font-size:14px;color:var(--ink-3);margin:8px 0 12px}
.empty{padding:36px 22px;border-radius:18px;border:1.5px dashed var(--line);text-align:center;display:grid;gap:8px;justify-items:center;color:var(--ink-2)}
.empty strong{color:var(--ink);font-size:17px}
.empty .btn{margin-top:8px}

/* ===================== Reading view ===================== */
.reading-head{padding:16px 0 8px}
.reading-head h1{margin:12px 0 8px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.reading-text{font-family:var(--font-read);font-size:19px;line-height:1.85;margin-top:22px;padding:24px 22px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.reading-text p+p{margin-top:1em}
.reading-text[data-level="Pre-A1"]{font-size:23px;line-height:1.75}
.reading-text[data-level="A1"]{font-size:21px}
.block{margin-top:32px}
.block h2{margin-bottom:6px}
.block > p.hint{color:var(--ink-2);font-size:14.5px;margin-bottom:14px}
.vocab{display:grid;gap:10px;margin:14px 0 0;grid-template-columns:1fr}
@media (min-width:620px){.vocab{grid-template-columns:1fr 1fr}}
.vocab div{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--chalk-mustard)}
.vocab dt{font-weight:700;font-size:16.5px}
.vocab dd{margin:2px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.5}
.rq{border:0;margin:0 0 14px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rq legend{float:left;width:100%;font-weight:600;margin-bottom:10px;padding:0}
.rq legend span{color:var(--ink-3);margin-right:6px}
.rq-opts{clear:both;display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:15.5px;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--navy);flex:none;margin:0}
.opt:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}
.opt.is-correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.rq-note{margin-top:8px;font-size:14px;color:var(--ok);font-weight:500}
.result{margin-top:12px;padding:14px 16px;border-radius:14px;font-weight:600}
.result:empty{display:none}
.result.warn{background:var(--mustard-soft);color:var(--mustard)}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--sky-soft);color:var(--sky)}
.done-panel{margin-top:30px;padding:22px;border-radius:22px;background:var(--surface-2);display:grid;gap:12px;justify-items:start}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.pager a{display:grid;gap:2px;max-width:48%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:600;font-size:15px}
.pager a small{font-weight:500;color:var(--ink-3);font-size:12.5px}
.pager a:last-child{text-align:right;margin-left:auto}

/* ===================== Resource view & printable sheet ===================== */
.notes{margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--sky-soft);color:var(--ink);font-size:15px}
.notes strong{display:block;color:var(--sky);margin-bottom:4px;font-size:14px}
.print-hint{font-size:13.5px;color:var(--ink-3);margin-top:8px}
.sheet-wrap{margin-top:26px;overflow-x:auto;padding-bottom:6px}
.sheet{background:#fff;color:#1b1b1b;max-width:8.5in;margin:0 auto;padding:clamp(22px,6vw,0.6in);border-radius:6px;box-shadow:var(--shadow);font-family:var(--font-ui);font-size:14px;line-height:1.5}
.sheet-top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1b1b1b;padding-bottom:8px;font-size:12px}
.sheet-top b{font-size:15px;letter-spacing:.04em}
.sheet-name{display:flex;gap:18px;margin:14px 0 4px;font-size:13px;flex-wrap:wrap}
.sheet-name span{flex:1 1 140px;border-bottom:1px solid #999;padding-bottom:2px}
.sheet h2.sheet-title{color:#1b1b1b;font-size:24px;margin:16px 0 4px}
.sheet .sheet-instr{color:#444;font-size:14px}
.sb{margin-top:20px;break-inside:avoid}
.sb h3{color:#1b1b1b;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.sb h3::before{content:"";width:10px;height:10px;border-radius:3px;background:#E0B04A;flex:none}
.sb-rule{padding:12px 14px;border-left:4px solid #6FA8D6;background:#F1F6FB;border-radius:4px}
.sb-rule p+p{margin-top:4px}
.sb-bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1.5px dashed #aaa;border-radius:8px}
.sb-bank span{padding:3px 12px;border:1px solid #ccc;border-radius:999px;font-weight:500}
.sb table{width:100%;border-collapse:collapse;font-size:14px}
.sb th,.sb td{border:1px solid #999;padding:8px;text-align:left;height:34px;vertical-align:top}
.sb th{background:#F4F1EB;font-weight:600}
.sb ol{margin:0;padding-left:22px;display:grid;gap:10px}
.sb ol.letters{list-style:lower-alpha}
.blank{display:inline-block;min-width:110px;border-bottom:1.5px solid #333;margin:0 4px;transform:translateY(-3px)}
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px 24px}
.passage{padding:14px 16px;border:1px solid #ccc;border-radius:8px;font-family:var(--font-read);font-size:15px;line-height:1.75}
.passage h4{margin:0 0 6px;font-family:var(--font-ui);font-size:15px}
.passage p+p{margin-top:.6em}
.tf{list-style:none;padding-left:0;counter-reset:tf}.tf li{display:flex;justify-content:space-between;gap:12px;counter-increment:tf}.tf li>span:first-child::before{content:counter(tf) ". ";font-weight:600}
.tf-box{flex:none;width:58px;border-bottom:1.5px solid #333}
.planner{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.planner div{border:1.5px solid #aaa;border-radius:8px;min-height:74px;padding:8px 10px;font-weight:600;font-size:13px}
.planner div:last-child:nth-child(odd){grid-column:1/-1}
.lines div{height:30px;border-bottom:1px solid #999}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.cards div{border:1.5px dashed #999;margin:-0.75px;min-height:2.25in;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.cards b{font-size:22px}
.cards small{color:#555;font-size:12px}
.cards i{flex:1;width:100%;border:1px solid #ddd;border-radius:6px;display:grid;place-items:center;color:#aaa;font-style:normal;font-size:11px}
.sheet-foot{margin-top:24px;padding-top:8px;border-top:1px solid #ddd;font-size:11px;color:#777;display:flex;justify-content:space-between}
.key{margin-top:28px;padding-top:16px;border-top:2px dashed #bbb}
.key h3::before{background:#7FB89E}
.key ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px}

/* ===================== Games ===================== */
.game-card .art{height:120px;border-radius:14px;display:grid;place-items:center;font-size:40px;gap:6px;grid-auto-flow:column}
.game-card[data-c="coral"] .art{background:var(--coral-soft)}
.game-card[data-c="sky"] .art{background:var(--sky-soft)}
.game-card[data-c="mustard"] .art{background:var(--mustard-soft)}
.art .tile{width:46px;height:58px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow)}
.art .tile.dark{background:var(--ink);color:var(--paper);font-weight:800;font-size:16px}
.art .pill{padding:8px 12px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.game-head{display:grid;gap:8px;padding:12px 0 6px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.stat{flex:1 1 100px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.stat small{display:block;color:var(--ink-3);font-size:12.5px}
.stat b{font-size:20px}
.bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--navy);border-radius:8px;transition:width .35s}
.live{min-height:24px;font-weight:500;color:var(--ink-2);margin:8px 0}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto}
.mcard{aspect-ratio:3/4;padding:0;border:0;background:none;perspective:900px;border-radius:14px}
.mcard-inner{position:relative;display:block;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.mcard.is-flipped .mcard-inner,.mcard.is-matched .mcard-inner{transform:rotateY(180deg)}
.mcard-back,.mcard-front{position:absolute;inset:0;display:grid;place-items:center;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:4px;text-align:center}
.mcard-back{background:var(--ink);color:var(--paper);font-weight:800;font-size:18px;letter-spacing:.06em;background-image:radial-gradient(color-mix(in srgb,var(--paper) 14%,transparent) 1.4px,transparent 1.8px);background-size:12px 12px}
.mcard-front{transform:rotateY(180deg);background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.mcard-front.word{font-weight:600;font-size:clamp(13px,3.8vw,18px)}
.mcard-front.pic{padding:8px}.mcard-front.pic svg{width:100%;height:auto;max-width:92px}.art .tile svg{width:40px;height:40px}
.mcard.is-matched .mcard-front{border-color:var(--mint);background:var(--mint-soft)}
.wm{display:grid;grid-template-columns:.85fr 1.15fr;gap:10px}
.wm-col{display:grid;gap:8px;align-content:start}
.wm-item{min-height:56px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:14.5px;line-height:1.35;transition:background .15s,border-color .15s}
.wm-item.word{font-weight:600;font-size:16px}
.wm-item[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft)}
.wm-item.is-matched{border-color:var(--mint);background:var(--mint-soft);color:var(--ink-2);cursor:default}
.wm-item.is-wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qz{padding:22px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.qz-num{font-size:13.5px;color:var(--ink-3);font-weight:500}
.qz-q{font-size:clamp(20px,5vw,26px);margin:6px 0 18px;outline:none}
.qz-opts{display:grid;gap:10px}
@media (min-width:620px){.qz-opts{grid-template-columns:1fr 1fr}}
.qz-opt{min-height:58px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);font-size:16.5px;font-weight:500;text-align:left}
.qz-opt:hover:not([disabled]){border-color:var(--navy)}
.qz-opt.is-correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.qz-opt.is-wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.qz-opt[disabled]{cursor:default}
.qz-feedback{min-height:26px;margin-top:14px;font-weight:600}
.qz-feedback.good{color:var(--ok)} .qz-feedback.bad{color:var(--bad)}
.win{padding:30px 22px;border-radius:22px;background:var(--ink);color:var(--paper);text-align:center;display:grid;gap:10px;justify-items:center}
.win h2{color:var(--paper);font-size:clamp(26px,6vw,34px)}
.win p{color:color-mix(in srgb,var(--paper) 78%,transparent)}
.win .big{font-size:52px;font-weight:800;line-height:1;color:var(--chalk-mustard)}
.win .btn-primary{background:var(--paper);color:var(--ink);margin-top:8px}
.game-controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* ===================== Shop ===================== */
.cover{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--c1);color:var(--ct);padding:16px;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate;box-shadow:0 1px 0 rgba(0,0,0,.05),0 18px 30px -20px rgba(0,0,0,.5)}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none}
.cover[data-motif="dots"]::before{background-image:radial-gradient(var(--c2) 2.2px,transparent 2.7px);background-size:18px 18px;-webkit-mask-image:linear-gradient(to bottom,transparent 35%,#000);mask-image:linear-gradient(to bottom,transparent 35%,#000);opacity:.8}
.cover[data-motif="lines"]::before{background:repeating-linear-gradient(0deg,transparent 0 17px,var(--c2) 17px 18px);opacity:.28}
.cover[data-motif="grid"]::before{background-image:linear-gradient(var(--c2) 1px,transparent 1px),linear-gradient(90deg,var(--c2) 1px,transparent 1px);background-size:24px 24px;opacity:.28}
.cover[data-motif="stripes"]::before{background:repeating-linear-gradient(135deg,var(--c2) 0 2px,transparent 2px 15px);opacity:.3}
.cover[data-motif="arcs"]::before{background:radial-gradient(circle at 100% 100%,transparent 0 28%,var(--c2) 28% 29.5%,transparent 29.5% 41%,var(--c2) 41% 42.5%,transparent 42.5% 54%,var(--c2) 54% 55.5%,transparent 55.5%);opacity:.7}
.cover[data-motif="blocks"]::before{background:linear-gradient(var(--c2),var(--c2)) 0 100%/38% 22% no-repeat,linear-gradient(var(--c2),var(--c2)) 100% 0/22% 30% no-repeat;opacity:.55}
.cover-brand{font-weight:800;letter-spacing:.08em;font-size:13px}
.cover-title{font-family:var(--font-ui);font-weight:700;font-size:clamp(19px,4.2vw,24px);line-height:1.1;max-width:90%}
.cover-glyph{position:absolute;right:10px;bottom:28px;font-family:var(--font-read);font-size:96px;line-height:1;opacity:.16;z-index:-1}
.cover-foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;opacity:.9}
.shop-grid{display:grid;gap:22px 16px;grid-template-columns:1fr 1fr}
@media (min-width:860px){.shop-grid{grid-template-columns:repeat(3,1fr);gap:28px 22px}}
.product{position:relative;display:grid;gap:10px;align-content:start}
.product h3{font-size:16px}
.product h3 a{text-decoration:none}
.product p{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.product .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.soon{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.demo-note{padding:14px 16px;border-radius:14px;border:1.5px dashed var(--line);color:var(--ink-2);font-size:14.5px;margin-bottom:22px}
.pdetail{display:grid;gap:24px;padding-top:10px}
@media (min-width:860px){.pdetail{grid-template-columns:340px 1fr;gap:44px;align-items:start}}
.pdetail .cover{max-width:340px;width:100%}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:16px 0;font-size:15px}
.facts dt{color:var(--ink-3)} .facts dd{margin:0;font-weight:500}
.includes{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;color:var(--ink-2)}

.install-btn{height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--navy);color:var(--navy-ink);font-weight:600;font-size:13.5px}.install-btn[hidden]{display:none}
/* ===================== Toast ===================== */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:500;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:860px){.toast{bottom:28px}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ===================== Print (letter size) ===================== */
@page{size:letter;margin:.5in}
@media print{
  :root{padding:0}
  body{background:#fff;color:#000}
  body::before,.no-print,.topbar,.tabbar,.site-foot,.toast{display:none!important}
  main{padding:0}
  .sheet-wrap{margin:0;overflow:visible;padding:0}
  .sheet{box-shadow:none;border-radius:0;padding:0;max-width:none;font-size:13px}
  .key{break-before:page;border-top:0;margin-top:0;padding-top:0}
  .cards div{min-height:1.9in}
  .sb-cards{break-inside:auto;margin-top:12px}
  .cards div{break-inside:avoid}
}
</style>

/* ---------- Utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const blanks = (s) => esc(s).replace(/_{3,}/g, '<span class="blank" aria-label="blank"></span>');
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, rand = Math.random) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const matchesQuery = (q, fields) => { const n = norm(q).trim(); if (!n) return true; const hay = norm(fields.join(" ")); return n.split(/\s+/).every((t) => hay.includes(t)); };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ---------- Local storage (only on this device, no personal data) ---------- */
const STORE_KEY = "mova-learning-studio:v1";
const defaults = () => ({ favorites: { reading: [], resource: [], product: [] }, completed: [], best: { memory: null, matching: null, quiz: null } });
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaults();
    const p = JSON.parse(raw), d = defaults();
    const fav = p && p.favorites ? p.favorites : {};
    return {
      favorites: { reading: Array.isArray(fav.reading) ? fav.reading : [], resource: Array.isArray(fav.resource) ? fav.resource : [], product: Array.isArray(fav.product) ? fav.product : [] },
      completed: Array.isArray(p.completed) ? p.completed : [],
      best: Object.assign(d.best, p.best || {})
    };
  } catch (e) { return defaults(); }
}
let state = loadState();
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable: app keeps working in memory */ } }
const isFav = (k, id) => state.favorites[k].includes(id);
const isDone = (id) => state.completed.includes(id);
const savedTotal = () => state.favorites.reading.length + state.favorites.resource.length + state.favorites.product.length;

          <fieldset class="rq" data-q="${qi}">
            <legend><span>${qi + 1}.</span>${esc(q.q)}</legend>
            <div class="rq-opts">${q.opts.map((o) => `<label class="opt"><input type="radio" name="q${qi}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>
          </fieldset>`).join("")}</div>
        <div class="actions"><button class="btn btn-primary" type="button" id="rq-check">Check answers</button><button class="btn btn-ghost" type="button" id="rq-reset" hidden>${ico("refresh", 18)} Try again</button></div>
        <p class="result" id="rq-result" role="status"></p>
      </section>

      <div class="done-panel">
        <h2>Finished reading?</h2>
        <p>Mark it as completed to track your progress on this device.</p>
        ${doneBtn(r.id)}
      </div>
      <nav class="pager" aria-label="More readings">

        ${next ? `<a href="#/library/${next.id}"><small>Next</small>${esc(next.title)}</a>` : ""}
      </nav>
    </article>`,
    mount(root) {
      const check = $("#rq-check", root), reset = $("#rq-reset", root), result = $("#rq-result", root);
      check.addEventListener("click", () => {
        const sets = $$(".rq", root);
        const missing = sets.filter((f) => !$("input:checked", f));
        if (missing.length) {
          result.className = "result warn";
          result.textContent = `Answer all 5 questions to check your work. ${plural(missing.length, "question is", "questions are")} still empty.`;
          $("input", missing[0]).focus();
          return;
        }
        let score = 0;
        sets.forEach((f, qi) => {
          const chosen = $("input:checked", f).value, correct = qs[qi].correct;
          $$(".opt", f).forEach((l) => {
            const v = $("input", l).value;
            if (v === correct) l.classList.add("is-correct");
            else if (v === chosen) l.classList.add("is-wrong");
            $("input", l).disabled = true;
          });
          if (chosen === correct) score++;
          else f.insertAdjacentHTML("beforeend", `<p class="rq-note">Correct answer: ${esc(correct)}</p>`);
        });
        result.className = `result ${score === 5 ? "good" : score >= 3 ? "mid" : "warn"}`;
        result.textContent = score === 5
          ? `Excellent! You got 5 of 5 correct.${isDone(r.id) ? "" : " You can mark this reading as completed."}`
          : `You got ${score} of 5 correct. Read the text again and try once more.`;
        check.hidden = true; reset.hidden = false;
      });
      reset.addEventListener("click", () => {
        $$(".rq", root).forEach((f) => { $$(".rq-note", f).forEach((n) => n.remove()); $$(".opt", f).forEach((l) => { l.classList.remove("is-correct", "is-wrong"); const inp = $("input", l); inp.disabled = false; inp.checked = false; }); });
        result.textContent = ""; result.className = "result"; check.hidden = false; reset.hidden = true;
        $(".rq input", root).focus();
      });
    }
  };
}

function renderBlock(b) {
  const h = b.label ? `<h3>${esc(b.label)}</h3>` : "";
  switch (b.t) {
    case "rule": return `<div class="sb"><div class="sb-rule">${b.lines.map((l) => `<p>${esc(l)}</p>`).join("")}</div></div>`;
    case "bank": return `<div class="sb">${h}<div class="sb-bank">${b.words.map((w) => `<span>${esc(w)}</span>`).join("")}</div></div>`;
    case "table": {
      const rows = Array.isArray(b.rows) ? b.rows : Array.from({ length: b.rows }, () => b.headers.map(() => ""));
      return `<div class="sb">${h}<table><thead><tr>${b.headers.map((x) => `<th scope="col">${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    case "items": return `<div class="sb">${h}<ol>${b.list.map((x) => `<li>${blanks(x)}</li>`).join("")}</ol></div>`;
    case "match": return `<div class="sb">${h}<div class="match"><ol>${b.left.map((x) => `<li><b>${esc(x)}</b> <span class="blank" style="min-width:40px"></span></li>`).join("")}</ol><ol class="letters">${b.right.map((x) => `<li>${esc(x)}</li>`).join("")}</ol></div></div>`;
    case "passage": return `<div class="sb"><div class="passage"><h4>${esc(b.title)}</h4>${b.text.map((p) => `<p>${esc(p)}</p>`).join("")}</div></div>`;
    case "tf": return `<div class="sb">${h}<ol class="tf">${b.list.map((x) => `<li><span>${esc(x)}</span><span class="tf-box"></span></li>`).join("")}</ol></div>`;
    case "planner": return `<div class="sb">${h}<div class="planner">${b.boxes.map((x) => `<div>${esc(x)}</div>`).join("")}</div></div>`;
    case "lines": return `<div class="sb">${h}<div class="lines">${"<div></div>".repeat(b.count)}</div></div>`;

    default: return "";
  }

let timers = [];
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

function gameShell(g, instructions, statsHTML, boardHTML) {
  return `<section class="narrow">
    <div class="game-head">
      <a class="back" href="#/games">${ico("back", 18)} All games</a>

  </section>`;
}
const stat = (label, id, val) => `<div class="stat"><small>${label}</small><b id="${id}">${val}</b></div>`;

function viewMemory() {
  const g = byId(GAMES, "memory");
  return {
    title: g.title,
    html: gameShell(g, "Tap two cards to flip them. Match each word with its picture. Find all 8 pairs in as few moves as you can.",
      stat("Moves", "mem-moves", 0) + stat("Pairs", "mem-pairs", "0/8") + stat("Best", "mem-best", state.best.memory ?? "–"),
      `<p class="live" id="mem-live" aria-live="polite"></p>
       <div class="mem-grid" id="mem-board"></div>
       <div id="mem-result" hidden></div>
       <div class="game-controls"><button class="btn btn-ghost" type="button" id="mem-restart">${ico("refresh", 18)} Restart</button></div>`),
    mount(root) {
      const board = $("#mem-board", root), live = $("#mem-live", root), result = $("#mem-result", root);
      let deck, first, lock, moves, matched;
      const say = (t) => { live.textContent = t; };
      const update = () => { $("#mem-moves", root).textContent = moves; $("#mem-pairs", root).textContent = `${matched}/${MEMORY_PAIRS.length}`; };
      const faceLabel = (i) => deck[i].kind === "word" ? `Word: ${deck[i].key}` : `Picture of ${deck[i].key}`;
      function setFace(i, open) { const el = board.children[i]; el.classList.toggle("is-flipped", open); el.setAttribute("aria-label", open ? faceLabel(i) : `Card ${i + 1}, face down`); }
      function start() {
        clearTimers();
        deck = shuffle(MEMORY_PAIRS.flatMap((p) => [{ key: p.word, kind: "word", label: p.word }, { key: p.word, kind: "pic", label: p.word }]));
        first = null; lock = false; moves = 0; matched = 0;
        board.innerHTML = deck.map((c, i) => `<button type="button" class="mcard" data-i="${i}" aria-label="Card ${i + 1}, face down"><span class="mcard-inner"><span class="mcard-back" aria-hidden="true">MOVA</span><span class="mcard-front ${c.kind}" aria-hidden="true">${c.kind === "pic" ? ILLUSTRATIONS[c.key] : esc(c.label)}</span></span></button>`).join("");
        board.hidden = false; result.hidden = true; result.innerHTML = "";
        update(); say("Find the pairs. Tap a card to start.");
      }
      board.addEventListener("click", (e) => {
        const b = e.target.closest(".mcard");
        if (!b || lock || b.classList.contains("is-flipped") || b.classList.contains("is-matched")) return;
        const i = +b.dataset.i;
        setFace(i, true);
        if (first === null) { first = i; return; }
        const a = first; first = null; moves++; update();
        if (deck[a].key === deck[i].key) {
          [a, i].forEach((k) => { const el = board.children[k]; el.classList.add("is-matched"); el.setAttribute("aria-disabled", "true"); el.setAttribute("aria-label", `${deck[k].key}, matched`); });
          matched++; update(); say(`Match! “${deck[i].key}”.`);
          if (matched === MEMORY_PAIRS.length) later(win, 600);
        } else {
          lock = true; say("Not a match. Try again.");
          later(() => { setFace(a, false); setFace(i, false); lock = false; }, 950);
        }
      });
      function win() {
        const prev = state.best.memory, isBest = prev === null || moves < prev;
        if (isBest) { state.best.memory = moves; persist(); $("#mem-best", root).textContent = moves; }
        board.hidden = true; result.hidden = false;
        result.innerHTML = `<div class="win"><p class="big">${moves}</p><h2>You found all the pairs!</h2><p>${isBest ? "That is your best score so far." : `Your best score is ${prev} moves.`}</p><button class="btn btn-primary" type="button" id="mem-again">${ico("refresh", 18)} Play again</button></div>`;
        say(`You won in ${moves} moves.`);
        $("#mem-again", root).addEventListener("click", start);
        $("#mem-again", root).focus();
      }
      $("#mem-restart", root).addEventListener("click", start);
      start();
    }
  };
}

function viewMatching() {
  const g = byId(GAMES, "matching"), N = 6;
  return {
    title: g.title,
    html: gameShell(g, "Tap a word, then tap its meaning. You get 10 points for each correct match and lose 2 for each mistake.",
      stat("Score", "wm-score", 0) + stat("Matched", "wm-prog", `0/${N}`) + stat("Best", "wm-best", state.best.matching ?? "–"),
      `<div class="bar"><i id="wm-bar"></i></div>
       <p class="live" id="wm-live" aria-live="polite"></p>
       <div class="wm" id="wm-play"><div class="wm-col" id="wm-left" role="group" aria-label="Words"></div><div class="wm-col" id="wm-right" role="group" aria-label="Meanings"></div></div>
       <div id="wm-result" hidden></div>
       <div class="game-controls"><button class="btn btn-ghost" type="button" id="wm-restart">${ico("refresh", 18)} New round</button></div>`),
    mount(root) {
      const L = $("#wm-left", root), R = $("#wm-right", root), play = $("#wm-play", root), result = $("#wm-result", root), live = $("#wm-live", root);
      let set, sel, matched, score, mistakes;
      const say = (t) => { live.textContent = t; };
      const update = () => { $("#wm-score", root).textContent = score; $("#wm-prog", root).textContent = `${matched}/${N}`; $("#wm-bar", root).style.width = `${(matched / N) * 100}%`; };
      function start() {
        clearTimers();
        set = shuffle(MATCH_POOL).slice(0, N); sel = null; matched = 0; score = 0; mistakes = 0;
        L.innerHTML = shuffle(set).map((p) => `<button type="button" class="wm-item word" data-side="L" data-key="${esc(p.word)}" aria-pressed="false">${esc(p.word)}</button>`).join("");
        R.innerHTML = shuffle(set).map((p) => `<button type="button" class="wm-item def" data-side="R" data-key="${esc(p.word)}" aria-pressed="false">${esc(p.def)}</button>`).join("");
        play.hidden = false; result.hidden = true; update(); say("Choose a word, then choose its meaning.");
      }
      play.addEventListener("click", (e) => {
        const b = e.target.closest(".wm-item");
        if (!b || b.classList.contains("is-matched") || b.classList.contains("is-wrong")) return;
        if (sel === b) { b.setAttribute("aria-pressed", "false"); sel = null; return; }
        if (!sel || sel.dataset.side === b.dataset.side) {
          if (sel) sel.setAttribute("aria-pressed", "false");
          sel = b; b.setAttribute("aria-pressed", "true"); return;
        }
        const a = sel; sel = null; a.setAttribute("aria-pressed", "false");
        if (a.dataset.key === b.dataset.key) {
          [a, b].forEach((x) => { x.classList.add("is-matched"); x.setAttribute("aria-disabled", "true"); });
          matched++; score += 10; update(); say(`Correct! “${a.dataset.key}” is matched.`);
          if (matched === N) later(finish, 500);
        } else {
          mistakes++; score = Math.max(0, score - 2); update(); say("Not quite. Try again.");
          [a, b].forEach((x) => x.classList.add("is-wrong"));
          later(() => [a, b].forEach((x) => x.classList.remove("is-wrong")), 650);
        }
      });
      function finish() {
        const prev = state.best.matching, isBest = prev === null || score > prev;
        if (isBest) { state.best.matching = score; persist(); $("#wm-best", root).textContent = score; }
        play.hidden = true; result.hidden = false;
        result.innerHTML = `<div class="win"><p class="big">${score}</p><h2>Round complete!</h2><p>${plural(mistakes, "mistake", "mistakes")}. ${isBest ? "New best score!" : `Your best score is ${prev} points.`}</p><button class="btn btn-primary" type="button" id="wm-again">${ico("refresh", 18)} Play again with new words</button></div>`;
        say(`Round complete with ${score} points.`);
        $("#wm-again", root).addEventListener("click", start);
        $("#wm-again", root).focus();
      }
      $("#wm-restart", root).addEventListener("click", start);
      start();
    }
  };
}

function viewQuiz() {
  const g = byId(GAMES, "quiz"), N = 8;
  return {
    title: g.title,
    html: gameShell(g, "Read each question and tap the correct answer. You will see right away if you are correct.",

      `<div class="bar"><i id="qz-bar"></i></div>
       <div class="qz" id="qz-stage"></div>
       <div id="qz-result" hidden></div>`),
    mount(root) {
      const stage = $("#qz-stage", root), result = $("#qz-result", root);
      let qs, idx, score, answered;
      function start() {
        qs = shuffle(QUIZ_BANK).slice(0, N).map((q) => ({ q: q.q, correct: q.options[0], opts: shuffle(q.options) }));
        idx = 0; score = 0; stage.hidden = false; result.hidden = true; show(false);
      }
      function show(focus = true) {
        const q = qs[idx]; answered = false;
        $("#qz-prog", root).textContent = `${idx + 1}/${N}`; $("#qz-score", root).textContent = score; $("#qz-bar", root).style.width = `${(idx / N) * 100}%`;
        stage.innerHTML = `<p class="qz-num">Question ${idx + 1} of ${N}</p><h2 class="qz-q" tabindex="-1">${esc(q.q)}</h2>

        if (focus) $(".qz-q", stage).focus();

        if (e.target.closest("#qz-next")) { idx++; idx < N ? show() : finish(); return; }
        const b = e.target.closest(".qz-opt");
        if (!b || answered) return;
        answered = true;
        const q = qs[idx], right = b.dataset.o === q.correct;
        $$(".qz-opt", stage).forEach((x) => { x.disabled = true; if (x.dataset.o === q.correct) x.classList.add("is-correct"); });
        const fb = $(".qz-feedback", stage);

        else { b.classList.add("is-wrong"); fb.className = "qz-feedback bad"; fb.textContent = `Not quite. The answer is “${q.correct}”.`; }
        $("#qz-score", root).textContent = score;
        $("#qz-next-wrap", stage).innerHTML = `<button class="btn btn-primary" type="button" id="qz-next">${idx + 1 < N ? "Next question" : "See my results"}</button>`;
        $("#qz-next", stage).focus();
      });
      function finish() {
        $("#qz-bar", root).style.width = "100%";
        const prev = state.best.quiz, isBest = prev === null || score > prev;
        if (isBest) { state.best.quiz = score; persist(); $("#qz-best", root).textContent = score; }
        const msg = score === N ? "Perfect score! Amazing work." : score >= 6 ? "Great job! You know a lot of words." : score >= 4 ? "Good effort. Practice a little more and try again." : "Keep practicing. Every game helps you learn.";
        stage.hidden = true; result.hidden = false;
        result.innerHTML = `<div class="win"><p class="big">${score}/${N}</p><h2>${msg}</h2><p>${isBest && prev !== null ? "New best score!" : prev !== null ? `Your best score is ${prev} of ${N}.` : "Play again to beat your score."}</p><button class="btn btn-primary" type="button" id="qz-again">${ico("refresh", 18)} Play again</button></div>`;
        $("#qz-again", root).addEventListener("click", start);
        $("#qz-again", root).focus();
      }
      start();
    }
  };
}

    </section>`,
    mount(root) {
      const out = $("#shop-results", root), count = $("#shop-count", root);
      const update = () => {
        const list = PRODUCTS.filter((p) => shopF.level === "all" || p.levels.includes(shopF.level));
        count.textContent = `Showing ${plural(list.length, "pack", "packs")}`;
        out.innerHTML = list.length ? list.map(productCard).join("") : emptyState("No packs for this level yet.", "Choose another level to see more packs.");
      };
      $$(".fchip", root).forEach((b) => b.addEventListener("click", () => { shopF.level = b.dataset.level; $$(".fchip", root).forEach((x) => x.setAttribute("aria-pressed", x === b)); update(); }));
      update();
    }
  };
}
function viewProduct(id) {
  const p = byId(PRODUCTS, id);
  if (!p) return viewNotFound("We couldn’t find that pack.", "#/shop", "Back to the shop");
  const sample = byId(RESOURCES, p.sample);
  return {
    title: p.name,
    html: `
    <section class="wrap">
      <a class="back" href="#/shop">${ico("back", 18)} Printable Shop</a>
      <div class="pdetail">
        ${coverHTML(p)}
        <div>
          <div class="chips">${p.levels.map(lvlChip).join("")}<span class="soon">Coming soon</span></div>
          <h1 style="margin:12px 0 10px">${esc(p.name)}</h1>
          <p class="lead">${esc(p.description)}</p>
          <dl class="facts"><dt>Level</dt><dd>${esc(levelSpan(p.levels))}</dd><dt>Format</dt><dd>${esc(p.format)}</dd><dt>Status</dt><dd>In preparation</dd></dl>
          <h2 style="font-size:18px">What the pack will include</h2>
          <ul class="includes">${p.includes.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
          <div class="actions" style="margin-top:22px">
            ${sample ? `<a class="btn btn-primary" href="#/resources/${sample.id}">${ico("file", 20)} Try a free sample</a>` : ""}
            ${favBtnWide("product", p.id, p.name)}
          </div>
          <p class="print-hint">Purchases are not available yet. Save this pack to find it quickly later.</p>
        </div>
      </div>
    </section>`
  };
}

/* Saved */
function viewSaved() {
  const rs = state.favorites.reading.map((id) => byId(READINGS, id)).filter(Boolean);
  const res = state.favorites.resource.map((id) => byId(RESOURCES, id)).filter(Boolean);
  const ps = state.favorites.product.map((id) => byId(PRODUCTS, id)).filter(Boolean);
  const total = rs.length + res.length + ps.length;
  const group = (title, items, render, cls = "grid cols") => items.length ? `<section class="section"><div class="section-head"><h2>${title}</h2></div><div class="${cls}">${items.map(render).join("")}</div></section>` : "";
  return {
    title: "Saved",
    html: `
    <section class="page-head wrap">
      <p class="kicker">Saved</p>
      <h1>Your saved items</h1>
      <p class="lead">Saved items stay on this device only. No account or personal information is needed.</p>
    </section>
    <div class="wrap">${total ? group("Readings", rs, readingCard) + group("Teacher resources", res, resourceCard) + group("Printable packs", ps, productCard, "shop-grid")
      : `<div class="empty"><strong>Nothing saved yet.</strong><p>Tap the heart on any reading, resource, or pack to keep it here.</p><a class="btn btn-primary" href="#/library">Browse the Reading Library</a></div>`}</div>`
  };
}

function viewNotFound(msg = "This page doesn’t exist.", href = "#/", label = "Go to the home page") {
  return { title: "Not found", html: `<section class="page-head wrap"><h1>Page not found</h1><p class="lead">${esc(msg)}</p><p style="margin-top:18px"><a class="btn btn-primary" href="${href}">${esc(label)}</a></p></section>` };
}

/* ---------- Router ---------- */
const ROUTES = {
  "": () => viewHome(),
  library: (p) => (p[0] ? viewReading(p[0]) : viewLibrary()),
  resources: (p) => (p[0] ? viewResource(p[0]) : viewResources()),
  games: (p) => (!p[0] ? viewGames() : p[0] === "memory" ? viewMemory() : p[0] === "matching" ? viewMatching() : p[0] === "quiz" ? viewQuiz() : viewNotFound("We couldn’t find that game.", "#/games", "See all games")),
  shop: (p) => (p[0] ? viewProduct(p[0]) : viewShop()),
  saved: () => viewSaved()
};
let firstRender = true;
function router() {
  clearTimers();
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map((s) => { try { return decodeURIComponent(s); } catch (e) { return s; } });
  const key = parts[0] || "";
  const main = $("#main");
  let view;
  try { view = ROUTES[key] ? ROUTES[key](parts.slice(1)) : viewNotFound(); }
  catch (err) { console.error(err); view = viewNotFound("Something went wrong while opening this page. Please go back and try again."); }
  main.innerHTML = view.html;
  document.title = (view.title ? `${view.title} | ` : "") + "MOVA Learning Studio";
  $$("[data-nav]").forEach((a) => { if (a.dataset.nav === key) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (view.mount) view.mount(main);
  window.scrollTo(0, 0);
  if (!firstRender) { const h = main.querySelector("h1"); if (h) { h.setAttribute("tabindex", "-1"); h.style.outline = "none"; h.focus({ preventScroll: true }); } }
  firstRender = false;
}

/* ---------- Global actions ---------- */
function updateSavedBadge() { const n = savedTotal(), b = $("#saved-count"); b.textContent = n; b.hidden = n === 0; }
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const a = t.dataset.action;
  if (a === "skip") { $("#main").focus(); return; }
  if (a === "print") {
    try { window.print(); } catch (err) { toast("Printing isn’t available here. Open this page in Chrome to print."); }
    return;
  }
  if (a === "fav") {
    e.preventDefault(); e.stopPropagation();
    const kind = t.dataset.kind, id = t.dataset.id, list = state.favorites[kind];
    const on = !list.includes(id);
    state.favorites[kind] = on ? [...list, id] : list.filter((x) => x !== id);
    persist(); updateSavedBadge();
    $$(`[data-action="fav"][data-kind="${kind}"]`).filter((b) => b.dataset.id === id).forEach((b) => {
      b.setAttribute("aria-pressed", on);
      const txt = $(".fav-text", b);
      if (txt) txt.textContent = on ? "Saved" : "Save";
      else b.setAttribute("aria-label", `${on ? "Remove from saved" : "Save"}: ${b.dataset.label}`);
    });
    toast(on ? "Saved" : "Removed from saved");
    if (location.hash.startsWith("#/saved")) router();
    return;
  }
  if (a === "done") {
    const id = t.dataset.id, on = !isDone(id);
    state.completed = on ? [...state.completed, id] : state.completed.filter((x) => x !== id);
    persist();
    $$('[data-action="done"]').filter((b) => b.dataset.id === id).forEach((b) => { b.classList.toggle("is-done", on); b.setAttribute("aria-pressed", on); $("span", b).textContent = on ? "Completed" : "Mark as completed"; });
    toast(on ? "Reading marked as completed" : "Reading marked as not completed");
  }
});

/* Tab bar labels */
[["tab-home", "home", "Home"], ["tab-library", "book", "Read"], ["tab-resources", "teach", "Teach"], ["tab-games", "play", "Play"], ["tab-shop", "shop", "Shop"]]
  .forEach(([id, icon, label]) => { $("#" + id).innerHTML = `${ico(icon, 23)}<span>${label}</span>`; });

window.addEventListener("hashchange", router);
updateSavedBadge();
router();

/* ---------- Installable app (PWA) ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; $("#install-btn").hidden = false; });
$("#install-btn").addEventListener("click", async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch (e) {}
  installEvt = null; $("#install-btn").hidden = true;
});
window.addEventListener("appinstalled", () => { $("#install-btn").hidden = true; toast("MOVA Learning Studio is installed"); });
</script>
</body></html>
