<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trapped in the Train · MOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="mova-voice.js"></script>
<style>
:root{
  --bg:#FFF6E6; --card:#FFFFFF; --ink:#1B2A55; --muted:#5B6787; --tile:#F5F7FC; --edge:#DCE2F0; --track:#EEF1F8;
  --coral:#FF7A6B; --sky:#5BC0F0; --gold:#E9B93A; --mint:#4FD1A5; --lilac:#A98BE8; --pink:#F47FB0; --butter:#F7D96B; --purple:#8B6CE0;
  --good:#1F9A47; --good-bg:#DDF6E4; --bad:#E5484D; --bad-bg:#FDE4E4;
  --d1:rgba(255,122,107,.5); --d2:rgba(91,192,240,.5); --d3:rgba(247,217,107,.75); --d4:rgba(79,209,165,.5); --d5:rgba(169,139,232,.5); --d6:rgba(244,127,176,.45);
  --shadow:0 10px 0 rgba(27,42,85,.07),0 24px 48px rgba(27,42,85,.12);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a33;--card:#1d2748;--ink:#F3F5FF;--muted:#AEB8D8;--tile:#26315a;--edge:#36437a;--track:#2b365f;--good-bg:rgba(31,154,71,.24);--bad-bg:rgba(229,72,77,.24);--d1:rgba(255,122,107,.3);--d2:rgba(91,192,240,.3);--d3:rgba(247,217,107,.3);--d4:rgba(79,209,165,.3);--d5:rgba(169,139,232,.3);--d6:rgba(244,127,176,.3);--shadow:0 10px 0 rgba(0,0,0,.25),0 24px 48px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a33;--card:#1d2748;--ink:#F3F5FF;--muted:#AEB8D8;--tile:#26315a;--edge:#36437a;--track:#2b365f;--good-bg:rgba(31,154,71,.24);--bad-bg:rgba(229,72,77,.24);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;font-family:Poppins,"Century Gothic",system-ui,sans-serif;color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(var(--d1) 7px,transparent 8px),radial-gradient(var(--d2) 6px,transparent 7px),radial-gradient(var(--d3) 8px,transparent 9px),radial-gradient(var(--d4) 5px,transparent 6px),radial-gradient(var(--d5) 6px,transparent 7px),radial-gradient(var(--d6) 5px,transparent 6px);
  background-size:120px 120px,150px 150px,180px 180px,95px 95px,135px 135px,110px 110px;background-position:10px 20px,70px 90px,30px 130px,90px 40px,50px 60px,100px 10px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:12px}
.app{min-height:100%;display:grid;place-items:center;padding:16px 12px 28px}
.card{width:100%;max-width:600px;background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:22px 18px 24px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:inline-block;white-space:nowrap;border:1.5px solid var(--ink);padding:4px 9px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.06em}
.back{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:8px 0}
.hero{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:12px}
.hero img{width:118px;height:auto;filter:drop-shadow(0 8px 10px rgba(27,42,85,.18))}
h1.title{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(38px,10.5vw,52px);line-height:.98;margin:0 0 8px;letter-spacing:-.02em;display:flex;flex-wrap:wrap;gap:0 .25em}
h1.title .w{display:inline-flex;white-space:nowrap}
h1.title .l{display:inline-block;color:var(--c);text-shadow:0 3px 0 color-mix(in srgb,var(--c) 45%,#1B2A55);transform:rotate(var(--r))}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--coral) 18%,var(--card));color:var(--ink);margin-bottom:8px}
.lead{color:var(--muted);margin:0;font-size:14.5px}
.label{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.level{display:grid;gap:2px;text-align:left;padding:11px 12px;border-radius:16px;background:color-mix(in srgb,var(--c) 12%,var(--card));border:2px solid transparent;min-height:62px}
.level b{font-size:14.5px;line-height:1.2}
.level small{font-size:12px;color:var(--muted);line-height:1.35}
.level[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 26%,var(--card))}
.play{width:100%;margin-top:20px;height:56px;border-radius:18px;background:linear-gradient(90deg,#FF7A6B,#F47FB0 35%,#A98BE8 70%,#5BC0F0);color:#fff;font-weight:700;font-size:17px;box-shadow:0 6px 0 #6E5BB8;text-shadow:0 1px 0 rgba(27,42,85,.2)}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #6E5BB8}
.ghost{width:100%;margin-top:10px;height:50px;border-radius:16px;background:var(--tile);font-weight:600}
.best{text-align:center;font-size:13px;color:var(--muted);margin:12px 0 0;min-height:20px}
.hud{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--tile);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.pill{padding:6px 12px;border-radius:999px;background:var(--tile);font-size:13.5px;font-weight:700;white-space:nowrap}
.pill.round{background:color-mix(in srgb,var(--sky) 20%,var(--card))}
.pill.score{margin-left:auto;background:var(--butter);color:#1B2A55}
.dots{display:flex;gap:5px;justify-content:center;margin:12px 0 10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--track)}
.dots i.ok{background:var(--mint)} .dots i.ko{background:var(--coral)} .dots i.now{background:var(--purple);transform:scale(1.25)}
.scene{position:relative;border-radius:22px;overflow:hidden;background:#EAE3D6;box-shadow:0 6px 0 rgba(27,42,85,.08)}
.scene>img.bg{display:block;width:100%;height:auto}
.bubble{position:absolute;background:#FFFDFA;color:#1B2A55;border-radius:16px;padding:8px 12px;font-weight:600;font-size:clamp(12.5px,3.4vw,15px);line-height:1.3;box-shadow:0 4px 0 rgba(27,42,85,.18);border:2px solid #1B2A55}
.task{text-align:center;margin:16px 0 10px}
.task h3{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(21px,5.6vw,26px);margin:0;line-height:1.15}
.task p{margin:4px 0 0;font-size:14px;color:var(--muted);font-weight:500}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{min-height:64px;border-radius:20px;background:color-mix(in srgb,var(--c) 14%,var(--card));border:2.5px solid color-mix(in srgb,var(--c) 55%,var(--card));box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,var(--card));font-family:"Bricolage Grotesque",Poppins,sans-serif;font-size:24px;font-weight:800;display:grid;place-items:center;padding:6px;line-height:1.1}
.opt small{display:block;font-family:Poppins,sans-serif;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
.opt:active{transform:scale(.97)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);box-shadow:0 4px 0 #9ED9B1}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 #F2A9AB;animation:shake .35s}
.opt.dim{opacity:.4}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.feedback{min-height:28px;text-align:center;font-weight:800;margin-top:14px;font-size:16px}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.go{display:block;margin:14px auto 0;padding:13px 30px;border-radius:16px;background:var(--purple);color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 0 #5E46B0}
.go:disabled{opacity:.4}
.end{text-align:center}
.end img.mascot{width:130px;height:auto;margin-top:6px;filter:drop-shadow(0 8px 10px rgba(27,42,85,.18))}
.end h2{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:32px;margin:6px 0 0}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.stars svg{width:44px;height:44px}
.final{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:60px;line-height:1;margin:6px 0 0;color:var(--purple)}
.final-l{color:var(--muted);margin:2px 0 14px}
.sumrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.sumrow .pill:nth-child(1){background:color-mix(in srgb,var(--mint) 22%,var(--card))}
.sumrow .pill:nth-child(2){background:var(--butter);color:#1B2A55}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.rail{background:#2A1E16}
.rail .clara{position:absolute;left:2%;bottom:0;height:86%;width:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));z-index:3}
.rail .bubble{left:22%;top:6%;max-width:40%;z-index:4}
.rail .bubble:after{content:"";position:absolute;left:-11px;top:16px;border:9px solid transparent;border-right-color:#1B2A55;border-left:0}
.roomtag{position:absolute;right:3%;bottom:4%;background:#1B2A55;color:#F7D96B;border:2px solid #E9B93A;border-radius:10px;padding:3px 10px;font-weight:800;font-size:clamp(10.5px,3vw,13px);letter-spacing:.08em;text-transform:uppercase;z-index:4}
.ticket{position:absolute;right:3%;top:5%;width:31%;z-index:4;transform:rotate(4deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.ticket svg{width:100%;height:auto;display:block}
.ticket .hole{transition:r .3s}
.ticket.punch{animation:punch .35s}
@keyframes punch{40%{transform:rotate(4deg) scale(1.12)}}
.rail.shake{animation:shake2 .12s linear 8}
@keyframes shake2{25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,14,10,.55);z-index:6;animation:fadein .35s both}
@keyframes fadein{from{opacity:0}}
.over>div{background:#FFF8E7;color:#1B2A55;border:3px solid #E9B93A;border-radius:22px;padding:14px 22px;text-align:center;max-width:84%;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.over small{display:block;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#C0572F}
.over h3{margin:4px 0 0;font-family:"Bricolage Grotesque",Poppins,sans-serif;font-size:clamp(22px,6vw,30px)}
.over p{margin:4px 0 0;font-size:14px;font-weight:500;color:#5B6787}
.brake{margin-top:10px;height:56px;padding:0 22px;border-radius:18px;background:#E5484D;color:#fff;font-weight:800;font-size:17px;letter-spacing:.04em;box-shadow:0 6px 0 #9E2A2E;animation:pulse 1s ease-in-out infinite}
.brake:active{transform:translateY(4px);box-shadow:0 2px 0 #9E2A2E}
@keyframes pulse{50%{transform:scale(1.06)}}
.flash{position:absolute;inset:0;background:#fff;z-index:7;animation:flash .8s ease-out both;pointer-events:none}
@keyframes flash{0%{opacity:0}25%{opacity:.9}100%{opacity:0}}
.route{margin-top:12px;position:relative;height:58px}
.route .track{position:absolute;left:6%;right:6%;top:21px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#8A6A4A 0 8px,transparent 8px 14px),#D9C7A8}
.route .fill{position:absolute;left:6%;top:21px;height:6px;border-radius:3px;background:#E9B93A;transition:width .8s}
.route .st{position:absolute;top:14px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--card);border:3px solid #D9C7A8;transition:background .4s,border-color .4s}
.route .st.on{background:#E9B93A;border-color:#B8862A}
.route .st b{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.route .loco{position:absolute;top:-4px;width:46px;margin-left:-23px;transition:left .9s cubic-bezier(.5,0,.3,1);z-index:2}
.board{margin-top:12px;border-radius:20px;background:#22303F;color:#fff;padding:14px 16px;position:relative;box-shadow:0 5px 0 #121B26;border:3px solid #B8862A}
.board small{color:#F7D96B;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.board .q{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(19px,5.4vw,24px);margin-top:4px;line-height:1.25;padding-right:44px}
.board .q u{text-decoration:none;display:inline-block;min-width:64px;border-bottom:3px dashed #F7D96B;color:#F7D96B}
.listen{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:12px;background:#E9B93A;display:grid;place-items:center;color:#1B2A55}
.listen svg{width:20px;height:20px}
.opts.long{grid-template-columns:1fr}
.opts.long .opt{min-height:52px;font-family:Poppins,sans-serif;font-size:15px;font-weight:700}
.line{min-height:52px;margin-top:10px;border-radius:14px;border:2px dashed #F7D96B;padding:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(247,217,107,.08)}
.line:empty:before{content:"Tap the words in order…";color:rgba(255,255,255,.45);font-size:13.5px;font-weight:600;padding-left:6px}
.line .w{background:#FFF8E7;color:#1B2A55;border-radius:10px;padding:6px 10px;font-weight:700;font-size:15px}
.line.bad{border-color:#FF5A66;animation:shake .35s}
.line.good{border-style:solid;border-color:#4FD1A5;background:rgba(79,209,165,.18)}
.line.good .w{background:#4FD1A5;color:#0F2A22}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wd{padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 16%,var(--card));border:2.5px solid color-mix(in srgb,var(--c) 55%,var(--card));box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,var(--card));font-weight:700;font-size:16px}
.wd:active{transform:translateY(2px)}
.wd.used{opacity:.2;pointer-events:none}
.hint{text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 10px}

</style>
</head>
<body>
<canvas id="fx"></canvas>
<main class="app">
<div class="card">
  <section id="s-start">
    <div class="top"><a class="back" href="./#/games">MOVA Learning Studio</a><span class="brand">MOVA · Centro Pedagógico</span></div>
    <div class="hero">
      <div><span class="tag">Escape room · English</span><h1 class="title" id="title" aria-label="Trapped in the Train"></h1><p class="lead">All the doors are locked! Travel car by car with Conductor Clara, punch your ticket and stop the train.</p></div>
      <img id="hero-img" alt="">
    </div>
    <p class="label">Choose your level</p>
    <div class="levels" id="levels"></div>
    <button class="play" id="play">Play</button>
    <p class="best" id="best"></p>
  </section>
  <section id="s-game" hidden>
    <div class="hud">
      <button class="icon-btn" id="home" aria-label="Back to start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
      <span class="pill round" id="round"></span>
      <span class="pill score" id="score">0 pts</span>
    </div>
    <div class="dots" id="dots"></div>
    <div class="scene rail" id="scene"><img class="bg" id="room" alt=""><div class="ticket" id="ticket"><svg viewBox="0 0 220 110"><defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#F7D96B"/><stop offset="1" stop-color="#E9B93A"/></linearGradient></defs>
<path d="M10 4h200a6 6 0 0 1 6 6v28a14 14 0 0 0 0 30v32a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6V68a14 14 0 0 0 0-30V10a6 6 0 0 1 6-6z" fill="url(#tg)" stroke="#8A5A1B" stroke-width="3"/>
<rect x="14" y="14" width="192" height="82" rx="6" fill="none" stroke="#8A5A1B" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="110" y="38" text-anchor="middle" font-family="Bricolage Grotesque,Poppins,sans-serif" font-weight="800" font-size="20" fill="#5A3A10" letter-spacing="2">TICKET</text>

(function(){
"use strict";
const $ = (s) => document.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const PAL = ["var(--coral)", "var(--sky)", "var(--gold)", "var(--mint)", "var(--purple)", "var(--pink)"];
const KEY = "train";
(function () { let n = 0; $("#title").innerHTML = "Trapped in the Train".split(" ").map((w) => `<span class="w" aria-hidden="true">${[...w].map((ch) => { const i = n++; return `<span class="l" style="--c:${PAL[i % PAL.length]};--r:${i % 2 ? 4 : -4}deg">${ch}</span>`; }).join("")}</span>`).join(""); })();

/* Voz en español y sonidos */
const synth = window.speechSynthesis || null;
function hablar(t) { if (!synth) return; try { synth.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "es-MX"; u.rate = .95; const v = synth.getVoices().find((x) => /^es[-_]MX/i.test(x.lang)) || synth.getVoices().find((x) => /^es/i.test(x.lang)); if (v) u.voice = v; synth.speak(u); } catch (e) {} }
let actx = null;
function unlock() { try { if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (actx && actx.state === "suspended") actx.resume(); } catch (e) {} }
function tones(fs, step, type, vol) { if (!actx) return; const t0 = actx.currentTime; fs.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = type || "sine"; o.frequency.value = f; const s = t0 + i * step; g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(vol || .16, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + step + .12); o.connect(g).connect(actx.destination); o.start(s); o.stop(s + step + .15); }); }
const chime = () => tones([660, 880, 1175], .08, "triangle"), buzz = () => tones([220, 180], .13, "square", .1), fanfare = () => tones([523, 659, 784, 1047], .12, "triangle"), tick = () => tones([1200], .03, "sine", .08), coinSnd = () => tones([1320, 1760], .05, "triangle", .1);

const bestKey = () => `mova-${KEY}-${st.level}`;
const getBest = () => { try { return +(localStorage.getItem(bestKey()) || 0); } catch (e) { return 0; } };
const setBest = (v) => { try { localStorage.setItem(bestKey(), String(v)); } catch (e) {} };
function show(id) { ["start", "game", "end"].forEach((s) => { $("#s-" + s).hidden = s !== id; }); window.scrollTo(0, 0); }
const st = { level: 0, round: 0, score: 0, results: [], firstTry: true, timeouts: [] };
function later(fn, ms) { st.timeouts.push(setTimeout(fn, ms)); }
function clearLater() { st.timeouts.forEach(clearTimeout); st.timeouts = []; }
function feedback(text, good) { const f = $("#feedback"); f.textContent = text; f.className = "feedback" + (good === true ? " good" : good === false ? " bad" : ""); }
const PRAISE = ["Great job!", "Excellent!", "Well done!", "Super!", "Bravo!", "Awesome!"];

/* Niveles */
function drawLevels() {
  $("#levels").innerHTML = LEVELS.map((l, i) => `<button class="level" data-i="${i}" style="--c:${PAL[i % PAL.length]}" aria-pressed="${i === st.level}"><b>${l.name}</b><small>${l.desc}</small></button>`).join("");
  const b = getBest(); $("#best").textContent = b ? `Best score in ${LEVELS[st.level].name}: ${b}` : "";
}
$("#levels").addEventListener("click", (e) => { const b = e.target.closest(".level"); if (b) { unlock(); st.level = +b.dataset.i; try { localStorage.setItem(`mova-${KEY}-lvl`, st.level); } catch (er) {} drawLevels(); } });

function dots() { $("#dots").innerHTML = Array.from({ length: ROUNDS }, (_, i) => `<i class="${st.results[i] === true ? "ok" : st.results[i] === false ? "ko" : i === st.round ? "now" : ""}"></i>`).join(""); }
function startGame() { unlock(); clearLater(); st.round = 0; st.score = 0; st.results = []; $("#score").textContent = "0 pts"; show("game"); nextRound(); }
function nextRound() {
  if (st.round >= ROUNDS) return finish();
  st.firstTry = true; feedback("");
  $("#round").textContent = `${ROUND_LABEL} ${st.round + 1} of ${ROUNDS}`; dots();
  newRound();
}
function win(pts, msg) {
  const p = st.firstTry ? pts : Math.round(pts / 2);
  st.score += p; $("#score").textContent = `${st.score} pts`;
  st.results[st.round] = st.firstTry; chime(); burst(40);
  feedback(`${msg || pick(PRAISE)} +${p}`, true); dots();
  st.round++; later(nextRound, 1700);
}
function miss(msg, reveal) {
  buzz(); feedback(msg, false);
  if (!st.firstTry || reveal) { st.results[st.round] = false; dots(); return true; }
  st.firstTry = false; return false;
}
function skipAfterReveal() { st.round++; later(nextRound, 2600); }
function finish() {
  clearLater(); show("end");
  const ok = st.results.filter(Boolean).length, stars = ok >= ROUNDS - 1 ? 3 : ok >= Math.ceil(ROUNDS * .6) ? 2 : ok >= Math.ceil(ROUNDS * .3) ? 1 : 0;
  $("#stars").innerHTML = [0, 1, 2].map((i) => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.5l1.3-6.6L2.5 9.3l6.6-.8z" fill="${i < stars ? "#F7D96B" : "var(--track)"}" stroke="${i < stars ? "#E9B93A" : "none"}" stroke-width="1"/></svg>`).join("");
  $("#end-title").textContent = ["Keep practicing!", "Nice try!", "Great passenger!", "Train hero!"][stars];
  $("#final").textContent = st.score;
  $("#sum-correct").textContent = `${ok} of ${ROUNDS} on the first try`;
  const best = getBest(); if (st.score > best) setBest(st.score);
  $("#sum-best").textContent = st.score > best ? "New record!" : `Best: ${best}`;
  if (stars >= 2) { fanfare(); burst(140); }
}
$("#play").addEventListener("click", startGame);
$("#again").addEventListener("click", startGame);
$("#change").addEventListener("click", () => { drawLevels(); show("start"); });
$("#home").addEventListener("click", () => { clearLater(); if (synth) synth.cancel(); drawLevels(); show("start"); });

/* Confeti */
const cv = $("#fx"), cx = cv.getContext("2d"); let parts = [], fxOn = false;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
function burst(n) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#FF7A6B", "#5BC0F0", "#F7D96B", "#4FD1A5", "#8B6CE0", "#F47FB0"];
  for (let i = 0; i < n; i++) parts.push({ x: cv.width / 2, y: cv.height / 3, vx: (Math.random() - .5) * 16 * devicePixelRatio, vy: (Math.random() * -12 - 4) * devicePixelRatio, r: (4 + Math.random() * 5) * devicePixelRatio, c: cols[i % cols.length], life: 90 });
  if (!fxOn) { fxOn = true; requestAnimationFrame(drawFx); }
}
function drawFx() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += .45 * devicePixelRatio; p.life--; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fill(); });
  parts = parts.filter((p) => p.life > 0 && p.y < cv.height + 40);
  if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

    { t: [["The train ___ very fast right now.", "is going", "goes", "going"], ["Why ___ the door locked?", "is", "does", "are"], ["Our seats are ___ than the old ones.", "more comfortable", "comfortabler", "most comfortable"]], o: ["The conductor is checking the tickets", "We are traveling to the mountains"] },
    { t: [["Would you like ___ tea?", "some", "any", "a"], ["Yesterday we ___ dinner on the train.", "ate", "eated", "eat"], ["Is there ___ milk for my coffee?", "any", "some", "a"]], o: ["Can I have the menu, please?", "We had pancakes for breakfast"] },
    { t: [["Whose suitcase is this? It’s ___.", "mine", "my", "me"], ["You ___ touch the bird cage!", "mustn’t", "don’t must", "not"], ["The bikes ___ next to the door.", "are", "is", "be"]], o: ["The key was under the box", "There are two bikes here"] },
    { t: [["The engineer ___ the train last night.", "drove", "drived", "drive"], ["The train ___ stop! The brakes are broken!", "can’t", "doesn’t", "isn’t"], ["This is ___ train in the country.", "the oldest", "the older", "oldest"]], o: ["Pull the lever to stop the train", "The train didn’t stop at the station"] }
  ],
  [ // Teens
    { t: [["The doors ___ automatically at midnight.", "were locked", "locked", "have locking"], ["If I ___ the code, I would open the door.", "knew", "know", "had know"], ["The conductor told us ___ in our seats.", "to stay", "stay", "staying"]], o: ["The door has been locked from the outside", "Nobody knows who locked the door"] },
    { t: [["By the time we arrived, dinner ___.", "had been served", "has served", "was serving"], ["The waiter, ___ name is Leo, gave us a clue.", "whose", "who", "which"], ["I’d rather ___ here than in the luggage car.", "stay", "to stay", "staying"]], o: ["The clue was hidden under the menu", "We should have asked the waiter"] },
    { t: [["The padlock ___ be opened without the key.", "can’t", "mustn’t to", "doesn’t"], ["This suitcase ___ belong to Clara. It has her name on it.", "must", "can’t", "mightn’t to"], ["We spent an hour ___ for the key.", "looking", "to look", "look"]], o: ["The key must be in one of these bags", "The suitcase had been opened before"] },
    { t: [["If the brakes ___, we will be safe.", "work", "worked", "would work"], ["The train ___ by the same engineer for fifty years.", "has been driven", "has driven", "was drive"], ["I wish the train ___ so fast!", "weren’t going", "isn’t going", "won’t go"]], o: ["The emergency brake must be pulled now", "We would have crashed without you"] }

const enVoice = () => synth && (synth.getVoices().find((v) => /^en[-_]US/i.test(v.lang)) || synth.getVoices().find((v) => /^en/i.test(v.lang)));
function say(t) { if (!synth) return; try { synth.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = .88; const v = enVoice(); if (v) u.voice = v; synth.speak(u); } catch (e) {} }
const SPK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
let R = null, plan = null;
const STX = [6, 35.33, 64.66, 94];
function route(car, arrived) {
  $("#route").querySelectorAll(".st").forEach((e) => e.remove());
  CARS.forEach((c, i) => $("#route").insertAdjacentHTML("beforeend", `<span class="st${i < car || (i === car && arrived) ? " on" : ""}" style="left:${STX[i]}%"><b>${c.short}</b></span>`));
  $("#loco").style.left = STX[car] + "%"; $("#fill").style.width = (STX[car] - 6) + "%";
}
function punches(n) { $("#holes").innerHTML = [0, 1, 2].map((i) => i < n ? `<circle cx="${60 + i * 50}" cy="78" r="10" fill="#2A1E16"/>` : `<circle cx="${60 + i * 50}" cy="78" r="9" fill="none" stroke="#8A5A1B" stroke-width="2" stroke-dasharray="3 3"/>`).join(""); }
function over(sm, h, p, extra) { const o = document.createElement("div"); o.className = "over"; o.innerHTML = `<div><small>${sm}</small><h3>${h}</h3>${p ? `<p>${p}</p>` : ""}${extra || ""}</div>`; $("#scene").appendChild(o); return o; }
function newRound() {
  const car = Math.floor(st.round / 3), step = st.round % 3, C = CARS[car];
  if (st.round === 0) { st.braked = false; plan = BANK[st.level].map((p) => { const t = shuffle(p.t).slice(0, 2); t.splice(rnd(1, 2), 0, { order: pick(p.o) }); return t; }); }
  const item = plan[car][step];
  $("#scene").querySelectorAll(".over,.flash").forEach((e) => e.remove()); $("#scene").classList.remove("shake");
  punches(step); $("#tcar").textContent = `CAR ${car + 1} · ${C.short.toUpperCase()}`; route(car, false);
  if (step === 0) {
    $("#room").src = RM[C.k]; $("#roomtag").textContent = C.name; $("#bubble").textContent = C.hi;
    const o = over(`Car ${car + 1} of 4`, C.name, "Get 3 punches on your ticket to open the next door.");
    later(() => o.remove(), 1800); later(() => say(C.hi), 400);
  } else $("#bubble").textContent = item.order ? "This sign is all mixed up! Put the words in order." : pick(["Tickets, please! Next question.", "Well done, passenger!", "All aboard! Keep going!", "Almost there!"]);
  const s0 = rnd(0, 5);
  if (item.order) {
    const sent = item.order, words = sent.split(" ");
    R = { done: false, ans: sent, order: true, fill: [] };
    $("#board").innerHTML = `<small>Mixed-up sign · Build the sentence</small><div class="q">Put the words in the right order.</div><button class="listen" id="listen" aria-label="Listen">${SPK}</button><div class="line" id="line"></div>`;
    $("#listen").addEventListener("click", () => say(sent));
    let mixed; do { mixed = shuffle(words.map((w, i) => ({ w, i }))); } while (mixed.map((x) => x.w).join(" ") === sent);
    $("#zone").innerHTML = `<p class="hint">Tap the words in order. Tap a word in the sign to remove it.</p><div class="words" id="words">${mixed.map((x, j) => `<button class="wd" data-i="${x.i}" style="--c:${PAL[(s0 + j) % 6]}">${x.w}</button>`).join("")}</div>`;
    const draw = () => { $("#line").innerHTML = R.fill.map((f, j) => `<span class="w" data-j="${j}">${f.w}</span>`).join(""); $("#words").querySelectorAll(".wd").forEach((b) => b.classList.toggle("used", R.fill.some((f) => f.i === b.dataset.i))); };
    $("#words").addEventListener("click", (e) => {
      const b = e.target.closest(".wd"); if (!b || R.done) return;
      R.fill.push({ i: b.dataset.i, w: b.textContent }); tick(); draw();
      if (R.fill.length === words.length) {
        if (R.fill.map((f) => f.w).join(" ") === sent) { R.done = true; $("#line").classList.add("good"); say(sent); solved(); win(100, endMsg(step)); }
        else {
          $("#line").classList.add("bad");
          if (miss("Not quite… check the order!")) { R.done = true; later(() => { $("#line").classList.remove("bad"); R.fill = words.map((w) => ({ i: "x", w })); draw(); $("#line").classList.add("good"); }, 500); feedback(`“${sent}”`, false); solved(); skipAfterReveal(); }
          else later(() => { $("#line").classList.remove("bad"); R.fill = []; draw(); }, 650);
        }
      }
    });
    $("#line").addEventListener("click", (e) => { const w = e.target.closest(".w"); if (!w || R.done) return; R.fill.splice(+w.dataset.j, 1); draw(); });
  } else {
    const spoken = item[0].replace("___", "blank");
    R = { done: false, ans: item[1], item };
    $("#board").innerHTML = `<small>Conductor’s question · ${car + 1}.${step + 1}</small><div class="q">${item[0].replace("___", "<u>&nbsp;</u>")}</div><button class="listen" id="listen" aria-label="Listen">${SPK}</button>`;
    $("#listen").addEventListener("click", () => say(spoken));
    const o = item.slice(1);
    $("#zone").innerHTML = `<div class="opts${o.some((x) => x.length > 12) ? " long" : ""}">${shuffle(o).map((x, i) => `<button class="opt" data-v="${x}" style="--c:${PAL[(s0 + i) % 6]}">${x}</button>`).join("")}</div>`;
    $("#zone").querySelector(".opts").addEventListener("click", (e) => {
      const b = e.target.closest(".opt"); if (!b || R.done) return;
      if (b.dataset.v === R.ans) { R.done = true; b.classList.add("right"); solved(); say(R.item[0].replace("___", R.ans)); win(100, endMsg(step)); }
      else {
        b.classList.add("wrong");
        if (miss("Not quite… try again!")) { R.done = true; $("#zone").querySelectorAll(".opt").forEach((x) => x.classList.add(x.dataset.v === R.ans ? "right" : "dim")); feedback(`The answer is “${R.ans}”.`, false); solved(); skipAfterReveal(); }
      }
    });
  }
}
function endMsg(step) { return st.round === ROUNDS - 1 ? "All doors open!" : step === 2 ? "Door unlocked!" : pick(["Correct!", "Great job!", "Ticket punched!", "Well done!"]); }
function solved() {
  const u = $("#board .q u"); if (u) u.textContent = R.ans;
  const car = Math.floor(st.round / 3), step = st.round % 3;
  punches(step + 1); const t = $("#ticket"); t.classList.remove("punch"); void t.offsetWidth; t.classList.add("punch"); later(coinSnd, 120);
  if (step === 2 && st.round < ROUNDS - 1) later(() => { route(car, true); $("#bubble").textContent = "Click! The door is open. Next car!"; over("Ticket complete", "Door unlocked!", `Next: ${CARS[car + 1].name}`); fanfare(); }, 500);
  if (st.round === ROUNDS - 1) later(() => {
    route(car, true); $("#bubble").textContent = "Quick! Pull the emergency brake!"; say("Quick! Pull the emergency brake!");
    const o = over("Last step", "Stop the train!", "", `<button class="brake" id="brake">PULL THE BRAKE</button>`);
    $("#brake").addEventListener("click", pull, { once: true });
  }, 700);
}
function pull() {
  if (st.braked) return; st.braked = true;
  $("#scene").querySelectorAll(".over").forEach((e) => e.remove());
  tones([300, 240, 180, 140], .12, "sawtooth", .08); $("#scene").classList.add("shake");
  later(() => { $("#scene").insertAdjacentHTML("beforeend", `<div class="flash"></div>`); over("Next stop: Freedom Station", "The train stopped!", "You opened every door. You’re free!"); $("#bubble").textContent = "We did it! Thank you, passenger!"; say("The train stopped! You are free!"); fanfare(); burst(150); }, 900);
  later(() => _nr(), 3600);
}
const _nr = nextRound;
nextRound = function () { if (st.round >= ROUNDS && !st.braked) { later(pull, 12000); return; } if (st.round >= ROUNDS) return; _nr(); };


try { const l = +localStorage.getItem(`mova-${KEY}-lvl`); if (l >= 0 && l < LEVELS.length) st.level = l; } catch (e) {}
drawLevels();
})();
