<!doctype html>
<html lang="en">
<head>
<script src="mova-gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Writing Lab · MOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F5F3FA;--ink:#15192B;--navy:#1A1B2E;--navy2:#2C3060;--muted:#6A6F85;--line:#ECE9F3;--lime:#D3F36B;--lilac:#E6E2FF;--peri:#C9D2FF;--pink:#FF8FC0;--butter:#FFE58A;--mint:#BDF0D8;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid #8FA2FF;outline-offset:3px;border-radius:14px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.home{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.6px solid var(--ink);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;text-decoration:none;color:var(--ink)}
.home svg{width:16px;height:16px}
.brand{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.cover{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:30px;padding:24px 22px 22px;min-height:260px}
.cover .ring{position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;border:36px solid var(--navy2)}
.cover .k{position:relative;display:inline-block;background:var(--lime);color:var(--navy);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800}
.cover h1{position:relative;font-family:"Bricolage Grotesque",sans-serif;font-size:46px;line-height:.92;letter-spacing:-.02em;margin:14px 0 10px;max-width:240px}
.cover p{position:relative;margin:0;font-size:14px;line-height:1.55;color:#C9C3F2;max-width:58%}
.cover .art{position:absolute;right:4px;bottom:-4px;width:200px;height:210px}
@media (max-width:420px){.cover .art{width:150px;height:160px;right:-14px}.cover h1{font-size:40px}}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.how div{background:#fff;border-radius:20px;padding:12px 10px;text-align:center}
.how b{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;font-family:"Bricolage Grotesque",sans-serif;font-size:15px}
.how span{display:block;font-size:12.5px;line-height:1.35;font-weight:700}
.how small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600}
h2.sec{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;letter-spacing:-.01em;margin:24px 4px 10px}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stg{border-radius:20px;padding:12px 10px;text-align:left;border:2px solid transparent;background:#fff;transition:transform .15s}
.stg:active{transform:scale(.97)}
.stg b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
.stg small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.stg.on{border-color:var(--ink)}
.stg[data-s="kids"]{background:#ECFBC8}.stg[data-s="children"]{background:var(--lilac)}.stg[data-s="teens"]{background:#FFE6F2}
.lvh{font:800 12px "Plus Jakarta Sans",sans-serif;letter-spacing:.08em;color:var(--muted);margin:18px 6px 8px;text-transform:uppercase}
.tl{display:grid;gap:8px}
.tc{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:12px;text-decoration:none;color:var(--ink);position:relative}
.tc .th{width:62px;height:62px;border-radius:16px;flex:none;overflow:hidden;display:grid;place-items:center}
.tc .th img{width:100%;height:100%;object-fit:cover}
.tc .th svg{width:34px;height:34px}
.tc b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:17px;line-height:1.1}
.tc small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.35}
.tc .stt{margin-left:auto;flex:none;font-size:11.5px;font-weight:800;border-radius:999px;padding:6px 10px;white-space:nowrap}
.stt.new{background:var(--line);color:var(--muted)}.stt.sent{background:#FFF1C9;color:#7A5A00}.stt.rev{background:#ECFBC8;color:#3E5A07}
.card{background:#fff;border-radius:26px;padding:18px;margin-top:12px}
.card h3{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;margin:0 0 8px}
.chip{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px;background:var(--lilac)}
.tt h1{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;line-height:1;letter-spacing:-.02em;margin:10px 0 8px}
.prompt{font-size:16px;line-height:1.55;font-weight:600}
.pic{border-radius:24px;overflow:hidden;margin-top:12px;background:#fff;aspect-ratio:3/2;display:grid;place-items:center}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.model{white-space:pre-wrap;font-size:15px;line-height:1.65;background:#F5F3FA;border-radius:18px;padding:14px 16px;margin:0}
.model mark{background:#E4F8B0;border-radius:6px;padding:0 3px;color:inherit}
details summary{cursor:pointer;font-weight:800;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--muted)}
details[open] summary::after{content:"–"}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5;font-weight:600;margin-bottom:8px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font:800 13px "Plus Jakarta Sans",sans-serif}
textarea{width:100%;min-height:220px;border:2px solid var(--line);border-radius:20px;padding:14px 16px;font:500 16px/1.6 "Plus Jakarta Sans",sans-serif;color:var(--ink);resize:vertical;background:#FDFCFF}
textarea:focus{outline:none;border-color:#8FA2FF}
.meter{display:flex;align-items:center;gap:10px;margin:10px 2px 0;font-size:13px;font-weight:700;color:var(--muted)}
.meter .bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}.meter .bar i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .2s}
.ck{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.ck li{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.ck li i{width:20px;height:20px;border-radius:50%;flex:none;border:2px solid #D6D2E6;display:grid;place-items:center}
.ck li.ok{color:var(--ink)}.ck li.ok i{background:var(--lime);border-color:var(--lime)}
.ck li.ok i::after{content:"";width:8px;height:5px;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.send{display:block;width:100%;margin-top:16px;background:var(--ink);color:var(--lime);border-radius:999px;padding:17px;font-weight:800;font-size:16px}
.send:disabled{opacity:.35}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:10px 0 0;font-weight:600}
.done{text-align:center;padding:28px 20px}
.done .big{width:84px;height:84px;margin:0 auto 14px;border-radius:28px;background:var(--lime);display:grid;place-items:center}
.done h2{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;margin:0 0 8px}
.done p{color:var(--muted);font-weight:600;line-height:1.55;margin:0 0 18px}
.fb{background:#fff;border-radius:26px;padding:18px;margin-top:12px;border:2px solid #E4F8B0}
.fb .sc{display:flex;align-items:baseline;gap:8px}.fb .sc b{font:800 36px "Bricolage Grotesque",sans-serif}.fb .sc span{font-weight:700;color:var(--muted)}
.rub{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.rub div{background:#F5F3FA;border-radius:14px;padding:9px 11px;font-size:12px;font-weight:700;color:var(--muted)}.rub div b{display:block;color:var(--ink);font-size:15px}
.fb p{font-size:14.5px;line-height:1.6;margin:0}
.sig{display:flex;align-items:flex-end;gap:12px;margin-top:14px}.sig img{height:46px}.sig span{font-size:12.5px;font-weight:700;color:var(--muted)}.sig b{display:block;color:var(--ink);font-size:14px}
.mine{white-space:pre-wrap;font-size:14.5px;line-height:1.6;background:#F5F3FA;border-radius:16px;padding:12px 14px;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="wl-data.js"></script>
<script src="wl-check.js"></script>
<script src="mova-auth.js"></script>
<script src="mova-teacher-view.js"></script>
<script>

      (r[0] || []).filter(function (x) { return x.activity === "writing" && x.detail && x.detail.w; }).sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); })
