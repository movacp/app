<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel de maestra · MOVA Learning Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F2B4D; --navy2:#2C3B66; --ink:#1F2B4D; --muted:#6B7591;
  --bg:#F4F6FA; --card:#FFFFFF; --line:#E3E7F0;
  --coral:#F2786B; --sky:#8EC9EE; --butter:#F6D776; --mint:#9DDCC0; --lilac:#B9A6E8;
  --ok:#2E9E6E; --bad:#D94B3D;
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.hidden{display:none!important}

/* Login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 20px;
  background:var(--navy);position:relative;overflow:hidden}
#login .dots{position:absolute;inset:0;pointer-events:none}
#login .dots span{position:absolute;border-radius:50%}
.login-card{position:relative;background:#fff;border-radius:24px;padding:32px 26px 28px;width:100%;max-width:380px;
  box-shadow:0 20px 50px rgba(10,16,40,.35)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;
  display:grid;place-items:center;font-size:20px;overflow:hidden;flex:none}
.brand-mark img{display:block;width:100%;height:100%}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.brand b{font-size:16px}
.login-card h1{font-size:26px;margin:0 0 4px;font-weight:700}
.login-card p.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
label.f{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input.in,select.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:15px}
input.in:focus,select.in:focus{border-color:var(--navy2);outline:none}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:disabled{opacity:.6}
.btn-soft{background:#EEF1F7;color:var(--ink)}
.btn-danger{background:#FCE9E7;color:var(--bad)}
.btn-full{width:100%;margin-top:22px}
.msg{font-size:13.5px;margin-top:12px;min-height:1em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}

/* App */
header.top{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 22px;position:relative;overflow:hidden}
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
header.top h1{font-size:22px;margin:16px 0 2px;font-weight:700;position:relative}
header.top p{margin:0;color:#C9D1E6;font-size:13.5px;position:relative}
header.top .brand small{color:#C9D1E6}
header.top .brand-mark{background:var(--navy);box-shadow:0 0 0 2px #fff}
.logout{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
main{max-width:760px;margin:0 auto;padding:18px 16px 100px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-34px;position:relative}
.visits{background:#fff;border-radius:18px;padding:16px 16px 14px;margin-top:12px;box-shadow:0 6px 18px rgba(31,43,77,.08)}
.visits h2{margin:0 0 2px;font-size:16px}.visits .vs{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vbox{border-radius:14px;padding:10px 12px}.vbox b{display:block;font-size:22px;line-height:1.1}.vbox span{font-size:12px;font-weight:500}
.vrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.vrow span{background:#F4F6FA;border-radius:999px;padding:5px 11px;font-size:12.5px}.vrow b{font-weight:700}
.vchart{display:flex;align-items:flex-end;gap:4px;height:84px;margin-top:14px;border-bottom:1px solid var(--line);padding-bottom:2px}
.vchart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.vchart i{display:block;width:100%;max-width:22px;background:var(--lilac);border-radius:6px 6px 2px 2px;min-height:3px}
.vchart em{font-style:normal;font-size:10px;color:var(--muted)}.vchart small{font-size:10px;font-weight:600}
.stat{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 6px 18px rgba(31,43,77,.08)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;margin:20px 0 12px}
.toolbar input{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.st{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--navy);flex:none}
.st .mid{flex:1;min-width:0}
.st .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .sub{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EEF1F7}
.chip.off{background:#FCE9E7;color:var(--bad)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--coral);color:#fff;border:0;
  border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 10px 24px rgba(242,120,107,.45);font-size:15px}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(15,22,45,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin:0 0 6px}
.sheet .x{float:right;border:0;background:#EEF1F7;border-radius:10px;width:36px;height:36px;font-size:18px}
.sec{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}
.sec h3{font-size:15px;margin:0 0 8px}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions .btn{flex:1}
.cred{background:#F4F6FA;border-radius:14px;padding:14px 16px;margin-top:14px;font-size:14.5px}
.cred div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.cred span{color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.pi{display:flex;justify-content:space-between;gap:10px;background:#F7F8FB;border-radius:10px;padding:9px 12px;font-size:13.5px}
.pi .when{color:var(--muted);font-size:12px}
.score{font-weight:700;white-space:nowrap}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;font-weight:500}
.toggle input{width:20px;height:20px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;box-shadow:0 10px 24px rgba(0,0,0,.2)}

/* Reporte mensual */
.rep-wrap{position:fixed;inset:0;z-index:30;background:rgba(15,22,45,.5);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.rep-wrap{align-items:center}}
.rep-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;background:var(--coral);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:600;font-size:15px}
textarea.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;min-height:96px;resize:vertical}
textarea.in:focus{border-color:var(--navy2);outline:none}
#repStage{position:fixed;left:-10000px;top:0;width:794px}
.rp{width:794px;min-height:1123px;background:#FBF8F3;color:#1F2B4D;font-family:Poppins,sans-serif;position:relative;overflow:hidden;padding-bottom:84px;box-sizing:border-box}
.rp-band{position:absolute;inset:0 0 auto;height:250px;background:#1F2B4D;overflow:hidden}
.rp-band i{position:absolute;border-radius:50%}
.rp-head{position:relative;display:flex;align-items:center;gap:14px;padding:40px 48px 0;color:#fff}
.rp-head img{width:56px;height:56px;border-radius:14px;box-shadow:0 0 0 3px #fff}
.rp-head b{display:block;font-size:17px}.rp-head small{font-size:13px;color:#C9D1E6}
.rp-title{position:relative;padding:22px 48px 0;color:#fff}
.rp-title h1{margin:0;font-size:34px;line-height:1.1;font-weight:700}
.rp-title p{margin:6px 0 0;font-size:16px;color:#F6D776;font-weight:600}
.rp-card{position:relative;margin:26px 48px 0;background:#fff;border-radius:22px;padding:22px 26px;display:flex;align-items:center;gap:18px;box-shadow:0 10px 30px rgba(31,43,77,.12)}
.rp-av{width:62px;height:62px;border-radius:50%;background:#F6D776;display:grid;place-items:center;font-weight:700;font-size:22px;flex:none}
.rp-card h2{margin:0;font-size:24px}.rp-card span{color:#6B7591;font-size:14px}
.rp-chip{margin-left:auto;background:#EEF1F7;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.rp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 48px 0}
.rp-stat{border-radius:18px;padding:16px 16px 14px}
.rp-stat b{display:block;font-size:26px;line-height:1.1}.rp-stat span{font-size:12.5px;font-weight:500}
.rp-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;margin:20px 48px 0}
.rp-box{background:#fff;border-radius:20px;padding:18px 20px}
.rp-box h3{margin:0 0 12px;font-size:15px}
.rp-bar{margin:0 0 11px}.rp-bar div{display:flex;justify-content:space-between;font-size:12.5px}
.rp-bar span{color:#6B7591}.rp-track{height:9px;background:#EEF1F7;border-radius:99px;margin-top:5px;overflow:hidden}
.rp-track i{display:block;height:100%;border-radius:99px}
.rp-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:11px}
.rp-cal em{font-style:normal;color:#6B7591;font-weight:600;font-size:10.5px}
.rp-cal u{text-decoration:none;display:grid;place-items:center;height:26px;border-radius:8px;color:#9AA2B8}
.rp-cal u.on{background:#9DDCC0;color:#1F2B4D;font-weight:700}
.rp-list{margin:0;padding:0;list-style:none;font-size:13px}
.rp-list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #EEF1F7}
.rp-list li:last-child{border:0}.rp-list b{font-weight:600}
.rp-note{margin:18px 48px 0;background:#FFF6DA;border-radius:20px;padding:18px 22px;font-size:14px;line-height:1.55}
.rp-note h3{margin:0 0 6px;font-size:15px}
.rp-foot{position:absolute;left:48px;right:48px;bottom:30px;display:flex;justify-content:space-between;font-size:12px;color:#6B7591;border-top:1px solid #E3E7F0;padding-top:12px}

/* ===== Rediseño 2026 ===== */
:root{--navy:#15192B;--navy2:#2B3150;--ink:#15192B;--muted:#6B6F86;--bg:#F5F3FA;--line:#E6E1F2;--coral:#FF8FC8;--sky:#8FA2FF;--butter:#FFE58A;--mint:#9BE7C4;--lilac:#B9A6FF;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
body{background:#F5F3FA}
h1,h2,h3,.stat b,.vbox b{font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif;letter-spacing:-.01em}
#login{background:linear-gradient(180deg,#EDE8FF,#F5F3FA 65%)}#login .dots{display:none}
.login-card{background:transparent;box-shadow:none;text-align:center;padding:10px 6px}
.lg-bloom{width:150px;height:150px;display:block;margin:0 auto 4px}
.login-card h1{font-size:30px;font-weight:800}.login-card p.sub{font-weight:700;color:#7B5CF0;letter-spacing:.04em;text-transform:uppercase;font-size:12.5px}
.login-card label.f{text-align:left}
input.in,select.in,textarea.in{border-radius:16px;border-color:#E6E1F2;background:#fff}
.btn{border-radius:999px;font-weight:800}
.btn-primary{background:#15192B;color:#fff;box-shadow:0 4px 0 #D3F36B}
.btn-soft{background:#F2EFF8}
header.top{background:transparent;color:#15192B;padding-bottom:6px}header.top .dots{display:none}
header.top .brand small{color:#6B6F86}header.top .brand b{font-family:"Bricolage Grotesque";font-size:21px}
header.top .brand-mark{box-shadow:none;border-radius:50%}
.logout{background:#fff;color:#15192B;border-radius:999px;box-shadow:0 2px 8px rgba(21,25,43,.06);font-weight:700}
.logout.live{background:#D3F36B;text-decoration:none}
.hero-b{position:relative;background:#C7B5FF;border-radius:26px;padding:18px 130px 18px 18px;min-height:132px;overflow:hidden;margin-bottom:12px}
.hero-b h2{margin:0;font-size:22px;line-height:1.1}.hero-b p{margin:8px 0 0;font-size:13.5px;line-height:1.4}
.hero-b img{position:absolute;right:-6px;bottom:-14px;width:130px;height:130px}
.stats{margin-top:0}.stat{border-radius:20px;box-shadow:none}
.stat:nth-child(1){background:#ECFBC8}.stat:nth-child(2){background:#FFE6F2}.stat:nth-child(3){background:#FFF6D1}
.stat span{color:#3B3F57;font-weight:600}
.visits{border-radius:22px;box-shadow:none}.vchart i{background:#B9A6FF}
.st{border:0;border-radius:18px}.chip{background:#F2EFF8;font-weight:700}
.fab{background:#15192B;box-shadow:0 4px 0 #D3F36B;font-weight:800}
.sheet{border-radius:28px 28px 0 0}@media(min-width:700px){.sheet{border-radius:28px}}
.sheet .x{border-radius:999px;background:#F2EFF8}
.cred,.pi{background:#F5F3FA}
.rep-btn{background:#D3F36B;color:#15192B;border-radius:999px;font-weight:800;padding:15px}
/* Reporte mensual · diseño A */
.rpA{width:794px;min-height:1123px;padding-bottom:70px;box-sizing:border-box;background:#F5F3FA;font-family:"Plus Jakarta Sans",sans-serif;color:#15192B;position:relative;overflow:hidden}
.rpA .hd{height:268px;background:linear-gradient(135deg,#C7B5FF,#D9CCFF 55%,#FFC7E2);position:relative;overflow:hidden;padding:30px 48px}
.rpA .wv{position:absolute;left:0;bottom:-1px;width:100%;height:46px}
.rpA .brand2{display:flex;align-items:center;gap:12px}.rpA .lg{width:50px;height:50px;border-radius:14px;background:#15192B;overflow:hidden}.rpA .lg img{width:100%;height:100%;display:block}
.rpA .brand2 b{display:block;font-size:16px}.rpA .brand2 small{font-size:12.5px;color:#3B3F57}
.rpA .ttl{margin-top:18px}.rpA .ttl small{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:#fff;border-radius:999px;padding:5px 12px}
.rpA .ttl h1{font-family:"Bricolage Grotesque",sans-serif;font-size:50px;line-height:.95;margin:12px 0 6px;letter-spacing:-.02em;max-width:500px}
.rpA .bl{position:absolute;right:52px;top:26px;width:200px;height:200px}
.rpA .who{margin:-30px 48px 0;position:relative;background:#fff;border-radius:24px;padding:18px 22px;display:flex;align-items:center;gap:16px;box-shadow:0 12px 30px rgba(54,40,120,.12)}
.rpA .av2{width:58px;height:58px;border-radius:50%;background:#C7B5FF;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.rpA .who h2{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-size:24px}.rpA .who span{color:#6B6F86;font-size:13.5px}
.rpA .who em{margin-left:auto;font-style:normal;background:#D3F36B;font-weight:800;font-size:13px;border-radius:999px;padding:7px 14px}
.rpA .stats2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 48px 0}.rpA .stats2 div{border-radius:20px;padding:13px 16px}.rpA .stats2 b{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;display:block;line-height:1}.rpA .stats2 span{font-size:12.5px;font-weight:700;color:#3B3F57}
.rpA .g2{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin:14px 48px 0}
.rpA .bx{background:#fff;border-radius:22px;padding:15px 20px}.rpA h3{font-family:"Bricolage Grotesque",sans-serif;font-size:17px;margin:0 0 12px}
.rpA .bar{margin-bottom:9px}.rpA .bar>div:first-child{display:flex;justify-content:space-between;font-size:13px}.rpA .bar span{color:#6B6F86;font-size:12px}.rpA .tr{height:10px;border-radius:9px;background:#F2EFF8;margin-top:5px}.rpA .tr i{display:block;height:100%;border-radius:9px}
.rpA .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.rpA .cal em{font-style:normal;font-size:10.5px;font-weight:800;color:#9A9DB2}.rpA .cal u{width:24px;margin:0 auto;text-decoration:none;font-size:11.5px;font-weight:700;height:23px;display:grid;place-items:center;border-radius:50%}
.rpA .cal u.on{background:#D3F36B}.rpA .cap{font-size:12px;color:#6B6F86;margin:10px 0 0;font-weight:600}
.rpA ul{list-style:none;margin:0;padding:0}.rpA li{font-size:13px;font-weight:700;padding:5px 0;border-bottom:1px dashed #E6E1F2}.rpA li.more{color:#7B5CF0;border:0}
.rpA .res li{display:flex;justify-content:space-between;gap:10px}.rpA .res span{font-weight:600}.rpA .res b{background:#FFE6F2;border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.rpA .asg{margin:14px 48px 0}.rpA .asg h3{display:flex;justify-content:space-between;align-items:center}.rpA .asg h3 span{font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;font-weight:800;background:#ECFBC8;border-radius:999px;padding:4px 10px}
.rpA .asg ul{list-style:none;margin:0;padding:0}.rpA .asg li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed #E6E1F2}.rpA .asg li:first-child{border:0;padding-top:0}
.rpA .asg i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;flex:none}.rpA .asg .ok i{background:#D3F36B}.rpA .asg .pe i{background:#FFE6F2;color:#A3216A}
.rpA .asg li span{flex:1;font-weight:700;font-size:14px}.rpA .asg small{display:block;font-weight:500;color:#6B6F86;font-size:12px}
.rpA .asg li b{font-size:12px;border-radius:999px;padding:3px 11px;white-space:nowrap}.rpA .asg .ok b{background:#ECFBC8}.rpA .asg .pe b{background:#FFE6F2;color:#A3216A}
.rpA .none{font-size:13px;color:#6B6F86;margin:0}
.rpA .note{margin:14px 48px 0;background:#15192B;color:#fff;border-radius:22px;padding:16px 24px}.rpA .note h3{color:#D3F36B}.rpA .note p{margin:0;font-size:13.5px;line-height:1.55}
.rpA .ft{position:absolute;left:48px;right:48px;bottom:26px;display:flex;justify-content:space-between;font-size:11px;color:#8A8EA5}

/* Tareas + reporte de simulación */
.pk{margin:4px 0 12px}
.pkc{margin-top:12px;background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 18px rgba(21,25,43,.06)}
.pkc h4{margin:0;font:800 16px/1.2 'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;color:#15192B}
.pkc p{margin:6px 0 10px;font-size:13px;line-height:1.45;color:#5B5F78}

/* ---------- Auth ---------- */
async function authReq(grant, body){
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`,{method:"POST",
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ const er=new Error(j.error_description || j.msg || j.message || "No se pudo iniciar sesión"); er.status=r.status; throw er; }
  session = {access:j.access_token, refresh:j.refresh_token, exp:Date.now() + (j.expires_in-60)*1000};
  try{localStorage.setItem(STORE, JSON.stringify(session));}catch(e){}
  return session;
}
/* La sesión de maestra se queda abierta: se renueva sola y solo se cierra con "Salir" */
let refreshing=null;
async function refreshNow(){
  if(!session?.refresh){ const e=new Error("auth"); e.status=401; throw e; }
  if(!refreshing) refreshing=authReq("refresh_token",{refresh_token:session.refresh}).finally(()=>{ refreshing=null; });
  await refreshing; return session.access;
}
async function ensureToken(){
  if(session && Date.now() < session.exp) return session.access;
  return refreshNow();
}
function authDead(e){ return e && (e.status===400 || e.status===401 || e.message==="auth"); }
async function rpc(fn, args={}, retried){
  let token;
  try{ token = await ensureToken(); }catch(e){ if(authDead(e)){ logout(); throw new Error("Tu sesión terminó. Vuelve a entrar."); } throw new Error("Sin conexión. Revisa tu internet e intenta de nuevo."); }
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(r.status===401 && !retried){ try{ await refreshNow(); return rpc(fn,args,true); }catch(e){ if(!authDead(e)) throw new Error("Sin conexión. Revisa tu internet e intenta de nuevo."); } }
  const txt = await r.text(); let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){
    const m = (j && (j.message||"")) + "";
    if(r.status===401){ logout(); throw new Error("Tu sesión terminó. Vuelve a entrar."); }
    if(j?.code==="23505") throw new Error("Ese usuario ya existe. Elige otro.");
    if(j?.code==="23514") throw new Error("El usuario solo puede llevar minúsculas, números, punto o guion (3 a 40).");
    if(m.includes("password too short")) throw new Error("La contraseña debe tener al menos 6 caracteres.");
    if(m.includes("not authorized")) throw new Error("This account does not have teacher access.");
    throw new Error(m || "Algo falló. Intenta de nuevo.");
  }
  return j;
}

});

function downloadCSV(name, rows){
  const csv = "\ufeff" + rows.map(r => r.map(c => { const v = String(c ?? ""); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

  B2: { band: "Upper Intermediate", head: "You express yourself fluently and naturally", can: ["You talk with native speakers easily and without much effort.", "You defend your ideas and argue for or against a topic.", "You understand long texts, news and videos on a variety of topics."], next: "Refining your accuracy and academic vocabulary, and preparing for an international certification.", parents: "Your child has a solid level of English that allows them to communicate fluently in academic and social settings. It is the ideal level to take a certification such as the TOEFL." },
  C1: { band: "Advanced", head: "You master English in demanding contexts", can: ["You use English flexibly in social, academic and professional settings.", "You understand long, complex texts and recognize implied meanings.", "You express yourself fluently, with clear structure and precise vocabulary."], next: "Polishing the nuances of the language and reaching the precision of an expert user.", parents: "Your child has an advanced command of English, enough to study or work in the language. We recommend certifying this level to make it official." },
  C2: { band: "Proficient", head: "Your English is at the highest level", can: ["You understand virtually everything you read and hear.", "You express yourself spontaneously, precisely and with subtle nuance.", "You handle complex academic and professional topics with ease."], next: "Keeping your level through regular reading, writing and conversation, and certifying it officially.", parents: "Your child shows a command of English comparable to that of an expert user. We recommend certifying this level to make it official." }

/* ---------- Helpers ---------- */
function makeUser(name){
  const p = name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/).filter(Boolean);
  if(!p.length) return "";
  return (p[0] + (p[1] ? p[1][0] : "") + ".m").slice(0,40);
}
function makePass(){
  const w = ["sol","luna","mar","rio","nube","flor","pino","lago","cielo","estrella","arbol","faro"];
  return w[Math.floor(Math.random()*w.length)] + (1000+Math.floor(Math.random()*9000));
}
function groupOptions(sel){ return `<option value="">Sin grupo</option>` + GROUPS.map(g=>`<option ${g===sel?"selected":""}>${g}</option>`).join(""); }
function closeModal(){ $("#modal").innerHTML=""; }
function openModal(html){
  $("#modal").innerHTML = `<div class="backdrop"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;

}

}

/* ---------- Detail (perfil del alumno) ---------- */
const CAT = {"app-lecturas":["Lecturas","#8EC9EE"],"app-library":["Lecturas","#8EC9EE"],"app-resources":["Recursos","#F6D776"],
  "app-games":["Juegos","#F9B8AE"],"app-flashcards":["Flashcards","#B9A6E8"],"app-wordsearch":["Sopa de letras","#9DDCC0"],
  "app-coloring":["Para colorear","#F6D776"],"app-holidays":["Festividades","#F9B8AE"],"app-learn":["Aprende","#8EC9EE"],
  "app-lectoescritura":["Lectoescritura","#9DDCC0"],"app-matematicas":["Matemáticas","#B9A6E8"],"app-familias":["Familias","#F6D776"],
  "app-shop":["Tienda","#E3E7F0"],"app-mova":["MOVA","#E3E7F0"],"lee-con-mochi":["Lectoescritura","#9DDCC0"],"speaking":["Speaking","#FF8FC8"],"ruta":["Grammar","#C9D2FF"]};
function catOf(a){ return CAT[a] || [ACT_NAMES[a] || a, "#F2786B"]; }
function secsOf(r){
  if(r.detail && r.detail.kind==="time") return r.detail.seconds||0;
  if(r.detail && r.detail.seconds && /minuto/.test(r.item||"")) return r.detail.seconds;
  return 0;
}
function fmtMin(s){ if(!s) return ""; const m=Math.round(s/60); if(m<1) return "<1 min"; if(m<60) return m+" min"; const h=Math.floor(m/60); return h+" h "+(m%60?(m%60)+" min":""); }
function rowTitle(r){
  if(/minutos? de práctica/.test(r.item||"")) return ACT_NAMES[r.activity] || r.activity;
  return r.item || (ACT_NAMES[r.activity] || r.activity);
}
function rowRight(r){
  const s = secsOf(r); if(s) return fmtMin(s);
  if(r.item==="Nuevo récord" && r.score!=null) return "Récord: "+r.score;
  if(r.total) return `${r.score}/${r.total}`;
  return r.score!=null ? String(r.score) : "";
}
function dayLabel(d){
  const x=new Date(d), t=new Date(); t.setHours(0,0,0,0); const y=new Date(t); y.setDate(t.getDate()-1);
  if(x>=t) return "Hoy"; if(x>=y) return "Ayer";
  const s=x.toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"}); return s[0].toUpperCase()+s.slice(1);
}

/* ---------- Reporte mensual (PDF) ---------- */
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function loadScript(src){ return new Promise((ok,bad)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=bad; document.head.appendChild(s); }); }
function isReading(r){ return (r.activity==="app-lecturas"||r.activity==="app-library") && r.item && !/Explorando/.test(r.item); }
function openReport(s, rows){
  const now=new Date(), opts=[];
  for(let i=0;i<6;i++){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); opts.push([d.getFullYear(), d.getMonth()]); }
  const w=document.createElement("div"); w.className="rep-wrap";
  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><button class="x" aria-label="Cerrar">×</button>
    <h2>Reporte del mes</h2><p class="sub">${esc(s.full_name)}</p>
    <label class="f" for="rMonth">Mes</label><select class="in" id="rMonth">${opts.map(([y,m],i)=>`<option value="${y}-${m}" ${i===0?"selected":""}>${MESES[m]} ${y}</option>`).join("")}</select>
    <label class="f" for="rNote">Comentario de la maestra (opcional)</label>
    <textarea class="in" id="rNote" placeholder="Ejemplo: Lucía ha avanzado mucho en su lectura. Le recomiendo practicar 10 minutos diarios."></textarea>
    <div class="actions"><button class="btn btn-primary" id="rShare">Compartir</button><button class="btn btn-soft" id="rDown">Descargar PDF</button></div>
    <div class="msg" id="rMsg"></div></div>`;
  document.body.appendChild(w);
  const close=()=>w.remove();
  w.addEventListener("click",e=>{ if(e.target===w) close(); }); w.querySelector(".x").onclick=close;
  const go = async (share) => {
    const m=w.querySelector("#rMsg"), [y,mo]=w.querySelector("#rMonth").value.split("-").map(Number);
    m.className="msg"; m.textContent="Preparando el reporte…";
    w.querySelectorAll(".actions .btn").forEach(b=>b.disabled=true);
    try{
      const file = await buildReport(s, rows, y, mo, w.querySelector("#rNote").value.trim());
      if(share && navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:file.name});
      } else {
        const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      }
      m.className="msg ok"; m.textContent = share ? "Listo." : "Reporte descargado. Búscalo en Descargas.";
    }catch(err){ if(err && err.name==="AbortError"){ m.textContent=""; } else { m.className="msg err"; m.textContent="No se pudo generar el reporte. Revisa tu internet e intenta de nuevo."; } }
    w.querySelectorAll(".actions .btn").forEach(b=>b.disabled=false);
  };
  w.querySelector("#rShare").onclick=()=>go(true);
  w.querySelector("#rDown").onclick=()=>go(false);
  if(!(navigator.canShare)) w.querySelector("#rShare").remove();
}
async function buildReport(s, all, y, mo, note){
  let tasksAll=[]; try{ tasksAll=await rpc("admin_list_tasks",{p_student:String(s.id)})||[]; }catch(e){}
  await Promise.all([loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
                     loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]);
  const rows = all.filter(r=>{ const d=new Date(r.created_at); return d.getFullYear()===y && d.getMonth()===mo; });
  const mTasks=tasksAll.filter(t=>{ const d=new Date(t.created_at); return d.getFullYear()===y && d.getMonth()===mo; })
    .map(t=>({t, done:taskDoneRow(t,all)})).sort((a,b)=>new Date(a.t.created_at)-new Date(b.t.created_at));
  const usedRows=new Set(mTasks.filter(x=>x.done).map(x=>x.done));
  const ownRows=rows.filter(r=>!usedRows.has(r) && !mTasks.some(x=>x.done && taskMatch(x.t,r) && r.activity===x.done.activity && Math.abs(new Date(r.created_at)-new Date(x.done.created_at))<36e5));
  const totalS = rows.reduce((a,r)=>a+secsOf(r),0);
  const activeDays = new Set(rows.map(r=>new Date(r.created_at).getDate()));
  const readings = []; rows.filter(isReading).forEach(r=>{ const t=r.item.replace(/^Lectura · /,""); if(!readings.includes(t)) readings.push(t); });
  const by={}; ownRows.forEach(r=>{ const [n,c]=catOf(r.activity); by[n]=by[n]||{n,c,s:0,k:0}; by[n].s+=secsOf(r); by[n].k++; });
  const cats=Object.values(by).sort((a,b)=>b.s-a.s||b.k-a.k).slice(0,6), maxS=Math.max(1,...cats.map(c=>c.s));
  const results=rows.filter(r=>r.total || r.item==="Nuevo récord").slice(0,5);
  const first=new Date(y,mo,1), dim=new Date(y,mo+1,0).getDate(), lead=(first.getDay()+6)%7;
  let cal=["L","M","M","J","V","S","D"].map(d=>`<em>${d}</em>`).join("");
  for(let i=0;i<lead;i++) cal+="<u></u>";
  for(let d=1; d<=dim; d++) cal+=`<u class="${activeDays.has(d)?"on":""}">${d}</u>`;
  let streak=0,run=0; for(let d=1; d<=dim; d++){ run=activeDays.has(d)?run+1:0; streak=Math.max(streak,run); }
  const nm=s.full_name, firstName=nm.split(/\s+/)[0];
  const n=activeDays.size, head = n>=8 ? `¡Gran mes, ${firstName}!` : n>0 ? `¡Buen trabajo, ${firstName}!` : `Tu mes en MOVA, ${firstName}`;
  const BC=["#B9A6FF","#FF8FC8","#C4EA4F","#8FA2FF","#FFD45E","#9BE7C4"];
  const stat=(v,l,bg)=>`<div style="background:${bg}"><b>${v}</b><span>${l}</span></div>`;
  const html=`<div class="rpA">
    <div class="hd">

  };

}

const TASK_CAT=[
 ["TOEFL",[["toefl-sim","TOEFL Quick Simulation"],["toefl-practice","TOEFL Practice"],["word-forms","Word Forms"],["level-up","Level Up · Placement test"]]],
 ["Lectura",[["lectura","Reading Library (one story)"]]],
 ["Juegos en inglés",[["speaking","Speaking Lab · Read aloud"],["word-quest","Word Quest"],["crucigrama","Crossword"],["sopa-de-letras","WordSearch"],["sentence-builder","Sentence Builder"],["sentence-scramble","Sentence Scramble"],["likes-dislikes","Likes & Dislikes"],["verb-memory","Verb Memory"]]],
 ["Escape rooms",[["locked-library","The Locked Library"],["haunted-mansion","The Haunted Mansion"],["lost-in-the-museum","Lost in the Museum"],["pirate-treasure-island","Pirate Treasure Island"],["space-station-rescue","Space Station Rescue"],["the-detectives-case","The Detective’s Case"],["trapped-in-the-train","Trapped in the Train"]]],
 ["Español y matemáticas",[["lee-con-mochi","Aprende a leer con Mochi"],["feria-mochi","La Feria de Mochi"],["mision-matematica","Misión Matemática"],["la-tiendita","La Tiendita"],["la-balanza","La Balanza"],["la-boveda","La Bóveda"],["lluvia-de-numeros","Lluvia de números"],["detective-patrones","Detective de patrones"],["pizzeria-fracciones","Pizzería de fracciones"],["que-hora-es","¿Qué hora es?"]]]
];
const TASK_NAME=Object.fromEntries(TASK_CAT.flatMap(g=>g[1]));
function taskMatch(t0,r){
  const t=Object.assign({},t0,{task:taskKeyOf(t0)});
  if(r.detail && r.detail.task!=null && String(r.detail.task)===String(t.id)) return true;
  if(new Date(r.created_at) < new Date(t.created_at)) return false;
  if(t.task==="toefl-sim") return !!(r.detail && r.detail.kind==="toefl-sim");
  if(t.task==="lectura") return isReading(r);
  if(r.activity!==t.task) return false;
  if(t.task==="toefl-practice" && r.detail && r.detail.kind==="toefl-sim") return false;
  return r.total!=null || secsOf(r)>=60 || !!(r.detail && r.detail.kind && r.detail.kind!=="time");
}
function taskDoneRow(t,rows){ const m=rows.filter(r=>taskMatch(t,r)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)); return m.find(r=>r.total)||m[0]||null; }

const PCOL={"Listening":"#B9A6FF","Structure":"#8FA2FF","Written Expression":"#FF8FC8","Reading":"#D3F36B"};
const PES={"Listening":"Listening","Structure":"Structure","Written Expression":"Written Expression","Reading":"Reading"};
function isSim(r){ return !!(r && r.total && ((r.detail && r.detail.kind==="toefl-sim") || /quick simulation/i.test(r.item||""))); }
function simKey(r){ return String((r.detail&&r.detail.uid)||r.created_at); }
function fmtT(sec){ sec=Math.max(0,sec|0); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); }
async function loadTasks(s){
  const box=$("#tasks"); if(!box) return;
  box.innerHTML=`<div class="tk"><h3>Tareas</h3><p class="sub">Cargando…</p></div>`;
  let tasks=[], rows=[];
  let tErr="";
  [tasks,rows]=await Promise.all([rpc("admin_list_tasks",{p_student:String(s.id)}).catch(e=>{ tErr=/admin_list_tasks|function/.test(e.message||"")?"Falta pegar el SQL de tareas en Supabase.":(e.message||"No se pudieron cargar las tareas."); return []; }),
    rpc("admin_student_progress",{p_student:s.id,p_limit:1000}).catch(()=>[])]);
  tasks=tasks||[]; rows=rows||[];
  const seen=new Set();
  const sims=rows.filter(isSim).filter(r=>{const u=r.detail&&r.detail.uid; if(!u) return true; if(seen.has(u)) return false; seen.add(u); return true;})
    .sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const d=(x)=>new Date(x).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  const tHtml=tasks.map(t=>{
    const done=taskDoneRow(t,rows);
    const res=done&&done.total?` · ${Math.round(done.score/done.total*100)}%`:"";
    const see=done&&isSim(done)?`<button class="see" data-r="${esc(simKey(done))}">Ver reporte</button>`:"";
    return `<div class="row"><div><b>${esc(String(t.task).includes("~")?t.title:(TASK_NAME[t.task]||t.title))}</b><small>Asignada ${esc(d(t.created_at))}${done?" · terminada "+esc(d(done.created_at)):""}</small></div>
      ${done?`<span class="pill done">Completada${res}</span>${see}`:`<span class="pill pend">Pendiente</span>`}
      <button class="rm" data-t="${t.id}" aria-label="Quitar tarea">×</button></div>`;}).join("");
  const sHtml=sims.length?`<h3 style="margin-top:16px">Simulaciones TOEFL</h3>`+sims.map(r=>`<div class="row"><div><b>${r.score}/${r.total} · ${Math.round(r.score/r.total*100)}%</b><small>${esc(d(r.created_at))} · ${r.detail&&r.detail.secs?fmtT(r.detail.secs)+" min":"Quick Simulation"}</small></div><button class="see" style="margin-left:auto" data-r="${esc(simKey(r))}">Ver reporte</button></div>`).join(""):"";
  const opts=TASK_CAT.map(([g,items])=>`<optgroup label="${esc(g)}">${items.map(([k,n])=>`<option value="${k}">${esc(n)}</option>`).join("")}</optgroup>`).join("");
  box.innerHTML=`<div class="tk"><h3>Tareas</h3><p class="sub">Elige una actividad. ${esc(s.full_name.split(" ")[0])} la verá al abrir la app con su usuario.</p>
    <select class="in" id="asgSel" hidden>${opts}</select>${pickerHtml()}
    <button class="asg" id="asgBtn">Asignar actividad</button>${tHtml||`<p class="sub" style="margin:10px 2px 0">Todavía no tiene tareas asignadas.</p>`}${sHtml}</div>`;
  wirePicker(box);
  $("#asgBtn").onclick=async()=>{ const b=$("#asgBtn"), k=$("#asgSel").value; b.disabled=true; b.textContent="Asignando…";
    const picks=NO_PICK.has(k)?[]:curPicks.slice(), labs=picks.map(x=>x.l).filter(Boolean);
    const task=picks.length?k+"~"+b64url({p:picks.map(x=>({a:x.a,t:x.t,l:x.l})),l:labs}):k, title=(TASK_NAME[k]||k)+(labs.length?" · "+labs.join(" · "):"");
    try{ await rpc("admin_assign_task",{p_student:String(s.id),p_username:s.username,p_task:task,p_title:title}); toast(`${title} asignada a ${s.full_name.split(" ")[0]}`); curPicks=[]; loadTasks(s); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent="Asignar actividad"; } };
  box.querySelectorAll(".rm").forEach(b=>b.onclick=async()=>{ if(!confirm("¿Quitar esta tarea?")) return; try{ await rpc("admin_remove_task",{p_id:+b.dataset.t}); loadTasks(s); }catch(e){ toast(e.message); } });
  box.querySelectorAll(".see").forEach(b=>b.onclick=()=>{ const r=sims.find(x=>simKey(x)===b.dataset.r)||rows.find(x=>simKey(x)===b.dataset.r); if(r) openSimReport(s,r); });
  if(tErr) box.querySelector(".tk").insertAdjacentHTML("beforeend",`<p class="sub" style="margin-top:10px">${esc(tErr)}</p>`);
}
function simReportHtml(s,r){
  const D=r.detail||{}, pct=Math.round(r.score/r.total*100), first=s.full_name.split(" ")[0];
  const order=["Listening","Structure","Written Expression","Reading"];
  const parts=order.filter(p=>D.parts&&D.parts[p]).map(p=>({p,c:D.parts[p][0],t:D.parts[p][1],v:D.parts[p][1]?D.parts[p][0]/D.parts[p][1]:0}));
  const best=[...parts].sort((a,b)=>b.v-a.v)[0], worst=[...parts].sort((a,b)=>a.v-b.v)[0];
  const col=pct>=80?"#D3F36B":pct>=50?"#B9A6FF":"#FF8FC8";
  const lvl=pct>=80?"Excelente desempeño":pct>=60?"Buen desempeño":pct>=40?"En desarrollo":"Necesita reforzar";
  const log=D.log||[], wrong=log.filter(l=>!l.ok).length;
  return `<div class="srp">
    <div class="hd"><span class="k">TOEFL ITP · Quick Simulation</span><h1>${esc(first)}, ${pct>=60?"¡buen trabajo!":"aquí está tu resultado"}</h1>
      <p>${esc(s.full_name)} · ${new Date(r.created_at).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p></div>

function simPdfHtml(s,r,note,R){
  const D=r.detail||{}, pct=Math.round(r.score/r.total*100), nm=s.full_name, first=nm.split(/\s+/)[0];
  const order=["Listening","Structure","Written Expression","Reading"], PC2={"Listening":"#B9A6FF","Structure":"#8FA2FF","Written Expression":"#FF8FC8","Reading":"#C4EA4F"};
  const parts=order.filter(p=>D.parts&&D.parts[p]).map(p=>({p,c:D.parts[p][0],t:D.parts[p][1],v:D.parts[p][1]?D.parts[p][0]/D.parts[p][1]:0}));
  const best=[...parts].sort((a,b)=>b.v-a.v)[0]||{p:"—"}, worst=[...parts].sort((a,b)=>a.v-b.v)[0]||{p:"—"};
  const short=p=>p==="Written Expression"?"Written Exp.":p;
  const lvl=pct>=80?"Excellent performance":pct>=60?"Good performance":pct>=40?"Developing":"Needs reinforcement";
  const head=pct>=60?`Great job, ${first}!`:`Your results, ${first}`;
  const wrong=(D.log||[]).filter(l=>!l.ok).slice(0,4);
  const fecha=new Date(r.created_at).toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  return `<div class="sr2">
  <div class="s2hd"><span class="s2dot" style="width:90px;height:90px;background:#D3F36B;opacity:.6;left:560px;bottom:-34px"></span><span class="s2dot" style="width:22px;height:22px;background:#FF8FC8;left:380px;top:40px"></span><span class="s2dot" style="width:14px;height:14px;background:#8FA2FF;left:520px;top:210px"></span>
  <div class="s2brand"><div class="s2lg"><img src="icon-192.png" alt=""></div><div><b>MOVA Learning Studio</b><small>MOVA Centro Pedagógico</small></div></div>
  <div class="s2ttl"><small>TOEFL ITP · Quick Simulation</small><h1>${esc(head)}</h1></div>
  <img class="s2bl" src="${R.ill}" alt="">
  <img class="s2wv" src="${R.wave}" alt=""></div>
  <div class="s2who"><div class="s2av">${esc(initials(nm))}</div><div><h2>${esc(nm)}</h2><span>Simulation taken on ${esc(fecha)}</span></div>${s.stage?`<em>${esc(s.stage)}</em>`:""}</div>
  <div class="s2st"><div style="background:#ECFBC8"><b>${r.score} / ${r.total}</b><span>Correct answers</span></div><div style="background:#FFE6F2"><b>${D.secs?fmtT(D.secs):"—"}</b><span>Time out of ${fmtT(Math.round((D.limit||1080)/60)*60)} min</span></div><div style="background:#E5E9FF"><b>${esc(short(best.p))}</b><span>Strongest skill</span></div><div style="background:#FFF6D1"><b>${esc(short(worst.p))}</b><span>To improve</span></div></div>
  <div class="s2g"><div class="s2score"><div style="position:relative;width:150px;height:150px"><img src="${R.ring}" style="width:150px;height:150px;display:block" alt=""><span style="position:absolute;inset:0;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-size:42px;font-weight:800">${pct}%</span></div><b>${lvl}</b><small>4 parts · ${r.total} questions</small></div>
  <div class="s2bx"><h3>Results by skill</h3>${parts.length?"":`<p style="margin:6px 0 0;color:#6A6F85;font-size:14px">Overall score: ${r.score} of ${r.total} correct answers.</p>`}${parts.map(x=>`<div class="s2bar"><div><b>${esc(x.p)}</b><span>${x.c}/${x.t} · ${Math.round(x.v*100)}%</span></div><div class="s2tr"><i style="width:${Math.max(4,Math.round(x.v*100))}%;background:${PC2[x.p]}"></i></div></div>`).join("")}</div></div>
  ${wrong.length?`<div class="s2bx s2rv"><h3>Review at home</h3><ul>${wrong.map(l=>`<li><em style="background:${PC2[l.p]||"#EDE8FF"}">${esc(l.p)}</em><span>${esc(l.q)}</span><small>${l.y?`Answered: <u>${esc(l.y)}</u> · `:""}Correct: <u>${esc(l.a)}</u></small></li>`).join("")}</ul></div>`:""}
  ${note?`<div class="s2note"><h3>Teacher's comment</h3><p>${esc(note).replace(/\n/g,"<br>")}</p></div>`:""}
  <div class="s2ft"><span>Short practice simulation, not an official TOEFL score · @movacp.mx</span><span>Generated on ${new Date().toLocaleDateString("en-US",{day:"numeric",month:"long",year:"numeric"})}</span></div></div>`;
}
function toPng(src,w,h){ return new Promise(ok=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(im,0,0,w,h); try{ ok(c.toDataURL("image/png")); }catch(e){ ok(src); } }; im.onerror=()=>ok(src); im.src=src; }); }
async function buildSimPdf(s,r,note){
  await Promise.all([loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
                     loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]);
  let st=document.getElementById("srStage"); if(!st){ st=document.createElement("div"); st.id="srStage"; document.body.appendChild(st); }
  const pct=Math.round(r.score/r.total*100);
  const WAVE="data:image/svg+xml;base64,"+btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 46" preserveAspectRatio="none"><path d="M0 26 C 160 0 300 46 470 22 S 700 6 794 24 L794 46 L0 46Z" fill="#F5F3FA"/></svg>');
  const R={ill:await toPng("sim-report-ill.webp?v=66",648,583), ring:await toPng(ringSvg(pct),300,300), wave:await toPng(WAVE,1588,92)};
  st.innerHTML=simPdfHtml(s,r,note,R);
  await document.fonts.ready;
  await Promise.all([...st.querySelectorAll("img")].map(im=>new Promise(ok=>{ if(im.complete) ok(); else { im.onload=ok; im.onerror=ok; } })));
  const c=await html2canvas(st.firstElementChild,{scale:2,backgroundColor:"#F5F3FA",useCORS:true});
  st.innerHTML="";
  const w=595.28, h=Math.max(841.89, w*c.height/c.width), pdf=new window.jspdf.jsPDF({unit:"pt",format:[w,h]});
  pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,w,w*c.height/c.width);
  return new File([pdf.output("blob")],`TOEFL Simulation - ${s.full_name}.pdf`,{type:"application/pdf"});
}
function openSimReport(s,r){
  let ov=document.getElementById("simOv"); if(ov) ov.remove();
  ov=document.createElement("div"); ov.id="simOv";
  ov.innerHTML=`<div class="bar0"><button id="srClose" style="background:#fff">Cerrar</button><button id="srPdf" style="background:#15192B;color:#fff">Descargar PDF para papás</button></div>
    <div class="srp" style="margin-bottom:12px"><div class="bx" style="margin-top:0"><h3>Comentario de la maestra (opcional)</h3><textarea class="srnote" id="srNote" placeholder="Escríbelo en inglés: aparece tal cual en el PDF para papás"></textarea></div></div>${simReportHtml(s,r)}`;
  document.body.appendChild(ov);
  $("#srClose").onclick=()=>ov.remove();
  $("#srPdf").onclick=async()=>{ const b=$("#srPdf"); b.disabled=true; b.textContent="Generando…";
    try{ const f=await buildSimPdf(s,r,$("#srNote").value.trim());
      if(navigator.canShare&&navigator.canShare({files:[f]})) await navigator.share({files:[f],title:f.name}).catch(()=>{});
      else { const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; a.click(); }
    }catch(e){ toast("No se pudo generar el PDF"); }
    b.disabled=false; b.textContent="Descargar PDF para papás"; };
}

(async () => {
  try{ session = JSON.parse(localStorage.getItem(STORE)||"null"); }catch(e){}
