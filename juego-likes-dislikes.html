<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Likes & Dislikes · MOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--bg:#F5F3FA;--ink:#15192B;--muted:#6A6F85;--line:#ECE9F3;--lime:#D3F36B;--lilac:#B9A6FF;--pink:#FF8FC8;--peri:#8FA2FF;--butter:#FFE071;--mint:#9EEBC9;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--peri);outline-offset:3px;border-radius:14px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.home{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.6px solid var(--ink);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;text-decoration:none;color:var(--ink)}
.home svg{width:16px;height:16px}
.brand{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.h{display:none}
/* entry */
.cover{position:relative;background:linear-gradient(140deg,#FFC7E2,#FFD9EC 50%,#E6DCFF);border-radius:30px;padding:24px 22px 22px;overflow:hidden;min-height:250px}
.cover .k{display:inline-block;background:#fff;border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.cover h1{font-family:"Bricolage Grotesque",sans-serif;font-size:44px;line-height:.92;letter-spacing:-.02em;margin:14px 0 8px;max-width:230px}
.cover p{margin:0;font-size:14.5px;line-height:1.5;max-width:220px;color:#3B3F57}
.cover .pals{position:absolute;right:-6px;bottom:-14px;width:190px;height:200px}
.cover .pals .a{position:absolute;width:120px;right:46px;bottom:6px}
.cover .pals .b{position:absolute;width:104px;right:-8px;bottom:-4px}
.cover .heart{position:absolute;right:120px;top:22px;width:42px}
.cover .x{position:absolute;right:30px;top:58px;width:34px}
.dots i{position:absolute;border-radius:50%}
h2.sec{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;margin:22px 4px 10px}
.lvls{display:grid;gap:10px}
.lvl{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px 16px;text-align:left;border:2px solid transparent;transition:transform .15s}
.lvl:active{transform:scale(.98)}
.lvl.on{border-color:var(--ink)}
.lvl .ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px}
.lvl b{display:block;font-size:16px}.lvl small{color:var(--muted);font-size:13px;line-height:1.4}
.go{display:block;width:100%;margin-top:18px;background:var(--ink);color:#fff;border-radius:999px;padding:16px;font-weight:800;font-size:17px;box-shadow:0 5px 0 var(--lime)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lime)}
.best{text-align:center;color:var(--muted);font-size:13px;margin-top:14px;font-weight:600}
/* game */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.track{flex:1;height:10px;border-radius:9px;background:#E6E1F2;overflow:hidden}.track i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .3s}
.pts{background:var(--lime);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.card{background:#fff;border-radius:28px;padding:18px;box-shadow:0 14px 34px rgba(54,40,120,.08)}
.qn{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scene{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:14px 0 6px}
.who,.what{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:22px;padding:12px 8px;min-height:132px;justify-content:center}
.who{background:#F1EDFF}.what{background:#FFF6D6}
.who svg{width:92px;height:92px}.what svg{width:64px;height:64px}
.who b,.what b{font-size:14px;font-weight:800;text-align:center}
.pron{font-family:"Bricolage Grotesque",sans-serif;font-size:27px;font-weight:800;width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;border:2px solid var(--ink)}
.feel{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink)}
.feel.y{background:var(--lime)}.feel.n{background:var(--pink)}.feel.q{background:var(--butter)}
.feel svg{width:28px;height:28px}
.sent{font-family:"Bricolage Grotesque",sans-serif;font-size:25px;line-height:1.3;text-align:center;margin:16px 4px 4px;font-weight:700}
.sent .gap{display:inline-block;min-width:96px;border-bottom:3px solid var(--ink);margin:0 4px;color:#7B5CF0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{background:#F5F3FA;border:2px solid #E6E1F2;border-radius:18px;padding:14px 10px;font-weight:800;font-size:16px;min-height:56px}
.opt.ok{background:#ECFBC8;border-color:#8CC63F}.opt.no{background:#FFE6F2;border-color:#FF8FC8}
.opt:disabled{cursor:default}
.fb{display:none;margin-top:14px;border-radius:20px;padding:14px 16px;font-size:14.5px;line-height:1.5}
.fb.show{display:block}.fb.good{background:#ECFBC8}.fb.bad{background:#FFE6F2}
.fb b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:18px;margin-bottom:2px}
.fb .say{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px}
.fb .say svg{width:16px;height:16px}
.next{display:none;width:100%;margin-top:14px;background:var(--ink);color:#fff;border-radius:999px;padding:15px;font-weight:800;font-size:16px;box-shadow:0 5px 0 var(--lime)}
.next.show{display:block}
.rule{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rule span{background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted)}
/* end */
.end{text-align:center}
.end .big{font-family:"Bricolage Grotesque",sans-serif;font-size:64px;font-weight:800;line-height:1;margin:6px 0}
.end h1{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;margin:8px 0 4px}
.end p{color:var(--muted);margin:0 0 6px}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0}
.stars svg{width:42px;height:42px}
.end .pal{width:150px;margin:0 auto -8px}
.rev{text-align:left;margin-top:16px}
.rev div{background:#fff;border-radius:16px;padding:10px 14px;margin-top:8px;font-size:14px;display:flex;gap:10px;align-items:center}
.rev i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;flex:none}
.rev .o i{background:var(--lime)}.rev .x i{background:#FFD0E8;color:#A3216A}
.again{background:#fff!important;color:var(--ink)!important;box-shadow:none!important;margin-top:10px!important}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:scale(1);opacity:1}}
.card.anim{animation:pop .25s ease}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opt.no{animation:shake .25s}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="./#/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Home</a><span class="brand">MOVA · Grammar</span></div>

  <section id="s-start">
    <div class="cover">
      <span class="dots"><i style="width:16px;height:16px;background:#fff;left:58%;top:16px;opacity:.8"></i><i style="width:10px;height:10px;background:var(--lilac);left:48%;bottom:34px"></i><i style="width:70px;height:70px;background:var(--lime);opacity:.55;left:-24px;bottom:-24px"></i></span>
      <span class="k">Kids · Children</span>
      <h1>Likes &amp; Dislikes</h1>
      <p>I like pizza. She doesn’t like broccoli. Do you like cats?</p>
      <div class="pals"><span class="a" id="palA"></span><span class="b" id="palB"></span></div>
      <span class="heart" id="cvH"></span><span class="x" id="cvX"></span>
    </div>
    <h2 class="sec">Choose your level</h2>
    <div class="lvls" id="lvls"></div>
    <button class="go" id="go">Start</button>
    <p class="best" id="best"></p>
  </section>

  <section id="s-game" class="h">
    <div class="bar"><div class="track"><i id="prog" style="width:0%"></i></div><span class="pts" id="pts">0 / 10</span></div>
    <div class="card" id="card">
      <div class="qn" id="qn"></div>
      <div class="scene"><div class="who" id="who"></div><div class="feel" id="feel"></div><div class="what" id="what"></div></div>
      <div class="sent" id="sent"></div>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
      <button class="next" id="next">Next</button>
    </div>
    <div class="rule"><span>I · You · We · They → like / don’t like</span><span>He · She · It → likes / doesn’t like</span></div>
  </section>

  <section id="s-end" class="h"><div class="card end" id="endc"></div></section>
</div>

  $("#prog").style.width=(qi/Q.length*100)+"%"; $("#pts").textContent=`${score} / ${Q.length}`;
  $("#qn").textContent=`Question ${qi+1} of ${Q.length}`;
  $("#who").innerHTML = q.s.ch ? D.CH[q.s.ch]+`<b>${q.s.name}</b>` : `<span class="pron">${q.s.name}</span><b>${q.s.name==="I"?"me":q.s.name==="You"?"you":q.s.name==="We"?"us":"them"}</b>`;
  const f=$("#feel"); f.className="feel "+(q.like===null?"q":q.like?"y":"n"); f.innerHTML=q.like===null?QM:q.like?HEART:CROSS;
  $("#what").innerHTML=D.ICONS[q.it[0]]+`<b>${q.it[0]}</b>`;
  if(q.type==="sa") $("#sent").innerHTML=`${q.q}<br><span class="gap">&nbsp;?&nbsp;</span>`;
  else $("#sent").innerHTML = q.type==="do" ? `<span class="gap">&nbsp;</span> ${q.post}` : `${q.pre} <span class="gap">&nbsp;</span> ${q.post}`;
  const o=$("#opts"); o.style.gridTemplateColumns=q.type==="sa"?"1fr":"1fr 1fr";
  o.innerHTML=shuf(q.opts).map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join("");
  o.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b));
  $("#fb").className="fb"; $("#next").className="next";
}
function pick(b){
  const q=Q[qi], ok=b.dataset.v===q.ans;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.dataset.v===q.ans) x.classList.add("ok");});
  if(!ok) b.classList.add("no"); else score++;
  log.push({ok,full:q.full});
  $("#pts").textContent=`${score} / ${Q.length}`;
  if(q.type==="sa") $("#sent").innerHTML=`${q.q}<br><span class="gap" style="border:0">${q.ans}</span>`;
  else $("#sent").innerHTML = q.full.replace(q.ans,`<span class="gap" style="border:0">${q.ans}</span>`);
  const fb=$("#fb"); fb.className="fb show "+(ok?"good":"bad");
  fb.innerHTML=`<b>${ok?rnd(["Great job!","Excellent!","You got it!","Well done!"]):"Not quite"}</b>${q.tip}<br><button class="say" id="say">${SPK} Listen again</button>`;
  $("#say").onclick=()=>speak(q.full);
  speak(q.full);
  const n=$("#next"); n.className="next show"; n.textContent=qi===Q.length-1?"See my score":"Next";
}
$("#next").onclick=()=>{ qi++; if(qi<Q.length) render(); else end(); };
function end(){
  $("#prog").style.width="100%";
  const st=score>=9?3:score>=6?2:score>=3?1:0;
  const key="mova-ld-best-"+lv, best=Math.max(score,+localStorage.getItem(key)||0); localStorage.setItem(key,best);
  try{ if(window.MovaAuth&&MovaAuth.user()) MovaAuth.save("likes-dislikes","Likes & Dislikes · "+LV.find(l=>l.k===lv).n,score,Q.length,{kind:"score",level:lv}); }catch(e){}
  $("#endc").innerHTML=`<div class="pal">${score>=6?D.CH.Bloom:D.CH.Echo}</div><h1>${score>=9?"Amazing!":score>=6?"Great job!":"Keep practicing!"}</h1>
   <div class="stars">${[0,1,2].map(i=>STAR(i<st)).join("")}</div><div class="big">${score}<span style="font-size:26px;color:var(--muted)"> / ${Q.length}</span></div>
   <p>${LV.find(l=>l.k===lv).n} · Best: ${best} / ${Q.length}</p>
   <div class="rev">${log.map(l=>`<div class="${l.ok?"o":"x"}"><i>${l.ok?"✓":"✕"}</i><span>${l.full}</span></div>`).join("")}</div>
   <button class="go" id="again">Play again</button><button class="go again" id="lvlbtn">Change level</button>`;
  show("#s-end");
  $("#again").onclick=start; $("#lvlbtn").onclick=()=>{showBest();show("#s-start");};
}
$("#go").onclick=start;
})();
</script>
<script src="mova-auth.js"></script>
</body>
</html>
