<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penalty Shootout · MOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="mova-voice.js"></script>
<style>
:root{
  --bg:#EEF3FA; --card:#FFFFFF; --ink:#1B2A55; --muted:#5B6787; --tile:#F5F7FC; --edge:#DCE2F0; --track:#E6EBF5;
  --coral:#FF7A6B; --sky:#5BC0F0; --mustard:#F2B632; --mint:#4FD1A5; --lilac:#A98BE8; --navy:#1E3A5F;
  --good:#1F9A47; --good-bg:#DDF6E4; --bad:#E5484D; --bad-bg:#FDE4E4;
  --shadow:0 10px 0 rgba(27,42,85,.06),0 24px 48px rgba(27,42,85,.12);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111832;--card:#1d2748;--ink:#F3F5FF;--muted:#AEB8D8;--tile:#26315a;--edge:#36437a;--track:#2b365f;--good-bg:rgba(31,154,71,.24);--bad-bg:rgba(229,72,77,.24);--shadow:0 10px 0 rgba(0,0,0,.25),0 24px 48px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111832;--card:#1d2748;--ink:#F3F5FF;--muted:#AEB8D8;--tile:#26315a;--edge:#36437a;--track:#2b365f;--good-bg:rgba(31,154,71,.24);--bad-bg:rgba(229,72,77,.24);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;font-family:Poppins,"Century Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg);
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22180%22%20height%3D%22180%22%3E%3Cg%20transform%3D%22rotate%28-15%2030%2034%29%22%20opacity%3D%22.55%22%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%2234%22%20r%3D%2211%22%20fill%3D%22%23fff%22%20stroke%3D%22%23FF7A6B%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M30%2028.5l4.9%203.5-1.8%205.6h-6.1l-1.8-5.6z%22%20fill%3D%22%23FF7A6B%22/%3E%3Cpath%20d%3D%22M30%2028.5V23.0M34.9%2032.0l5.4-1.7M25.1%2032.0l-5.4-1.7%22%20stroke%3D%22%23FF7A6B%22%20stroke-width%3D%221.4%22/%3E%3C/g%3E%3Cg%20transform%3D%22rotate%2820%20120%2022%29%22%20opacity%3D%22.55%22%3E%3Ccircle%20cx%3D%22120%22%20cy%3D%2222%22%20r%3D%228%22%20fill%3D%22%23fff%22%20stroke%3D%22%235BC0F0%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M120%2018.0l3.6%202.6-1.3%204.1h-4.4l-1.3-4.1z%22%20fill%3D%22%235BC0F0%22/%3E%3Cpath%20d%3D%22M120%2018.0V14.0M123.6%2020.6l3.9-1.2M116.4%2020.6l-3.9-1.2%22%20stroke%3D%22%235BC0F0%22%20stroke-width%3D%221.4%22/%3E%3C/g%3E%3Cg%20transform%3D%22rotate%2810%20150%20104%29%22%20opacity%3D%22.55%22%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%22104%22%20r%3D%2212%22%20fill%3D%22%23fff%22%20stroke%3D%22%23F2B632%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M150%2098.0l5.3%203.9-2.0%206.1h-6.7l-2.0-6.1z%22%20fill%3D%22%23F2B632%22/%3E%3Cpath%20d%3D%22M150%2098.0V92.0M155.3%20101.9l5.9-1.9M144.7%20101.9l-5.9-1.9%22%20stroke%3D%22%23F2B632%22%20stroke-width%3D%221.4%22/%3E%3C/g%3E%3Cg%20transform%3D%22rotate%28-25%2066%20118%29%22%20opacity%3D%22.55%22%3E%3Ccircle%20cx%3D%2266%22%20cy%3D%22118%22%20r%3D%229%22%20fill%3D%22%23fff%22%20stroke%3D%22%234FD1A5%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M66%20113.5l4.0%202.9-1.5%204.6h-5.0l-1.5-4.6z%22%20fill%3D%22%234FD1A5%22/%3E%3Cpath%20d%3D%22M66%20113.5V109.0M70.0%20116.4l4.4-1.4M62.0%20116.4l-4.4-1.4%22%20stroke%3D%22%234FD1A5%22%20stroke-width%3D%221.4%22/%3E%3C/g%3E%3Cg%20transform%3D%22rotate%280%2024%20162%29%22%20opacity%3D%22.55%22%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%22162%22%20r%3D%227%22%20fill%3D%22%23fff%22%20stroke%3D%22%23A98BE8%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M24%20158.5l3.1%202.3-1.2%203.6h-3.9l-1.2-3.6z%22%20fill%3D%22%23A98BE8%22/%3E%3Cpath%20d%3D%22M24%20158.5V155.0M27.1%20160.8l3.4-1.1M20.9%20160.8l-3.4-1.1%22%20stroke%3D%22%23A98BE8%22%20stroke-width%3D%221.4%22/%3E%3C/g%3E%3Cg%20transform%3D%22rotate%2835%20104%20166%29%22%20opacity%3D%22.55%22%3E%3Ccircle%20cx%3D%22104%22%20cy%3D%22166%22%20r%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%235BC0F0%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M104%20161.0l4.4%203.2-1.7%205.1h-5.6l-1.7-5.1z%22%20fill%3D%22%235BC0F0%22/%3E%3Cpath%20d%3D%22M104%20161.0V156.0M108.4%20164.2l4.9-1.6M99.6%20164.2l-4.9-1.6%22%20stroke%3D%22%235BC0F0%22%20stroke-width%3D%221.4%22/%3E%3C/g%3E%3C/svg%3E");background-size:180px 180px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:12px}
.app{min-height:100%;display:grid;place-items:center;padding:18px 14px 28px}
.card{width:100%;max-width:600px;background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:24px 20px 26px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:inline-block;border:1.5px solid var(--ink);padding:4px 9px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.06em}
.back{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:8px 0}
.hero{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:14px}
.hero svg{width:128px;height:auto}
.hero-ball{width:112px;height:112px;filter:drop-shadow(0 10px 12px rgba(27,42,85,.22));transform:rotate(-12deg)}
h1{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(36px,10vw,52px);line-height:.95;margin:0 0 8px;letter-spacing:-.02em}
h2{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:30px;margin:0}
h1.title{display:flex;flex-wrap:wrap;gap:0 .28em}
h1.title .w{display:inline-flex;white-space:nowrap}
h1.title .l{display:inline-block;color:var(--c);text-shadow:0 3px 0 color-mix(in srgb,var(--c) 45%,#1B2A55);transform:rotate(var(--r)) translateY(var(--y));}
.pitchline{height:10px;border-radius:10px;margin:16px 0 2px;background:repeating-linear-gradient(90deg,#3B9A5C 0 26px,#4FB06F 26px 52px)}
.lead{color:var(--muted);margin:0}
.label{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:var(--tile);border-radius:16px;margin-top:18px}
.mode{height:44px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--edge)}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stage{display:grid;gap:1px;text-align:left;padding:11px 12px;border-radius:16px;background:color-mix(in srgb,var(--c) 9%,var(--card));border:2px solid transparent;min-height:60px}
.stage b{font-size:14px;line-height:1.15}
.stage small{font-size:12px;color:var(--muted);font-weight:500}
.stage[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card))}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.topic{padding:12px;border-radius:16px;background:color-mix(in srgb,var(--c) 9%,var(--card));border:2px solid transparent;text-align:left;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;min-height:54px}
.topic i{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.topic[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card))}
.rule{font-size:13.5px;color:var(--muted);margin:10px 2px 0;min-height:20px;line-height:1.5}
.play{width:100%;margin-top:20px;height:56px;border-radius:18px;background:linear-gradient(90deg,#1E3A5F,#2F6B8F);color:var(--card);font-weight:700;font-size:17px;box-shadow:0 6px 0 color-mix(in srgb,var(--ink) 60%,#000)}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 60%,#000)}
.ghost{width:100%;margin-top:10px;height:50px;border-radius:16px;background:var(--tile);font-weight:600}
.best{text-align:center;font-size:13px;color:var(--muted);margin:12px 0 0;min-height:20px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--tile);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

/* Marcador */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--navy);color:#FFFDFA;border-radius:18px;padding:10px 14px;flex:1}
.team b{display:block;font-size:12.5px;letter-spacing:.04em}
.team.r{text-align:right}
.pens{display:flex;gap:4px;margin-top:5px}
.team.r .pens{justify-content:flex-end}
.pens i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}
.pens i.g{background:var(--mint)} .pens i.m{background:var(--coral)}
.sc{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:28px;line-height:1;white-space:nowrap}
.hud{display:flex;gap:8px;align-items:stretch}

.turn{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:16px 2px 6px}
.turn b{font-size:15px}
.turn span{font-size:13px;color:var(--muted);text-align:right}
.timer{height:6px;border-radius:6px;background:var(--track);overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;width:100%;background:var(--mint);border-radius:6px;transform-origin:left;transition:background .3s}
.timer i.hurry{background:var(--coral)}
.q{min-height:96px;display:grid;place-items:center;text-align:center;gap:4px;margin-bottom:12px}
.art svg{display:block;height:84px;width:auto;margin:0 auto}
.prompt{font-size:19px;font-weight:600;line-height:1.35;margin:0;max-width:30ch}
.prompt.math{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-size:34px;font-weight:800;letter-spacing:-.01em}
.prompt .blank{display:inline-block;min-width:56px;border-bottom:3px solid var(--sky);margin:0 4px;transform:translateY(-3px)}
.ask{font-size:13.5px;color:var(--muted);margin:0}

.pitch{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 6px 0 rgba(27,42,85,.08)}
.pitch svg{display:block;width:100%;height:auto}
#ball,#keeper{transform-box:fill-box;transition:transform .62s cubic-bezier(.2,.75,.25,1)}
#ball{transform-origin:center}
#keeper{transform-origin:50% 100%}
#net.shake{animation:net .5s}
@keyframes net{25%{transform:translateY(3px)}55%{transform:translateY(-2px)}80%{transform:translateY(1px)}}
.zone{position:absolute;transform:translate(-50%,-50%);padding:8px 12px;border-radius:12px;background:rgba(255,253,250,.94);color:#1B2A55;font-weight:700;font-size:14.5px;line-height:1.15;box-shadow:0 4px 0 rgba(27,42,85,.28);border:2px solid #FFFDFA;max-width:46%;min-width:54px;text-align:center;transition:opacity .25s,background .2s,border-color .2s}
.zone:active{transform:translate(-50%,-50%) scale(.96)}
.zone.dim{opacity:.35}
.zone.good{background:#DDF6E4;border-color:#1F9A47;color:#14713A;opacity:1}
.zone.bad{background:#FDE4E4;border-color:#E5484D;color:#B4262B;opacity:1}
.flash{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(34px,10vw,50px);color:#FFFDFA;text-shadow:0 4px 0 rgba(27,42,85,.45),0 10px 24px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none}
.flash.on{animation:pop .9s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.note{min-height:24px;text-align:center;font-size:14px;font-weight:600;color:var(--muted);margin-top:12px}

.end{text-align:center}
.result{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:44px;line-height:1;margin:16px 0 6px}
.final-board{display:inline-flex;gap:14px;align-items:center;background:var(--navy);color:#FFFDFA;border-radius:16px;padding:10px 18px;font-weight:600;margin:8px 0 6px}
.final-board strong{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-size:26px}
.stars{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.stars svg{width:40px;height:40px}
.final{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:60px;line-height:1;margin:6px 0 0}
.final-l{color:var(--muted);margin:2px 0 14px}
.sumrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:999px;background:var(--tile);font-size:13.5px;font-weight:600;white-space:nowrap}
.review{margin-top:18px;text-align:left;background:var(--tile);border-radius:18px;padding:14px 16px}
.review h3{margin:0 0 8px;font-size:14px}
.review ul{margin:0;padding:0 0 0 18px;display:grid;gap:6px;font-size:15px}
.review b{color:var(--good)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main class="app">
<div class="card">

  <section id="s-start">
    <div class="top"><a class="back" href="./#/games">MOVA Learning Studio</a><span class="brand">MOVA · Centro Pedagógico</span></div>
    <div class="hero">
      <div><h1 class="title" id="title" aria-label="Penalty Shootout"></h1><p class="lead" id="lead"></p></div>
      <img class="hero-ball" id="hero-ball" alt="" width="112" height="112">
    </div>
    <div class="pitchline" aria-hidden="true"></div>
    <div class="modes" role="group" aria-label="Subject">
      <button class="mode" data-m="english">English</button>
      <button class="mode" data-m="math">Matemáticas</button>
    </div>
    <p class="label" id="l-stage"></p>
    <div class="stages" id="stages"></div>
    <p class="label" id="l-topic"></p>
    <div class="topics" id="topics"></div>
    <p class="rule" id="rule"></p>
    <button class="play" id="play"></button>
    <p class="best" id="best"></p>
  </section>

  <section id="s-game" hidden>
    <div class="hud">
      <button class="icon-btn" id="home" aria-label="Back to start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
      <div class="board">
        <div class="team"><b>MOVA</b><span class="pens" id="pens-you"></span></div>
        <div class="sc" id="sc">0 – 0</div>
        <div class="team r"><b id="rival-name">Rivals</b><span class="pens" id="pens-rival"></span></div>
      </div>
    </div>
    <div class="turn"><b id="turn-title"></b><span id="turn-instr"></span></div>
    <div class="timer"><i id="timer"></i></div>
    <div class="q"><div class="art" id="art"></div><p class="prompt" id="prompt"></p><p class="ask" id="ask"></p></div>

function ballSVG(cx, cy, r, fill) {
  const dark = fill === "#FFFFFF" || fill === "#FFFDFA";
  const k = r / 9;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="#1B2A55" stroke-width="${Math.max(1.4, 1.6 * k)}"/>` +
    `<path d="M${cx} ${cy - 4.5 * k}l${4 * k} ${2.9 * k}-${1.5 * k} ${4.6 * k}h-${5 * k}l-${1.5 * k}-${4.6 * k}z" fill="${dark ? "#1B2A55" : "rgba(0,0,0,.28)"}"/>`;
}
const imgBall = (cx, cy, r) => `<image href="${IMG.ball}" x="${cx - r}" y="${cy - r}" width="${2 * r}" height="${2 * r}"/>`;
function demoArt(near, plural) {

  const arm = near ? `<path d="M51 43l22 12" stroke="#5BC0F0" stroke-width="7" stroke-linecap="round"/>` : `<path d="M51 42l26-8" stroke="#5BC0F0" stroke-width="7" stroke-linecap="round"/><path d="M84 32H186" stroke="#9DBDDD" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>`;

}
const colorArt = (hex) => `<svg viewBox="0 0 80 80"><ellipse cx="40" cy="74" rx="20" ry="3.5" fill="rgba(27,42,85,.15)"/>${ballSVG(40, 40, 28, hex)}</svg>`;
function countArt(n) {
  let s = ""; const per = n > 5 ? Math.ceil(n / 2) : n;
  for (let i = 0; i < n; i++) { const row = Math.floor(i / per), col = i % per, cols = row ? n - per : per; s += imgBall(130 - (cols - 1) * 13 + col * 26, n > 5 ? 22 + row * 34 : 40, 12); }
  return `<svg viewBox="0 0 260 80">${s}</svg>`;
}

}

/* Matemáticas: preguntas generadas al azar */
function mathQ(p, ans, cands) {
  const d = []; cands.concat([ans + 1, ans - 1, ans + 2, ans - 2, ans + 3]).forEach((c) => { if (c !== ans && !d.includes(c) && d.length < 2) d.push(c); });
  const A = neg(ans);
  return { p, a: A, opts: shuffle([A].concat(d.map(neg))), math: true, review: `${p.replace(" = ?", "")} = ${A}` };
}
const sg = (n) => (n < 0 ? `(−${-n})` : `(+${n})`);
const MATH = {
  kids: [
    { id: "m-sumas", label: "Sumas", c: "var(--coral)", rule: "Suma los números. Puedes contar con los dedos.", gen: () => { const a = rnd(1, 12), b = rnd(1, Math.min(9, 20 - a)); return mathQ(`${a} + ${b} = ?`, a + b, [a + b + 10]); } },
    { id: "m-restas", label: "Restas", c: "var(--sky)", rule: "Al número grande quítale el pequeño.", gen: () => { const a = rnd(6, 20), b = rnd(1, Math.min(9, a - 1)); return mathQ(`${a} − ${b} = ?`, a - b, [a + b]); } }
  ],
  children: [
    { id: "m-tablas", label: "Tablas de multiplicar", c: "var(--mustard)", rule: "Recuerda: multiplicar es sumar el mismo número varias veces.", gen: () => { const a = rnd(2, 10), b = rnd(2, 10); return mathQ(`${a} × ${b} = ?`, a * b, [a * (b + 1), a * (b - 1), a + b]); } },
    { id: "m-fracciones", label: "Fracciones", c: "var(--mint)", rule: "Divide entre el denominador y multiplica por el numerador.", gen: () => { const d = pick([2, 3, 4, 5]), k = rnd(1, d - 1), n = d * rnd(2, 6), ans = (n / d) * k; return mathQ(`${k}/${d} de ${n} = ?`, ans, [n / d === ans ? ans + n / d : n / d, n - ans]); } }
  ],
  teens: [
    { id: "m-signos", label: "Leyes de los signos", c: "var(--lilac)", rule: "Signos iguales dan positivo. Signos diferentes dan negativo.",
      gen: () => { const a = rnd(2, 12) * pick([1, -1]), b = rnd(2, 9) * pick([1, -1]);
        if (Math.random() < .5) return mathQ(`${sg(a)} × ${sg(b)} = ?`, a * b, [-a * b, a + b]);
        const p = a * b; return mathQ(`${sg(p)} ÷ ${sg(b)} = ?`, a, [-a, p + b]); } },
    { id: "m-jerarquia", label: "Jerarquía de operaciones", c: "var(--coral)", rule: "Primero paréntesis, luego multiplicación y división, al final suma y resta.",
      gen: () => { const a = rnd(2, 9), b = rnd(2, 9), c = rnd(2, 6), t = rnd(1, 4);
        if (t === 1) return mathQ(`${a} + ${b} × ${c} = ?`, a + b * c, [(a + b) * c]);
        if (t === 2) return mathQ(`(${a} + ${b}) × ${c} = ?`, (a + b) * c, [a + b * c]);
        if (t === 3) { const d = rnd(2, 4); return mathQ(`${a} × ${b} − ${c} × ${d} = ?`, a * b - c * d, [(a * b - c) * d]); }
        const n = c * rnd(2, 6); return mathQ(`${n} ÷ ${c} + ${a} × ${b} = ?`, n / c + a * b, [(n / c + a) * b]); } }
  ]
};

function next() {
  st.i++;
  const g = st.you.filter(Boolean).length, r = st.rival.filter(Boolean).length;
  if (st.i >= st.turns.length) {
    if (g === r && st.turns.length < 16) st.turns.push("shoot", "save");
    else return finish();
  }
  turn();
}
function finish() {
  show("end");
  const t = T(), g = st.you.filter(Boolean).length, r = st.rival.filter(Boolean).length;
  const res = g > r ? "win" : g < r ? "lose" : "draw";
  if (res === "win") st.score += 200;
  $("#result").textContent = t[res];
  $("#final-sc").textContent = `${g} – ${r}`; $("#final-rival").textContent = t.rivals;
  const pct = st.correct / st.asked, stars = pct >= .9 ? 3 : pct >= .6 ? 2 : pct >= .3 ? 1 : 0;
  $("#stars").innerHTML = [0, 1, 2].map((i) => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.5l1.3-6.6L2.5 9.3l6.6-.8z" fill="${i < stars ? "#F2B632" : "var(--track)"}"/></svg>`).join("");
  $("#final").textContent = st.score; $("#final-l").textContent = t.points;
  $("#sum-correct").textContent = t.correct(st.correct, st.asked);
  const best = getBest(); if (st.score > best) setBest(st.score);
  $("#sum-best").textContent = st.score > best ? t.record : t.rec(best);
  $("#review").hidden = !st.missed.length; $("#review-t").textContent = t.review;
  $("#review-list").innerHTML = [...new Set(st.missed)].map((s) => `<li>${esc(s)}</li>`).join("");
  $("#again").textContent = t.again; $("#change").textContent = t.change;
  if (res === "win") { fanfare(); crowd(true); burst(140); } else whistle();
}
$("#play").addEventListener("click", start);
$("#again").addEventListener("click", start);
$("#change").addEventListener("click", () => { drawStart(); show("start"); });
$("#home").addEventListener("click", () => { st.locked = true; cancelAnimationFrame(st.raf); if (synth) synth.cancel(); drawStart(); show("start"); });

/* ---------- Confeti ---------- */
const cv = $("#fx"), cx = cv.getContext("2d"); let parts = [], fxOn = false;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
function burst(n) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#FF7A6B", "#5BC0F0", "#F2B632", "#4FD1A5", "#A98BE8"];
  for (let i = 0; i < n; i++) parts.push({ x: cv.width / 2, y: cv.height / 2.5, vx: (Math.random() - .5) * 16 * devicePixelRatio, vy: (Math.random() * -12 - 4) * devicePixelRatio, r: (3 + Math.random() * 5) * devicePixelRatio, c: cols[i % cols.length], life: 80 });
  if (!fxOn) { fxOn = true; requestAnimationFrame(drawFx); }
}
function drawFx() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += .45 * devicePixelRatio; p.life--; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fill(); });
  parts = parts.filter((p) => p.life > 0 && p.y < cv.height + 40);
  if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; cx.clearRect(0, 0, cv.width, cv.height); }
}
})();
</script>
