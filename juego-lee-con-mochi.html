<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprende a leer con Mochi · MOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--page:#FBF6EE;--card:#FFFFFF;--ink:#1E3A5F;--muted:#5E6886;--line:#EDE3D3;--tile:#FFFBF5;--isl:#E8846B;--isl-soft:#FCE3DA;--good:#1E9A52;--good-bg:#DDF5E5;--bad:#E5484D;--bad-bg:#FDE3E3;--gold:#F2B632;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#141a2e;--card:#1d2540;--ink:#F3F1EC;--muted:#B8BED3;--line:#2e3858;--tile:#232c4b;--good-bg:rgba(30,154,82,.22);--bad-bg:rgba(229,72,77,.22);color-scheme:dark}}
:root[data-theme="dark"]{--page:#141a2e;--card:#1d2540;--ink:#F3F1EC;--muted:#B8BED3;--line:#2e3858;--tile:#232c4b;--good-bg:rgba(30,154,82,.22);--bad-bg:rgba(229,72,77,.22);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font-family:'Poppins','Century Gothic',system-ui,sans-serif;background-color:var(--page);
background-image:radial-gradient(circle,rgba(232,132,107,.28) 6px,transparent 7px),radial-gradient(circle,rgba(111,168,214,.28) 6px,transparent 7px),radial-gradient(circle,rgba(224,176,74,.28) 6px,transparent 7px),radial-gradient(circle,rgba(127,184,158,.28) 6px,transparent 7px);
background-size:120px 120px;background-position:0 0,60px 30px,30px 75px,90px 105px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,.isl:focus-visible{outline:4px solid var(--isl);outline-offset:3px}
[hidden]{display:none!important}
.app{min-height:100%;display:flex;justify-content:center;padding:58px 12px 20px}
.panel{width:100%;max-width:560px;background:var(--card);border-radius:30px;padding:20px 18px 24px;border:1px solid var(--line);box-shadow:0 1px 0 var(--line),0 24px 56px rgba(30,58,95,.14)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wordmark{font-weight:800;font-size:20px;letter-spacing:.08em}
.wordmark small{display:block;font-size:10px;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--isl)}
h1{font-weight:800;font-size:clamp(28px,8.5vw,36px);line-height:1.08;margin:6px 0 4px}
.lead{color:var(--muted);font-weight:500;font-size:15px;line-height:1.5;margin:0}
.map{position:relative;margin-top:16px}
.map-svg{display:block;width:100%;height:auto;border-radius:26px}
.isl{cursor:pointer;transition:transform .15s}
.isl.locked{cursor:not-allowed}
.map-mochi{position:absolute;width:22%;transform:translateX(-50%);pointer-events:none}
.map-msg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;white-space:nowrap}
.teacher{display:block;margin:14px auto 0;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;font-size:13px;color:var(--muted)}
.mochi{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;transform-origin:50% 90%}
.mochi.idle{animation:breathe 3.2s ease-in-out infinite}.mochi.happy{animation:hop .6s ease}.mochi.sad{animation:wob .5s ease}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03,.98)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px) scale(1.04)}65%{transform:translateY(0) scale(.98,1.02)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--isl-soft);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.isle-hero{display:grid;grid-template-columns:1fr 132px;align-items:center;gap:12px;margin-top:12px;background:var(--isl-soft);border-radius:24px;padding:16px 16px 12px}
.isle-letter{font-family:'Andika',sans-serif;font-weight:700;font-size:64px;line-height:1;color:var(--isl)}
.isle-letter span{font-size:52px;margin-left:6px}
.label{font-weight:700;font-size:15px;margin:18px 0 8px}
.syls{display:flex;flex-wrap:wrap;gap:8px}
.syl{border:2px solid var(--line);background:var(--tile);border-radius:14px;padding:8px 14px;font-family:'Andika',sans-serif;font-weight:700;font-size:22px;box-shadow:0 3px 0 var(--line)}
.syl:active{transform:translateY(2px)}
.words{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wcard{border:2px solid var(--line);background:var(--tile);border-radius:16px;padding:6px 4px 8px;display:grid;justify-items:center;gap:2px;box-shadow:0 3px 0 var(--line)}
.wcard svg{width:100%;max-width:74px;height:auto}
.wcard span{font-family:'Andika',sans-serif;font-weight:700;font-size:15px}
.best{margin:16px 0 0;text-align:center;color:var(--muted);font-weight:600;font-size:14px}
.primary{display:block;width:100%;margin-top:14px;border:0;border-radius:999px;background:var(--isl);color:#fff;font-weight:800;font-size:20px;padding:16px;box-shadow:0 6px 0 rgba(30,58,95,.25)}
.primary:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(30,58,95,.25)}
.ghost{display:block;width:100%;margin-top:12px;border:2px solid var(--ink);background:transparent;border-radius:999px;font-weight:700;font-size:16px;padding:12px}
.hud{display:flex;align-items:center;gap:10px}
.hud .icon{border:0;background:var(--isl-soft);border-radius:14px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.hud-mid{flex:1;min-width:0}
.hud-mid b{display:block;font-size:13px;color:var(--muted)}
.bar{display:flex;gap:4px;margin-top:4px}
.bar i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.bar i.done{background:var(--isl)}.bar i.now{background:var(--isl);opacity:.45}
.hud .stars{font-weight:800;color:var(--gold);font-size:18px;flex:none}
.stage{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;margin:14px 0 4px}
.bubble{position:relative;background:var(--isl-soft);border-radius:18px;padding:12px 14px;font-weight:600;font-size:15.5px;line-height:1.4;min-height:52px;display:flex;align-items:center}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);border:10px solid transparent;border-right-color:var(--isl-soft);border-left:0}
.task{display:flex;flex-direction:column;align-items:center;gap:12px;margin:10px 0 16px;min-height:150px;justify-content:center}
.pic-btn{border:0;background:var(--tile);border-radius:24px;padding:6px 14px;box-shadow:inset 0 0 0 2px var(--line)}
.pic{display:block;width:150px;height:auto}
.listen{display:flex;align-items:center;gap:12px;border:0;border-radius:999px;background:var(--isl);color:#fff;font-weight:700;font-size:18px;padding:10px 26px 10px 10px;box-shadow:0 5px 0 rgba(30,58,95,.25)}
.listen .ic{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center}
.slots{display:flex;gap:8px;justify-content:center;font-family:'Andika',sans-serif}
.slot{min-width:76px;height:62px;border-radius:16px;border:3px dashed var(--line);display:grid;place-items:center;font-size:32px;font-weight:700;padding:0 10px}
.slot.filled{border-style:solid;border-color:var(--isl);background:var(--isl-soft)}
.slot.gap{border-color:var(--isl);color:var(--isl);animation:pulse 1.4s ease-in-out infinite}
.slot.good{border-color:var(--good);background:var(--good-bg)}.slot.bad{border-color:var(--bad);background:var(--bad-bg)}
@keyframes pulse{50%{transform:scale(1.06)}}
.split{font-family:'Andika',sans-serif;font-weight:700;font-size:30px;color:var(--isl)}
.beats{display:flex;gap:8px;min-height:18px}
.beats i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line)}
.beats i.on{background:var(--isl);border-color:var(--isl)}
.drum{border:0;background:transparent;padding:0;width:150px}
.drum svg{display:block;width:100%}
.drum.hit{animation:hitd .22s ease}
@keyframes hitd{40%{transform:scale(.92,.86) translateY(6px)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.tiles{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
.opt{border:3px solid var(--line);background:var(--tile);border-radius:22px;padding:14px 6px;font-family:'Andika',sans-serif;font-weight:700;font-size:clamp(32px,9.5vw,42px);line-height:1.1;box-shadow:0 6px 0 var(--line);transition:transform .1s}
.opt:active{transform:translateY(3px)}
.opt.used{opacity:.25;pointer-events:none}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 6px 0 var(--good);animation:pop .4s}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 6px 0 var(--bad);animation:shake .4s}
.go{grid-column:1/-1;border:0;border-radius:999px;background:var(--isl);color:#fff;font-weight:800;font-size:20px;padding:14px;box-shadow:0 6px 0 rgba(30,58,95,.25)}
.tools{display:flex;justify-content:center;gap:10px;margin-top:14px}
.tools button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px}
@keyframes pop{40%{transform:scale(1.07)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.end-title{font-weight:800;font-size:clamp(26px,7.6vw,34px);text-align:center;margin:8px 0 4px;line-height:1.15}
.end-sub{text-align:center;color:var(--muted);margin:0;font-weight:500}
.end-stars{display:flex;justify-content:center;gap:2px;font-size:26px;margin:14px 0 4px;color:var(--line)}
.end-stars .on{color:var(--gold)}
.end-count{text-align:center;font-weight:700;margin:0}
.acts{display:grid;gap:10px}
.act{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--tile);border-radius:20px;padding:10px 14px 10px 10px;box-shadow:0 4px 0 var(--line)}
.act:active{transform:translateY(3px)}
.act.main{background:var(--isl-soft);border-color:var(--isl);box-shadow:0 4px 0 var(--isl)}
.act-ic svg{display:block;width:64px;height:64px}
.act-tx b{display:block;font-size:16.5px;line-height:1.2}
.act-tx small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:2px}
.act-tx em{display:inline-block;font-style:normal;font-size:12px;font-weight:700;color:#B98710;margin-top:4px}
.best{margin:14px 0 0;text-align:center;color:var(--muted);font-weight:600;font-size:14px}
.alien-wrap{background:radial-gradient(circle at 50% 40%,#2B3A6B 0 60%,#1E2A55 61%);border-radius:24px;padding:8px 18px}
.alien-wrap .pic{width:140px}
.opts.one{grid-template-columns:1fr}
.opts.pics{grid-template-columns:repeat(3,1fr)}
.pic-opt{padding:8px}.pic-opt svg{display:block;width:100%;height:auto}
.reading{font-family:'Andika',sans-serif;font-weight:700;font-size:clamp(46px,14vw,64px);background:var(--isl-soft);border-radius:22px;padding:8px 28px;letter-spacing:.02em}
.track{position:relative;height:64px;margin:16px 0 4px}
.track-line{position:absolute;left:0;right:0;bottom:8px;height:10px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 22px)}
.track-flag{position:absolute;right:-4px;bottom:14px}
.runner{position:absolute;bottom:10px;width:44px;transition:left .25s ease}
.r-time{text-align:center;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.r-card{display:grid;place-items:center;gap:6px;min-height:210px;margin-top:10px;border-radius:26px;background:var(--isl-soft);text-align:center;padding:16px}
.r-card.pop{animation:pop .25s}
.r-syl{font-family:'Andika',sans-serif;font-weight:700;font-size:96px;line-height:1}
.r-n{font-weight:700;color:var(--muted);font-size:14px}
.r-count{font-weight:800;font-size:90px;color:var(--isl)}
.r-hint{font-weight:600;font-size:17px;color:var(--ink);max-width:280px;line-height:1.4}
.r-done b{display:block;font-size:24px;margin-top:6px}.r-done span{display:block;color:var(--muted);font-weight:600;margin-top:4px}
.st-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.st-dots{margin:10px 0 0}
.st-art{display:flex;justify-content:center;gap:6px;background:var(--isl-soft);border-radius:26px;padding:16px;margin-top:14px;min-height:170px;align-items:center}
.st-pic{width:46%;max-width:170px;height:auto}
.st-text{text-align:center;margin:18px 0 6px;line-height:1.5}
.wd{border:0;background:transparent;padding:2px 4px;border-radius:10px;font-family:'Andika',sans-serif;font-weight:700;font-size:clamp(28px,8.5vw,36px);transition:background .15s,color .15s}
.wd.hl{background:var(--isl);color:#fff}
.st-end{font-weight:800;font-size:24px}
.st-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st-nav button:disabled{opacity:.35}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main class="app"><div class="panel">

<section id="s-map">
  <div class="brand"><span class="wordmark">MOVA<small>Centro Pedagógico</small></span></div>
  <p class="kicker" style="margin:14px 0 0">Lectoescritura</p>
  <h1>Aprende a leer con Mochi</h1>
  <p class="lead">Visita cada isla, gana estrellas y abre la siguiente.</p>
  <div class="map" id="map"></div>
  <div class="map-msg" id="map-msg" hidden></div>
  <button class="teacher" id="teacher">Modo maestra</button>
</section>

<section id="s-isle" hidden>
  <button class="back" id="isle-back">← Mapa</button>
  <div class="isle-hero">
    <div><p class="kicker">Bloque</p><div class="isle-letter" id="isle-letter"></div><h1 id="isle-title" style="font-size:24px;margin-top:6px"></h1></div>
    <div id="isle-mochi"></div>
  </div>
  <p class="label">Actividades</p>
  <div class="acts" id="acts"></div>
  <p class="label">Toca y escucha las sílabas</p>
  <div class="syls" id="isle-syl"></div>
  <p class="label">Palabras de esta isla</p>
  <div class="words" id="isle-words"></div>
</section>

<section id="s-game" hidden>
  <div class="hud">
    <button class="icon" id="g-home" aria-label="Volver al mapa"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="#1E3A5F" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <div class="hud-mid"><b id="g-isle"></b><div class="bar" id="g-bar"></div></div>
    <span class="stars" id="g-stars"></span>
  </div>
  <div class="stage"><div id="g-mochi"></div><div class="bubble" id="bubble" aria-live="polite"></div></div>
  <div class="task" id="task"></div>
  <div class="opts" id="opts"></div>
  <div class="tools" id="tools"></div>
</section>

<section id="s-end" hidden>
  <div id="e-mochi" style="width:170px;margin:0 auto"></div>
  <p class="end-title" id="e-title"></p>
  <p class="end-sub" id="e-sub"></p>
  <div class="end-stars" id="e-stars"></div>
  <p class="end-count" id="e-count"></p>
  <button class="primary" id="e-next" hidden>Ir a la siguiente isla</button>
  <button class="primary" id="e-again">Jugar otra vez</button>
  <button class="ghost" id="e-isle">Volver a la isla</button>
  <button class="ghost" id="e-map">Volver al mapa</button>
</section>

<section id="s-race" hidden>
  <button class="back" id="r-back">← Isla</button>
  <p class="kicker" style="margin:14px 0 0" id="r-isle"></p>
  <h1 style="font-size:28px">Carrera de sílabas</h1>
  <div class="track"><div class="track-line"></div><div class="track-flag"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 21V4" stroke="#1E3A5F" stroke-width="2" stroke-linecap="round"/><path d="M5 4h13l-3 4 3 4H5" fill="#E8846B" stroke="#1E3A5F" stroke-width="1.6" stroke-linejoin="round"/></svg></div><img id="r-runner" class="runner" src="mochi-salta.webp" alt=""></div>
  <div class="r-time" id="r-time">0.0 s</div>
  <div class="r-card" id="r-card"></div>
  <p class="best" id="r-rec"></p>
  <button class="primary" id="r-go">¡En sus marcas!</button>
  <button class="primary" id="r-ok" hidden>¡La leí!</button>
  <button class="ghost" id="r-help" hidden>Escuchar</button>
  <div id="r-res" hidden><button class="primary" id="r-again">Correr otra vez</button></div>
</section>

<section id="s-story" hidden>
  <button class="back" id="st-back">← Isla</button>
  <div class="st-head"><div><p class="kicker" style="margin:12px 0 0">Cuento de la isla</p><h1 id="st-title" style="font-size:28px"></h1></div><div id="st-mochi" style="width:78px"></div></div>
  <div class="bar st-dots" id="st-dots"></div>
  <div class="st-art" id="st-art"></div>
  <div class="st-text" id="st-text"></div>
  <button class="primary" id="st-read">Mochi lee</button>
  <div class="st-nav"><button class="ghost" id="st-prev">← Anterior</button><button class="ghost" id="st-next">Siguiente →</button></div>
</section>

</div></main>
<script>
const N="#1E3A5F",K=`stroke="${N}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`,k=`stroke="${N}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"`;
const SH=`<ellipse cx="60" cy="106" rx="36" ry="5" fill="${N}" opacity=".1"/>`;
const eye=(x,y,r=2.6)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${N}"/><circle cx="${x+.9}" cy="${y-.9}" r="${r*.35}" fill="#fff"/>`;
const cheek=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="4" ry="2.6" fill="#F2A08A" opacity=".75"/>`;
const ART={
mapa:`${SH}<path d="M14 30 L44 22 L76 30 L106 22 V90 L76 98 L44 90 L14 98Z" fill="#F4E1C1" ${K}/><path d="M44 22V90M76 30V98" ${k}/><path d="M14 30 L44 22 V90 L14 98Z" fill="#EAD2A8"/><path d="M76 30 L106 22 V90 L76 98Z" fill="#EAD2A8"/><path d="M14 30 L44 22 L76 30 L106 22 V90 L76 98 L44 90 L14 98Z" fill="none" ${K}/><path d="M24 76 Q38 58 54 68 T86 48" stroke="#E8846B" stroke-width="3" stroke-dasharray="5 5" fill="none"/><path d="M82 52l10 10M92 52l-10 10" stroke="#E8846B" stroke-width="3.5" stroke-linecap="round"/><path d="M26 44q6-6 12 0" stroke="#7FB89E" stroke-width="4" fill="none" stroke-linecap="round"/>`,

const synth=("speechSynthesis" in window)?speechSynthesis:null;let voice=null;
function pv(){if(!synth)return;const vs=synth.getVoices();voice=vs.find(v=>/es[-_]MX/i.test(v.lang))||vs.find(v=>/es[-_](US|419)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;}
if(synth){pv();synth.onvoiceschanged=pv;}
function speak(t,r){if(!synth)return;try{synth.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="es-MX";u.rate=r||.8;u.pitch=1.12;if(voice)u.voice=voice;synth.speak(u);}catch(e){}}
let ac=null;function unlock(){try{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}if(ac&&ac.state==="suspended")ac.resume();}catch(e){}}
function tones(f,step,type,vol){if(!ac)return;const t0=ac.currentTime;f.forEach((fr,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=fr;const s=t0+i*step;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol||.15,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+step+.12);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+step+.15);});}
const chime=()=>tones([660,880,1175],.09,"triangle"),boop=()=>tones([330,250],.12,"sine",.1),tap=()=>tones([520],.05,"sine",.07),fan=()=>tones([523,659,784,1047],.13,"triangle");
function drum(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(60,t+.25);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.32);}

/* ---------- Preguntas ---------- */
function wordPool(i){const cur=ISLANDS[i].words;const prev=i?ISLANDS.slice(0,i).flatMap(x=>x.words):[];return shuffle(cur).concat(shuffle(prev).slice(0,3));}
function makeQs(i){
 const I=ISLANDS[i],types=shuffle(["listen","listen","listen","build","build","build","complete","complete","count","count"]);
 const pool=wordPool(i);let wi=0;const nextW=()=>pool[(wi++)%pool.length];
 return types.map(t=>{
  if(t==="listen"){const s=pick(I.syl);let o=shuffle(I.syl.filter(x=>x!==s)).slice(0,3);if(i>0&&Math.random()<.5){const pv=ISLANDS[Math.floor(Math.random()*i)].v;o[2]=s.slice(0,-1)+pv;}return{t,ans:s,opts:shuffle([s,...o]),say:s};}
  const [w,parts]=nextW();
  if(t==="build"){const extra=pick(I.syl.filter(x=>!parts.includes(x)));return{t,w,parts,tiles:shuffle([...parts,extra])};}
  if(t==="complete"){const k=Math.floor(Math.random()*parts.length),ans=parts[k];const o=shuffle(I.syl.filter(x=>x!==ans&&!parts.includes(x))).slice(0,2);return{t,w,parts,k,ans,opts:shuffle([ans,...o])};}
  return{t:"count",w,parts,ans:parts.length};
 });
}

let mG=null;
function start(mode){if(typeof mode==="string")st.mode=mode;st.total=st.mode==="isla"?ROUNDS:8;unlock();clr();st.round=0;st.stars=0;st.qs=st.mode==="isla"?makeQs(st.isl):st.mode==="pseudo"?makePseudo(st.isl):makeReadpic(st.isl);$("#g-isle").textContent=ISLANDS[st.isl].name+" · "+ACT_NAME[st.mode];mG=mochi($("#g-mochi"),"hola");show("game");next();}
function bar(){$("#g-bar").innerHTML=Array.from({length:st.total},(_,i)=>`<i class="${i<st.round-1?"done":i===st.round-1?"now":""}"></i>`).join("");$("#g-stars").textContent=`★ ${st.stars}`;}
function say(t){$("#bubble").textContent=t;}
function next(){
 if(st.round>=st.total)return end();
 st.round++;st.first=true;st.lock=false;st.built=[];st.taps=0;bar();
 const q=st.qs[st.round-1];st.q=q;const task=$("#task"),opts=$("#opts"),tools=$("#tools");
 task.innerHTML="";opts.innerHTML="";tools.innerHTML="";opts.className="opts";
 if(q.t==="listen"){
  say("Escucha y toca la sílaba que dice Mochi.");
  task.innerHTML=`<button class="listen" id="hear"><span class="ic"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 9h4l5-4v14l-5-4H4z" fill="${N}"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="${N}" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span><span>Escuchar</span></button>`;
  $("#hear").addEventListener("click",()=>speak(q.say,.7));later(()=>speak(q.say,.7),450);
  q.opts.forEach(o=>addOpt(o,()=>choose(o,q.ans)));
 } else if(q.t==="build"){
  say("Arma la palabra con las sílabas.");
  task.innerHTML=`<button class="pic-btn" id="pw">${pic(q.w)}</button><div class="slots" id="slots">${q.parts.map(()=>`<div class="slot"></div>`).join("")}</div>`;
  $("#pw").addEventListener("click",()=>speak(q.w));later(()=>speak(q.w),450);
  opts.className="opts tiles";q.tiles.forEach((s,ix)=>addOpt(s,b=>place(b),ix));
  tool("Escuchar",()=>speak(q.w));tool("Borrar",undo);
 } else if(q.t==="complete"){
  say("¿Qué sílaba falta?");
  task.innerHTML=`<button class="pic-btn" id="pw">${pic(q.w)}</button><div class="slots">${q.parts.map((p,ix)=>`<div class="slot ${ix===q.k?"gap":"filled"}">${ix===q.k?"?":p}</div>`).join("")}</div>`;
  $("#pw").addEventListener("click",()=>speak(q.w));later(()=>speak(q.w),450);
  q.opts.forEach(o=>addOpt(o,()=>choose(o,q.ans,()=>{const g=task.querySelector(".gap");g.textContent=q.ans;g.classList.remove("gap");g.classList.add("filled");})));
  tool("Escuchar",()=>speak(q.w));
 } else if(q.t==="pseudo"){
  say("En mi planeta, este amigo tiene un nombre raro. Escucha y elige cómo se escribe.");
  task.innerHTML=`<div class="alien-wrap"><svg viewBox="0 0 120 112" class="pic" aria-hidden="true">${alien(q.w)}</svg></div><button class="listen" id="hear"><span class="ic">${SPK}</span><span>Escuchar</span></button>`;
  $("#hear").addEventListener("click",()=>speak(q.w,.7));later(()=>speak(q.w,.7),1600);
  opts.className="opts one";q.opts.forEach(o=>addOpt(o,()=>choose(o,q.w)));
 } else if(q.t==="readpic"){
  say("Lee la palabra y toca su dibujo.");
  task.innerHTML=`<div class="reading">${q.w}</div>`;
  opts.className="opts pics";q.opts.forEach(o=>{const b=document.createElement("button");b.className="opt pic-opt";b.dataset.t=o;b.innerHTML=pic(o);b.setAttribute("aria-label","Dibujo");b.addEventListener("click",()=>choose(o,q.w));opts.appendChild(b);});
  tool("Ayuda: escuchar",()=>{st.first=false;speak(q.w,.75);});
 } else {
  say("¿Cuántas sílabas tiene? Toca el tambor una vez por cada sílaba.");
  task.innerHTML=`<button class="pic-btn" id="pw">${pic(q.w)}</button><div class="beats" id="beats"></div><button class="drum" id="drum" aria-label="Tambor">${DRUM}</button>`;
  $("#pw").addEventListener("click",()=>speak(q.w,.75));later(()=>speak(q.w,.75),450);
  $("#drum").addEventListener("click",()=>{if(st.lock)return;unlock();drum();st.taps=Math.min(st.taps+1,5);const d=$("#drum");d.classList.remove("hit");void d.offsetWidth;d.classList.add("hit");beats();});
  beats();
  const ok=document.createElement("button");ok.className="go";ok.textContent="Listo";ok.addEventListener("click",checkCount);opts.appendChild(ok);
  tool("Escuchar",()=>speak(q.w,.75));tool("Borrar",()=>{st.taps=0;beats();});
 }
}
function beats(){$("#beats").innerHTML=Array.from({length:Math.max(st.taps,1)},(_,i)=>`<i class="${i<st.taps?"on":""}"></i>`).join("");}
function addOpt(t,fn,ix){const b=document.createElement("button");b.className="opt";b.textContent=t;b.dataset.t=t;b.addEventListener("click",()=>fn(b));$("#opts").appendChild(b);}
function tool(t,fn){const b=document.createElement("button");b.textContent=t;b.addEventListener("click",fn);$("#tools").appendChild(b);}
function choose(t,ans,after){
 if(st.lock)return;if(st.q.t!=="readpic")speak(t,.7);const b=[...document.querySelectorAll("#opts .opt")].find(x=>x.dataset.t===t);
 if(st.q.t==="readpic")speak(ans,.8);
 if(t===ans){b.classList.add("right");if(after)after();win();}
 else{st.first=false;b.classList.add("wrong");boop();react(mG,false);say(pick(RETRY));later(()=>b.classList.remove("wrong"),450);}
}
function place(b){
 const q=st.q;if(st.lock||b.classList.contains("used")||st.built.length>=q.parts.length)return;
 tap();speak(b.dataset.t,.7);st.built.push(b);b.classList.add("used");
 const sl=$("#slots").children[st.built.length-1];sl.textContent=b.dataset.t;sl.classList.add("filled");
 if(st.built.length===q.parts.length){
  if(st.built.every((x,i)=>x.dataset.t===q.parts[i]))win();
  else{st.first=false;st.lock=true;boop();react(mG,false);say(pick(RETRY));[...$("#slots").children].forEach(s=>s.classList.add("bad"));
   later(()=>{[...$("#slots").children].forEach(s=>{s.textContent="";s.className="slot";});st.built.forEach(x=>x.classList.remove("used"));st.built=[];st.lock=false;},1000);}
 }
}
function undo(){if(st.lock||!st.built.length)return;const b=st.built.pop();b.classList.remove("used");const s=$("#slots").children[st.built.length];s.textContent="";s.className="slot";}
function checkCount(){
 const q=st.q;if(st.lock)return;
 if(!st.taps){say("Toca el tambor primero.");return;}
 if(st.taps===q.ans){$("#task .pic-btn").insertAdjacentHTML("afterend",`<div class="split">${q.parts.join(" · ")}</div>`);win();}
 else{st.first=false;boop();react(mG,false);say(`Casi. Escucha: ${q.parts.join(", ")}.`);speak(q.parts.join(", "),.6);st.taps=0;later(beats,500);}
}
const PRAISE=["¡Muy bien!","¡Excelente!","¡Lo lograste!","¡Qué bien lees!","¡Bravo!","¡Perfecto!"];
const RETRY=["¡Casi! Inténtalo otra vez.","Escucha bien y vuelve a intentarlo.","Tú puedes, prueba de nuevo."];
function win(){
 st.lock=true;chime();react(mG,true);if(st.first){st.stars++;}bar();
 const q=st.q,p=pick(PRAISE);
 if(q.t==="listen"){say(p);later(()=>speak(p),300);}
 else if(q.t==="pseudo"){say(`${p} Se llama ${q.w}.`);later(()=>speak(`${p} Se llama ${q.w}`),300);}
 else if(q.t==="readpic"){say(`${p} ${q.w}`);}
 else if(q.t==="count"){say(`${p} ${q.w} tiene ${q.ans} sílaba${q.ans>1?"s":""}.`);later(()=>speak(`${p} ${q.parts.join(", ")}. ${q.ans}`),300);}
 else{[...document.querySelectorAll("#slots .slot, .slots .slot")].forEach(s=>s.classList.add("good"));say(`${p} ${q.w}`);later(()=>speak(`${p} ${q.w}`),300);}
 if(st.first&&st.stars%5===0)confetti(50);

const cv=$("#fx"),cx=cv.getContext("2d");const red=matchMedia("(prefers-reduced-motion: reduce)").matches;let parts=[],raf=0;
function sz(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);}sz();addEventListener("resize",sz);
function confetti(n){if(red)return;const cols=["#E8846B","#E0B04A","#7FB89E","#6FA8D6","#9B7BEA"];for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+5,c:cols[i%5],rot:Math.random()*6,vr:(Math.random()-.5)*.3,l:0,s:Math.random()<.5});if(!raf)raf=requestAnimationFrame(fx);}
function fx(){cx.clearRect(0,0,innerWidth,innerHeight);parts.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.l++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;if(p.s){cx.beginPath();for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?p.r*.45:p.r;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}cx.closePath();cx.fill();}else{cx.beginPath();cx.arc(0,0,p.r/1.7,0,7);cx.fill();}cx.restore();});parts=parts.filter(p=>p.y<innerHeight+30&&p.l<240);if(parts.length)raf=requestAnimationFrame(fx);else{raf=0;cx.clearRect(0,0,innerWidth,innerHeight);}}

const SPK=`<svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 9h4l5-4v14l-5-4H4z" fill="${N}"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="${N}" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;

function seedRnd(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}
function alien(w){
 const r=seedRnd(w),cols=["#9B7BEA","#7FB89E","#F29A5A","#6FA8D6","#F2A08A","#E0B04A","#5FC7C1"],c=cols[Math.floor(r()*cols.length)];
 const pts=[];const n=9,cx=60,cy=62;for(let i=0;i<n;i++){const a=i/n*Math.PI*2-Math.PI/2,rad=30+r()*12;pts.push([cx+Math.cos(a)*rad*1.08,cy+Math.sin(a)*rad*.92]);}
 let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;d+=` Q${p[0]} ${p[1]} ${mx} ${my}`;}d+=" Z";
 const eyes=1+Math.floor(r()*3),ant=Math.floor(r()*3),spots=r()<.6;
 let s=`<ellipse cx="60" cy="106" rx="34" ry="5" fill="${N}" opacity=".1"/>`;
 for(let i=0;i<ant;i++){const x=ant===1?60:48+i*24;s+=`<path d="M${x} 34 Q${x+(i?8:-8)} 18 ${x+(i?4:-4)} 10" ${K} fill="none"/><circle cx="${x+(i?4:-4)}" cy="9" r="5" fill="#F2C94C" ${k}/>`;}
 s+=`<path d="M44 92 v12 M76 92 v12" stroke="${N}" stroke-width="7" stroke-linecap="round"/><path d="${d}" fill="${c}" ${K}/>`;
 if(spots)s+=[[42,78,5],[80,74,4],[72,90,3]].map(([x,y,rr])=>`<circle cx="${x}" cy="${y}" r="${rr}" fill="#FFFFFF" opacity=".35"/>`).join("");
 const ex=eyes===1?[60]:eyes===2?[49,71]:[44,60,76];ex.forEach(x=>{s+=`<circle cx="${x}" cy="56" r="${eyes===1?11:8}" fill="#fff" ${k}/><circle cx="${x+1}" cy="57" r="${eyes===1?5:3.6}" fill="${N}"/><circle cx="${x+2.4}" cy="55" r="1.4" fill="#fff"/>`;});
 s+=`<path d="M50 74 Q60 82 70 74" ${K} fill="none"/><ellipse cx="40" cy="70" rx="4.5" ry="3" fill="#F2A08A" opacity=".8"/><ellipse cx="80" cy="70" rx="4.5" ry="3" fill="#F2A08A" opacity=".8"/>`;
 return s;
}
const REAL=new Set(ISLANDS.flatMap(I=>I.words.map(w=>w[0].normalize("NFD").replace(/[\u0300-\u036f]/g,""))).concat(["papa","mama","nana","cara","pala","sala","rama","bala","dama","lana","tapa","pata","masa","pasa","casa","lata","taza","rata","nada","sapa","pera","mesa","pelo","dedo","bebe","nene","mira","mimi","pila","lima","tina","sopa","mono","moto","loro","toro","todo","lobo","bota","boca","coco","luna","cuna","mula","duna","puma","tuna","nube","rosa","solo","sola","pepe","lili","lulu","nota","dado","peso","piso","paso","beso","mapa","cama","foca","pato","gato","oso","uva"]));
function makePseudo(i){
 const pool=ISLANDS[i].syl.concat(i?shuffle(ISLANDS.slice(0,i).flatMap(I=>I.syl)).slice(0,6):[]);
 const out=[],used=new Set();let guard=0;
 while(out.length<8&&guard++<400){
  const a=pick(pool),b=pick(ISLANDS[i].syl),w=a+b;if(a===b||REAL.has(w)||used.has(w))continue;
  const sw=(x)=>{const v=x.slice(-1);const alt=shuffle(CONS.map(c=>c+v)).find(z=>z!==x);return alt;};
  const o1=sw(a)+b,o2=a+sw(b);if(o1===w||o2===w||o1===o2)continue;
  used.add(w);out.push({t:"pseudo",w,opts:shuffle([w,o1,o2])});
 }
 return out;
}
function makeReadpic(i){
 const learned=ISLANDS.slice(0,i+1).flatMap(I=>I.words.map(w=>w[0]));
 const targets=shuffle(ISLANDS[i].words.map(w=>w[0])).concat(shuffle(learned)).filter((w,ix,a)=>a.indexOf(w)===ix).slice(0,8);

}

const RACE_N=20;const R={list:[],ix:0,t0:0,tm:0,on:false};
function raceIntro(){
 clr();R.on=false;$("#r-isle").textContent=ISLANDS[st.isl].name;
 const rec=(P.race||{})[st.isl];
 $("#r-card").innerHTML=`<span class="r-hint">Lee cada sílaba en voz alta y toca <b>¡La leí!</b></span>`;

 $("#r-time").textContent="0.0 s";$("#r-go").hidden=false;$("#r-ok").hidden=true;$("#r-help").hidden=true;$("#r-res").hidden=true;
 runner(0);show("race");speak("Carrera de sílabas. Lee cada sílaba en voz alta lo más rápido que puedas.");

function runner(f){$("#r-runner").style.left=`calc(${f*100}% - ${f*44}px)`;}
function raceStart(){
 const I=ISLANDS[st.isl],prev=st.isl?ISLANDS.slice(0,st.isl).flatMap(x=>x.syl):[];
 R.list=[];while(R.list.length<RACE_N){const s=Math.random()<(st.isl?.7:1)?pick(I.syl):pick(prev);if(s!==R.list[R.list.length-1])R.list.push(s);}
 R.ix=0;$("#r-go").hidden=true;$("#r-res").hidden=true;let c=3;
 const cd=()=>{if(c>0){$("#r-card").innerHTML=`<span class="r-count">${c}</span>`;tones([440],.12,"sine",.12);c--;later(cd,700);}else{tones([880],.2,"triangle",.15);R.t0=performance.now();R.on=true;$("#r-ok").hidden=false;$("#r-help").hidden=false;showSyl();tick();}};cd();

 mochi($("#r-mochi"),best?"salta":"hola");$("#r-rec").textContent=`Tu récord: ${P.race[st.isl]} segundos`;$("#r-res").hidden=false;fan();if(best)confetti(140);

 if(SS.reading)return;SS.reading=true;const ws=[...document.querySelectorAll("#st-text .wd")];let j=0;
