<!DOCTYPE html>
<html lang="es">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mova-theme")==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retos multijugador · MOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#1B2A55;--card:#FFFFFF;--ink:#1B2A55;--muted:#5E6886;--track:#EEF1F8;--edge:#DCE3F0;
  --coral:#FF8A6B;--sky:#5BC0F0;--gold:#FCE38A;--mint:#4FD1A5;--pink:#FF8FB1;--lila:#B98CFF;--ok:#2FB57E;--bad:#E5484D;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0E1430;--card:#1E2747;--ink:#F4F0E6;--muted:#B3BBD6;--track:#29335c;--edge:#36426d;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0E1430;--card:#1E2747;--ink:#F4F0E6;--muted:#B3BBD6;--track:#29335c;--edge:#36426d;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font-family:'Poppins','Century Gothic','Avenir Next','Segoe UI',system-ui,sans-serif;
  background-color:var(--page);
  background-image:radial-gradient(circle,#FF8FB1 6px,transparent 7px),radial-gradient(circle,#5BC0F0 6px,transparent 7px),radial-gradient(circle,#FCE38A 6px,transparent 7px),radial-gradient(circle,#4FD1A5 6px,transparent 7px),radial-gradient(circle,#B98CFF 5px,transparent 6px);
  background-size:150px 150px;background-position:0 0,75px 38px,38px 95px,112px 128px,120px 70px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.5;cursor:default}
[hidden]{display:none!important}
.app{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:16px 12px 28px}
@media (min-height:760px){.app{align-items:center}}
.panel{width:100%;max-width:580px;background:var(--card);border-radius:30px;padding:20px 16px 24px;box-shadow:0 10px 0 var(--coral),0 28px 60px rgba(0,0,0,.35);position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.brand{display:flex;flex-direction:column;align-items:center;width:max-content;margin:0 auto;padding:8px 18px 6px;border:3px solid var(--ink);border-radius:18px;line-height:1}
.brand .wordmark{font-weight:800;font-size:26px;letter-spacing:.06em}
.brand .tag{font-weight:600;font-size:10px;letter-spacing:.04em;color:var(--muted);margin-top:4px}
.brand.sm{margin:0;padding:5px 10px 4px;border-width:2px;border-radius:12px}
.brand.sm .wordmark{font-size:15px}.brand.sm .tag{display:none}
.icon-btn{border:0;background:var(--track);border-radius:14px;width:44px;height:44px;display:grid;place-items:center;flex:none;text-decoration:none;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.spacer{width:44px;flex:none}
h1{font-weight:800;font-size:clamp(30px,9vw,42px);line-height:1.05;text-align:center;margin:14px 0 6px}
h2{font-weight:800;font-size:22px;text-align:center;margin:12px 0 4px}
.lead{text-align:center;color:var(--muted);font-weight:500;font-size:15px;line-height:1.5;margin:0 0 6px}
.label{font-weight:700;font-size:15px;margin:18px 0 8px}
.ribbon{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.chip{border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;color:#1B2A55;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:14px;height:14px}
.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:20px;border:0;border-radius:999px;background:var(--gold);color:#1B2A55;font-weight:800;font-size:20px;padding:15px;box-shadow:0 6px 0 #E3C462}
.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #E3C462}
.primary svg{width:22px;height:22px}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;border:3px solid var(--ink);background:transparent;border-radius:999px;font-weight:700;font-size:16.5px;padding:12px;text-decoration:none;color:var(--ink)}
.link{display:block;margin:14px auto 0;border:0;background:none;font-weight:600;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.choices{display:grid;gap:10px}
.choices.c2{grid-template-columns:1fr 1fr}.choices.c3{grid-template-columns:repeat(3,1fr)}.choices.c4{grid-template-columns:repeat(4,1fr)}.choices.c6{grid-template-columns:repeat(6,1fr);gap:6px}.choices.c6 .choice{padding:11px 2px}
.choice{border:2px solid var(--edge);background:var(--card);border-radius:16px;padding:11px 8px;font-weight:700;font-size:14px;line-height:1.25}
.choice small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:2px}
.choice[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.choice[aria-pressed="true"] small{color:inherit;opacity:.8}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:260px;overflow:auto;padding:2px}
.topics .choice{text-align:left;padding:10px 12px}
/* Inicio */
.hero{display:grid;gap:12px;margin-top:18px}
.big-opt{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:22px;padding:16px;background:var(--c);color:#1B2A55;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.big-opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.big-opt .ic{width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;flex:none}
.big-opt .ic svg{width:28px;height:28px;color:#1B2A55}
.big-opt b{display:block;font-size:19px;font-weight:800}
.big-opt span{font-size:13.5px;font-weight:600;opacity:.85}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{border:3px solid transparent;background:var(--track);border-radius:20px;padding:0;overflow:hidden;text-align:left}
.game img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--edge)}
.game div{padding:9px 11px 11px}
.game b{display:block;font-size:14.5px;font-weight:800;line-height:1.2}
.game small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.game{position:relative}.game .new{position:absolute;top:8px;left:8px;background:#fff;color:#1B2A55;border-radius:999px;padding:3px 9px;font-weight:800;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.opts.pics .opt{padding:8px;min-height:0;aspect-ratio:1;display:grid;place-items:center}.opts.pics .opt svg{width:78%;height:78%}
.opts.pics .opt.ok svg,.opts.pics .opt.bad svg{filter:drop-shadow(0 0 0 #fff)}
.prompt .listen{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:var(--ink);color:var(--card);font-weight:800;font-size:18px;padding:14px 22px;margin:4px 0}
.prompt .listen svg{width:24px;height:24px}
.prompt .def{font-weight:700;font-size:clamp(17px,4.8vw,20px);line-height:1.45}
.qbar{height:6px;border-radius:999px;background:var(--edge);overflow:hidden;margin:-4px 0 10px}.qbar i{display:block;height:100%;background:var(--lila);transform-origin:left}
.boxes{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:12px}
.boxes span{width:clamp(26px,7.4vw,38px);height:clamp(36px,9.5vw,46px);border-radius:10px;border:3px solid var(--edge);display:grid;place-items:center;font-weight:800;font-size:clamp(17px,5vw,22px);background:var(--card)}
.boxes span.f{border-color:var(--ink)}.boxes.ok span{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.boxes.bad{animation:shk .35s}.boxes.bad span{border-color:var(--bad)}
.sb .tile{background:#FCE38A;box-shadow:0 4px 0 #E3C462}.sb .tile:active{box-shadow:0 1px 0 #E3C462}
.sb .bee{width:96px;margin:-4px auto 6px;animation:hover 2.4s ease-in-out infinite}@keyframes hover{50%{transform:translateY(-5px) rotate(-3deg)}}
.sp-tools{display:flex;justify-content:center;gap:10px;margin-top:12px}.sp-tools button{border:0;background:var(--track);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}.sp-tools svg{width:18px;height:18px}
.game[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.codebox{display:flex;justify-content:center;gap:10px;margin:18px 0 6px}
.codebox input{width:62px;height:74px;border:3px solid var(--edge);border-radius:18px;text-align:center;font:800 34px/1 Poppins,system-ui,sans-serif;color:var(--ink);background:var(--card)}
.codebox input:focus{border-color:var(--ink);outline:none}
.err{min-height:22px;text-align:center;color:var(--bad);font-weight:600;font-size:14px;margin:6px 0 0}
/* Sala */
.code-card{margin:14px auto 4px;max-width:330px;border-radius:24px;background:var(--page);color:#fff;text-align:center;padding:14px 12px 16px;position:relative;overflow:hidden}
.code-card small{display:block;font-weight:700;font-size:12px;letter-spacing:.12em;opacity:.8}
.code-card .code{font-weight:800;font-size:58px;letter-spacing:.18em;line-height:1.1;margin-left:.18em}
.code-card .gm{display:inline-block;margin-top:4px;background:#fff;color:#1B2A55;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.plist{display:grid;gap:8px;margin-top:14px}
.prow{display:flex;align-items:center;gap:10px;background:var(--track);border-radius:16px;padding:8px 12px;font-weight:700;font-size:15px}
.prow.me{outline:3px solid var(--ink)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#1B2A55;flex:none}
.prow .tag{margin-left:auto;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--card);color:var(--muted)}
.prow .sc{margin-left:auto;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.prow.off{opacity:.55}
.wait{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;color:var(--muted);font-weight:600;font-size:14.5px;text-align:center}
.dots3{display:inline-flex;gap:4px}.dots3 i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:bl 1.2s infinite}
.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.settings{margin-top:6px;border-top:2px dashed var(--edge);padding-top:4px}
/* Cuenta regresiva */
.count{display:grid;place-items:center;min-height:360px;text-align:center}
.count .num{margin:0 auto;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:96px;color:#1B2A55;background:var(--coral);box-shadow:0 8px 0 rgba(0,0,0,.15);animation:pulse 1s ease-in-out infinite}
.count p{font-weight:700;font-size:17px;color:var(--muted);margin:18px 0 0}
@keyframes pulse{0%{transform:scale(.86)}30%{transform:scale(1.04)}100%{transform:scale(1)}}
/* Juego */
.hud{display:flex;align-items:center;gap:8px}
.pill{background:var(--track);border-radius:999px;padding:8px 12px;font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.pill svg{width:16px;height:16px}
.hud .grow{flex:1;min-width:0}
.tbar{height:10px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:10px}
.tbar i{display:block;height:100%;width:100%;background:var(--mint);border-radius:999px;transform-origin:left;transition:background .3s}
.tbar.low i{background:var(--bad)}
.live{display:flex;gap:6px;overflow-x:auto;margin:10px -4px 0;padding:2px 4px 4px;scrollbar-width:none}
.live::-webkit-scrollbar{display:none}
.lchip{flex:none;display:flex;align-items:center;gap:6px;background:var(--track);border-radius:999px;padding:4px 10px 4px 4px;font-weight:700;font-size:12.5px;transition:transform .3s}
.lchip .av{width:24px;height:24px;font-size:10px}
.lchip.me{background:var(--ink);color:var(--card)}
.lchip b{font-variant-numeric:tabular-nums}
.lchip .ck{width:14px;height:14px;color:var(--ok)}
.live{padding-top:12px;margin-top:2px}
.lchip{position:relative;padding-bottom:7px}
.lchip .pg{font-size:11px;font-weight:800;opacity:.62;font-variant-numeric:tabular-nums}
.lchip .pb{position:absolute;left:32px;right:10px;bottom:3px;height:3px;border-radius:3px;background:rgba(27,42,85,.12);overflow:hidden}
.lchip.me .pb{background:rgba(255,255,255,.2)}
.lchip .pb i{display:block;height:100%;border-radius:3px;background:#7FC8A9;transition:width .5s ease}
.lchip.bump{animation:lbump .55s ease}
@keyframes lbump{0%{transform:scale(1)}35%{transform:scale(1.13)}100%{transform:scale(1)}}
.lchip .plus{position:absolute;right:-2px;top:-11px;background:#FCE38A;color:#1B2A55;font-weight:800;font-size:11.5px;border-radius:999px;padding:1px 7px;box-shadow:0 2px 0 #E3C462;animation:lplus 1.1s ease forwards;pointer-events:none}
@keyframes lplus{0%{opacity:0;transform:translateY(8px) scale(.7)}20%{opacity:1;transform:translateY(0) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.lchip.bump,.lchip .plus{animation:none}}
.opts.clocks .opt svg{width:88%;height:88%}
.bwrap{position:relative}
.bcall{background:var(--ink);color:#fff;border-radius:22px;padding:14px 14px 12px;text-align:center;margin-top:10px;position:relative;
  background-image:radial-gradient(circle,#F7A8C4 3px,transparent 4px),radial-gradient(circle,#FCE38A 3px,transparent 4px),radial-gradient(circle,#7FC8A9 3px,transparent 4px);background-size:90px 90px;background-position:8px 10px,50px 60px,80px 24px}
.bcall.fresh .bword{animation:bpop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes bpop{0%{transform:scale(.5);opacity:0}100%{transform:none;opacity:1}}
.bcnt{font-size:12px;font-weight:700;letter-spacing:1px;opacity:.75;text-transform:uppercase}
.bword{font-weight:800;font-size:clamp(30px,9vw,42px);line-height:1.15;margin:4px 0 2px;color:#FCE38A}
.bword.listen-only{display:flex;align-items:center;justify-content:center;gap:10px}.bword svg{width:30px;height:30px}
.bnext{font-weight:800;font-size:22px;padding:14px 0;color:#FCE38A}
.bre{border:0;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-weight:700;font-size:13px;border-radius:999px;padding:6px 14px;display:inline-flex;align-items:center;gap:6px;margin-top:4px}.bre svg{width:16px;height:16px}
.bhist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.bhist span{background:var(--track);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.bcall .bhist span{background:rgba(255,255,255,.14);color:#fff}
.bgrid{display:grid;gap:7px;margin-top:12px}.bgrid.s3{grid-template-columns:repeat(3,minmax(0,1fr))}.bgrid.s4{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.bgrid.s5{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.bgrid.shake{animation:bshake .45s}@keyframes bshake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bcell{position:relative;aspect-ratio:1;min-width:0;border:3px solid var(--edge);background:var(--card);border-radius:16px;box-shadow:0 3px 0 var(--edge);display:grid;place-items:center;padding:4px;font:inherit;color:var(--ink);cursor:pointer;overflow:hidden}
.bgrid.s5 .bcell{border-radius:12px;border-width:2px}
.bcell.on{border-color:#E3C462;background:#FFF8DC;box-shadow:0 3px 0 #E3C462}
.bcell.free{background:#EEF1F8;border-style:dashed}.bcell.free small{position:absolute;bottom:6%;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.bfree{width:48%;height:48%}
.btx{font-weight:800;font-size:clamp(14px,4.6vw,20px);line-height:1.1;text-align:center;overflow-wrap:break-word;hyphens:auto;max-width:100%}
.btx.num{font-size:clamp(24px,8vw,34px)!important}
.bgrid.s4 .btx{font-size:clamp(12px,3.6vw,16px)}.bgrid.s5 .btx{font-size:clamp(10px,3vw,13px)}
.btx.sm{font-size:clamp(12px,3.8vw,16px)}.bgrid.s4 .btx.sm{font-size:clamp(10px,3vw,13px)}.bgrid.s5 .btx.sm{font-size:clamp(9px,2.5vw,11px)}
.btx.xs{font-size:clamp(10px,3.2vw,13px)}.bgrid.s5 .btx.xs{font-size:clamp(8px,2.2vw,10px)}
.bsw{width:66%;height:66%;border-radius:50%;border:3px solid #1B2A55;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.bshp{width:74%;height:74%}
.bchip{position:absolute;width:44%;height:44%;right:3%;bottom:3%;filter:drop-shadow(0 3px 3px rgba(27,42,85,.25));pointer-events:none}
.bcell.drop .bchip{animation:bdrop .4s cubic-bezier(.2,1.5,.5,1)}@keyframes bdrop{0%{transform:translateY(-40px) scale(1.3);opacity:0}100%{transform:none;opacity:1}}
.bmsg{min-height:22px;text-align:center;font-weight:700;font-size:14px;margin-top:10px;color:var(--muted)}.bmsg.bad{color:var(--bad,#D9534F)}
.bbingo{display:block;width:100%;border:0;border-radius:999px;padding:16px;font:inherit;font-weight:800;font-size:24px;letter-spacing:2px;background:#E8846B;color:#fff;box-shadow:0 5px 0 #C9674F;margin-top:6px}
.bbingo.won{background:#7FC8A9;box-shadow:0 5px 0 #5AA685}
.bhint{text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;margin:10px 0 0}
.bwin{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.55);border-radius:22px;animation:fade .3s}
.bwin-in{background:var(--ink);color:#fff;border-radius:24px;padding:20px 22px;text-align:center;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:bpop .5s cubic-bezier(.2,1.6,.4,1)}
.bwin-in b{display:block;font-size:44px;color:#FCE38A;letter-spacing:3px}.bwin-in span{font-size:14px;opacity:.9}
.bhero span{display:grid;place-items:center;position:relative}.bhero .bchip{position:static;width:72%;height:72%;animation:bdrop .6s cubic-bezier(.2,1.5,.5,1) both}.bhero span:nth-child(2) .bchip{animation-delay:.15s}.bhero span:nth-child(3) .bchip{animation-delay:.3s}.bhero span:nth-child(4) .bchip{animation-delay:.45s}
@keyframes fade{from{opacity:0}}
.pkbadge{display:inline-block;background:#1B2A55;color:#FCE38A;font-weight:800;font-size:12px;letter-spacing:2px;border-radius:999px;padding:5px 12px}
.center{text-align:center}
.pkhero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:14px 0 4px;background:linear-gradient(180deg,#E3F5EA,#C6EBD6);border-radius:22px;padding:14px 10px 8px}
.pkhero span{display:block;aspect-ratio:1}.pkhero svg{width:100%;height:100%}
.pkpark{margin-top:10px;background:linear-gradient(180deg,#E3F5EA,#BFE6CE);border-radius:22px;padding:10px}
.pkland{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.plot{min-width:0;aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.4);display:grid;place-items:center;position:relative}
.plot svg{width:94%;height:94%;display:block}
.plot .ghost{opacity:.16;filter:grayscale(1);width:100%;height:100%;display:grid;place-items:center}
.plot.own{background:rgba(255,255,255,.72)}
.plot.pop{animation:pkpop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pkpop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.pkbar{display:flex;align-items:center;gap:8px;margin-top:9px}
.pkbar .pill{background:#fff;color:#1B2A55}
.pkinc{display:flex;align-items:center;gap:3px;font-weight:700;font-size:12px;color:#1B2A55;opacity:.85}.pkinc svg{width:14px;height:14px}
.pkshop{margin-left:auto;position:relative;border:0;background:#1B2A55;color:#fff;font:inherit;font-weight:800;font-size:14px;border-radius:999px;padding:9px 16px;box-shadow:0 3px 0 #0E1838}

/* Sprinkles de celebración */
var SPR = ["#FF8FB1", "#5BC0F0", "#FCE38A", "#4FD1A5", "#B98CFF", "#FF8A6B", "#FFFFFF"];
function confetti(big) {
  var c = $("#fx"), x = c.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  var W = innerWidth, H = innerHeight; c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  var ps = [], dur = big ? 5200 : 3400;
  function sprinkle(px, py, vx, vy) { return { x: px, y: py, vx: vx, vy: vy, l: 9 + Math.random() * 9, w: 3.6 + Math.random() * 1.6, c: SPR[Math.floor(Math.random() * SPR.length)], a: Math.random() * 6.28, va: (Math.random() - .5) * .25, dot: Math.random() < .18 }; }
  for (var i = 0; i < (big ? 120 : 70); i++) { var ang = -Math.PI / 2 + (Math.random() - .5) * 1.9, sp = 8 + Math.random() * 10; ps.push(sprinkle(W / 2 + (Math.random() - .5) * 60, H * .42, Math.cos(ang) * sp, Math.sin(ang) * sp)); }
  var t0 = performance.now(), rainUntil = t0 + dur - 1400;
  (function f(now) {
    if (now < rainUntil) for (var k = 0; k < (big ? 4 : 2); k++) ps.push(sprinkle(Math.random() * W, -20, (Math.random() - .5) * 1.5, 2 + Math.random() * 3));
    x.clearRect(0, 0, W, H);
    ps = ps.filter(function (p) { return p.y < H + 30; });
    ps.forEach(function (p) {
      p.vy = Math.min(p.vy + .22, 6.5); p.vx *= .985; p.x += p.vx + Math.sin((now / 400) + p.l) * .4; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c;
      if (p.dot) { x.beginPath(); x.arc(0, 0, p.w * .9, 0, 6.29); x.fill(); }
      else { var r = p.w / 2; x.beginPath(); x.moveTo(-p.l / 2 + r, -r); x.lineTo(p.l / 2 - r, -r); x.arc(p.l / 2 - r, 0, r, -Math.PI / 2, Math.PI / 2); x.lineTo(-p.l / 2 + r, r); x.arc(-p.l / 2 + r, 0, r, Math.PI / 2, Math.PI * 1.5); x.fill(); }
      x.restore();
    });
    if (now - t0 < dur + 2500 && ps.length) requestAnimationFrame(f); else x.clearRect(0, 0, W, H);
  })(t0);
}

/* ---------- Question builders ---------- */
function opts4(ans, spread){
  const set = new Set([ans]);
  const cands = shuffle([ans+1, ans-1, ans+2, ans-2, ans+10, ans-10, ans+spread, ans-spread, ans+5, ans-5]);
  for(const c of cands){ if(set.size >= 4) break; if(c >= 0 && c !== ans) set.add(c); }
  while(set.size < 4) set.add(ans + set.size + 3);
  return shuffle([...set]).map(String);
}
function arith(a, op, b, missing){
  const res = op==='+' ? a+b : op==='−' ? a-b : op==='×' ? a*b : a/b;
  if(missing === 'b') return { html:`${fmtN(a)} ${op} <span class="q">?</span> = ${fmtN(res)}`, say:`${a} ${sayOp(op)} qué número da ${res}`, ans:b, explain:`${fmtN(a)} ${op} ${fmtN(b)} = ${fmtN(res)}`, prompt:'¿Qué número falta?' };
  return { html:`${fmtN(a)} ${op} ${fmtN(b)} = <span class="q">?</span>`, say:`¿Cuánto es ${a} ${sayOp(op)} ${b}?`, ans:res, explain:`${fmtN(a)} ${op} ${fmtN(b)} = ${fmtN(res)}`, prompt:'Resuelve' };
}
function sayOp(op){ return {'+':'más','−':'menos','×':'por','÷':'entre'}[op]; }
function compare(max){
  let a = rnd(0,max), b = R()<.15 ? a : rnd(0,max);
  const ans = a > b ? '>' : a < b ? '<' : '=';
  return { html:`${fmtN(a)} <span class="q">?</span> ${fmtN(b)}`, say:`¿Qué signo va entre ${a} y ${b}?`, ans, options:['<','=','>'], explain:`${fmtN(a)} ${ans} ${fmtN(b)}`, prompt:'¿Qué signo va?' };
}
function counting(){
  const items = ['🍎','⭐','🐞','🎈','🍓','🐟','🌸','⚽'];
  const it = pick(items), n = rnd(4,15);
  return { count: it.repeat ? Array(n).fill(it) : [], html:'', say:`¿Cuántos hay?`, ans:n, explain:`Hay ${n}`, prompt:`¿Cuántos ${it} hay?`, countItem:it, n };
}
