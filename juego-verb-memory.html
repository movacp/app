<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verb Memory · MOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#1B2A55;
  --card:#FFFFFF;
  --ink:#1B2A55;
  --muted:#5E6886;
  --track:#EEF1F8;
  --edge:#DCE3F0;
  --pres:#4FD1A5;
  --past:#5BC0F0;
  --part:#FF8FB1;
  --gold:#F2B632;
  --back:#22346A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0E1430; --card:#1E2747; --ink:#F4F0E6; --muted:#B3BBD6; --track:#29335c; --edge:#36426d; --back:#2a3d78;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0E1430; --card:#1E2747; --ink:#F4F0E6; --muted:#B3BBD6; --track:#29335c; --edge:#36426d; --back:#2a3d78;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);
  font-family:'Poppins','Century Gothic','Avenir Next','Segoe UI',system-ui,sans-serif;
  background-color:var(--page);
  background-image:
    radial-gradient(circle, #FF8FB1 6px, transparent 7px),
    radial-gradient(circle, #5BC0F0 6px, transparent 7px),
    radial-gradient(circle, #F2B632 6px, transparent 7px),
    radial-gradient(circle, #4FD1A5 6px, transparent 7px),
    radial-gradient(circle, #B98CFF 5px, transparent 6px);
  background-size:150px 150px;
  background-position:0 0, 75px 38px, 38px 95px, 112px 128px, 120px 70px;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
[hidden]{display:none !important}
.app{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px 12px}
.panel{width:100%;max-width:560px;background:var(--card);border-radius:30px;padding:22px 16px 24px;box-shadow:0 10px 0 var(--past),0 28px 60px rgba(0,0,0,.35)}
.brand{display:flex;flex-direction:column;align-items:center;width:max-content;margin:0 auto;padding:8px 18px 6px;border:3px solid var(--ink);border-radius:18px;line-height:1}
.brand .wordmark{font-weight:800;font-size:26px;letter-spacing:.06em}
.brand .tag{font-weight:600;font-size:10px;letter-spacing:.04em;color:var(--muted);margin-top:4px}
.brand.sm{margin:0;padding:5px 10px 4px;border-width:2px;border-radius:12px}
.brand.sm .wordmark{font-size:15px}
h1{font-weight:800;font-size:clamp(32px,9.5vw,44px);line-height:1.05;text-align:center;margin:14px 0 6px}
.lead{text-align:center;color:var(--muted);font-weight:500;font-size:15.5px;line-height:1.5;margin:0 0 6px}
.legend{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;color:#1B2A55}
.chip.pres{background:var(--pres)}.chip.past{background:var(--past)}.chip.part{background:var(--part)}
.label{font-weight:700;font-size:15px;margin:18px 0 8px}
.choices{display:grid;gap:10px}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choices.c2{grid-template-columns:1fr 1fr}
.choice{border:2px solid var(--edge);background:var(--card);border-radius:18px;padding:12px 8px;font-weight:700;font-size:14.5px;line-height:1.3}
.choice small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.choice[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.choice[aria-pressed="true"] small{color:inherit;opacity:.8}
.primary{display:block;width:100%;margin-top:22px;border:0;border-radius:999px;background:var(--gold);color:#1B2A55;font-weight:800;font-size:21px;padding:16px;box-shadow:0 6px 0 #C68E14}
.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #C68E14}
.ghost{display:block;width:100%;margin-top:12px;border:3px solid var(--ink);background:transparent;border-radius:999px;font-weight:700;font-size:17px;padding:12px}

/* Game */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon-btn{border:0;background:var(--track);border-radius:14px;width:44px;height:44px;font-size:19px;display:grid;place-items:center}
.pill{background:var(--track);border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.player{border-radius:16px;padding:8px 12px;background:var(--track);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;border:3px solid transparent;transition:border-color .2s}
.player b{font-size:20px}
.player.turn{border-color:var(--ink)}
.player.p1 .dot{background:var(--pres)}.player.p2 .dot{background:var(--part)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}
.hint{text-align:center;font-weight:600;font-size:14px;color:var(--muted);min-height:22px;margin:10px 0 8px}
.board{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
.board.trio{grid-template-columns:repeat(3,1fr)}
@media (min-width:560px){.board.trio{grid-template-columns:repeat(6,1fr)}}
.mcard{position:relative;border:0;padding:0;background:transparent;aspect-ratio:4/3.4;perspective:700px}
.board.trio .mcard{aspect-ratio:4/3.2}
.inner{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
.mcard.up .inner,.mcard.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px}
.back{
  background-color:var(--back);
  background-image:radial-gradient(circle,#FF8FB1 3px,transparent 4px),radial-gradient(circle,#F2B632 3px,transparent 4px),radial-gradient(circle,#4FD1A5 3px,transparent 4px);
  background-size:34px 34px;background-position:4px 4px,21px 12px,12px 24px;
  box-shadow:0 4px 0 #101a3a;
}
.back span{background:#fff;color:#1B2A55;font-weight:800;font-size:12px;letter-spacing:.06em;border-radius:8px;padding:3px 7px}
.front{transform:rotateY(180deg);background:var(--card);border:3px solid var(--c);box-shadow:0 4px 0 var(--c)}
.front .w{font-weight:800;font-size:clamp(13px,3.8vw,19px);line-height:1.1;word-break:break-word;text-align:center}
.front .t{font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;background:var(--c);color:#1B2A55}
.mcard.done .front{background:color-mix(in srgb, var(--c) 22%, var(--card))}
.mcard.done.pop .inner{animation:pop .45s ease}
.mcard.miss .front{animation:shake .4s ease}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}45%{transform:rotateY(180deg) scale(1.1)}100%{transform:rotateY(180deg) scale(1)}}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}
.learned{margin-top:16px}
.learned h3{font-size:15px;margin:0 0 8px}
.lrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;border-radius:12px;background:var(--track);margin-bottom:6px;font-size:14px;font-weight:700}
.lrow .es{margin-left:auto;font-weight:500;color:var(--muted);font-size:13px}
.lrow .f{border-radius:8px;padding:1px 8px;color:#1B2A55}
.lrow .f.pres{background:var(--pres)}.lrow .f.past{background:var(--past)}.lrow .f.part{background:var(--part)}

/* End */
.end-title{font-weight:800;font-size:clamp(28px,8vw,36px);text-align:center;margin:16px 0 4px}
.end-sub{text-align:center;color:var(--muted);margin:0;font-weight:500}
.stars{display:flex;justify-content:center;gap:10px;margin:12px 0 6px}
.star{font-size:54px;color:var(--track);transform:scale(.6);transition:transform .35s cubic-bezier(.3,1.6,.5,1),color .2s}
.star.on{color:var(--gold);transform:scale(1)}
.summary{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="mova-voice.js"></script>
</head>
<body>
<canvas id="fx"></canvas>
<main class="app">
  <div class="panel">

    <section id="s-start">
      <div class="brand"><span class="wordmark">MOVA</span><span class="tag">Centro Pedagógico</span></div>
      <h1>Verb Memory</h1>
      <p class="lead">Find the forms of each verb and remember where every card is.</p>
      <div class="legend"><span class="chip pres">Present</span><span class="chip past">Past</span><span class="chip part">Participle</span></div>

      <div class="label">Game mode</div>
      <div class="choices c3" id="modes">
        <button class="choice" data-mode="past" aria-pressed="true">Pairs<small>Present + Past</small></button>
        <button class="choice" data-mode="part" aria-pressed="false">Pairs<small>Present + Participle</small></button>
        <button class="choice" data-mode="trio" aria-pressed="false">Trios<small>All 3 forms</small></button>
      </div>

      <div class="label">Verbs</div>
      <div class="choices c2" id="sets">
        <button class="choice" data-set="easy" aria-pressed="true">Everyday verbs<small>go, eat, see, write…</small></button>
        <button class="choice" data-set="hard" aria-pressed="false">Challenge verbs<small>begin, choose, freeze…</small></button>
      </div>

      <div class="label">Players</div>
      <div class="choices c2" id="players">
        <button class="choice" data-players="1" aria-pressed="true">1 player</button>
        <button class="choice" data-players="2" aria-pressed="false">2 players</button>
      </div>

      <button class="primary" id="play">Play</button>
    </section>

    <section id="s-game" hidden>
      <div class="hud">
        <button class="icon-btn" id="home" aria-label="Back to start">🏠</button>
        <div class="brand sm"><span class="wordmark">MOVA</span></div>
        <span class="pill" id="moves">Moves 0</span>
        <span class="pill" id="clock">0:00</span>
      </div>
      <div class="players" id="pbar" hidden>
        <div class="player p1" id="p1"><span><span class="dot"></span>Player 1</span><b id="p1s">0</b></div>
        <div class="player p2" id="p2"><span><span class="dot"></span>Player 2</span><b id="p2s">0</b></div>
      </div>
      <p class="hint" id="hint" aria-live="polite"></p>
      <div class="board" id="board"></div>
      <div class="learned" id="learned" hidden><h3>Verbs found</h3><div id="lrows"></div></div>
    </section>

    <section id="s-end" hidden>
      <div class="brand"><span class="wordmark">MOVA</span><span class="tag">Centro Pedagógico</span></div>
      <p class="end-title" id="end-title">Well done!</p>
      <p class="end-sub" id="end-sub"></p>
      <div class="stars" aria-hidden="true"><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
      <div class="summary"><span class="pill" id="end-moves"></span><span class="pill" id="end-time"></span></div>
      <div class="learned"><h3>Review</h3><div id="end-rows"></div></div>
      <button class="primary" id="again">Play again</button>
      <button class="ghost" id="change">Change mode</button>
    </section>

  </div>
</main>
<script>
(function(){
const $ = s => document.querySelector(s);
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };

const VERBS = {
  easy:[
    ['go','went','gone','ir'],['eat','ate','eaten','comer'],['see','saw','seen','ver'],['do','did','done','hacer'],
    ['make','made','made','hacer, fabricar'],['take','took','taken','tomar'],['come','came','come','venir'],['give','gave','given','dar'],
    ['write','wrote','written','escribir'],['drink','drank','drunk','beber'],['sleep','slept','slept','dormir'],['buy','bought','bought','comprar'],
    ['have','had','had','tener'],['run','ran','run','correr'],['sing','sang','sung','cantar'],['swim','swam','swum','nadar'],
    ['speak','spoke','spoken','hablar'],['know','knew','known','saber, conocer']
  ],
  hard:[
    ['begin','began','begun','empezar'],['choose','chose','chosen','elegir'],['forget','forgot','forgotten','olvidar'],['fly','flew','flown','volar'],
    ['freeze','froze','frozen','congelar'],['steal','stole','stolen','robar'],['wear','wore','worn','usar (ropa)'],['break','broke','broken','romper'],
    ['bring','brought','brought','traer'],['think','thought','thought','pensar'],['teach','taught','taught','enseñar'],['catch','caught','caught','atrapar'],
    ['ring','rang','rung','sonar'],['drive','drove','driven','manejar'],['ride','rode','ridden','montar'],['hide','hid','hidden','esconder'],
    ['bite','bit','bitten','morder'],['shake','shook','shaken','sacudir'],['throw','threw','thrown','lanzar'],['grow','grew','grown','crecer'],['draw','drew','drawn','dibujar']
  ]
};
const FORMS = [{k:'pres', label:'Present', c:'var(--pres)'},{k:'past', label:'Past', c:'var(--past)'},{k:'part', label:'Participle', c:'var(--part)'}];

const st = { mode:'past', set:'easy', players:1, cards:[], open:[], lock:false, moves:0, found:0, need:0, t0:0, tId:0, turn:1, score:[0,0], chosen:[] };

/* speech */
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let voice = null;
function pickVoice(){ if(!synth) return; const vs = synth.getVoices();
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Samantha|Google US|Aria|Jenny/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
function speak(t){ if(!synth) return; try{ if(synth.paused) synth.resume(); synth.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.9; if(voice) u.voice=voice; synth.speak(u); }catch(e){} }

/* sounds */
let actx = null;
function unlockAudio(){ try{ if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); } if(actx && actx.state==='suspended') actx.resume(); }catch(e){} }
function tones(freqs, step, type, vol){
  if(!actx) return; const t0 = actx.currentTime;
  freqs.forEach((f,i) => { const o=actx.createOscillator(), g=actx.createGain(); o.type=type||'sine'; o.frequency.value=f;
    const s=t0+i*step; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(vol||.16,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+step+.12);
    o.connect(g).connect(actx.destination); o.start(s); o.stop(s+step+.15); });
}
const flipS = () => tones([520], .05, 'sine', .08);
const chime = () => tones([660,880,1175], .09, 'triangle');
const miss = () => tones([300,240], .12, 'sine', .1);
const fanfare = () => tones([523,659,784,1047], .13, 'triangle');

/* option groups */
function group(id, attr, key){
  document.querySelectorAll(`#${id} .choice`).forEach(b => b.addEventListener('click', () => {
    unlockAudio();
    document.querySelectorAll(`#${id} .choice`).forEach(x => x.setAttribute('aria-pressed', x===b ? 'true':'false'));
    st[key] = attr === 'players' ? +b.dataset[attr] : b.dataset[attr];
  }));
}
group('modes','mode','mode'); group('sets','set','set'); group('players','players','players');

function show(id){ ['start','game','end'].forEach(s => $('#s-'+s).hidden = s!==id); window.scrollTo(0,0); }
const fmtT = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

/* build */
function start(){
  unlockAudio();
  const trio = st.mode === 'trio';
  const count = trio ? 6 : 8;
  st.chosen = shuffle(VERBS[st.set]).slice(0, count);
  const formsUsed = trio ? [0,1,2] : st.mode === 'past' ? [0,1] : [0,2];
  st.cards = [];
  st.chosen.forEach((v, vi) => formsUsed.forEach(fi => st.cards.push({ v:vi, f:fi, word:v[fi] })));
  st.cards = shuffle(st.cards);
  st.need = trio ? 3 : 2;
  st.open = []; st.lock = false; st.moves = 0; st.found = 0; st.turn = 1; st.score = [0,0];
  const board = $('#board'); board.innerHTML = ''; board.className = 'board' + (trio ? ' trio' : '');
  st.cards.forEach((c, i) => {
    const F = FORMS[c.f];
    const b = document.createElement('button');
    b.className = 'mcard'; b.dataset.i = i; b.style.setProperty('--c', F.c);
    b.setAttribute('aria-label', 'Hidden card');
    b.innerHTML = `<div class="inner"><div class="face back"><span>MOVA</span></div><div class="face front"><span class="w"></span><span class="t">${F.label}</span></div></div>`;
    b.querySelector('.w').textContent = c.word;
    b.addEventListener('click', () => flip(b, i));
    board.appendChild(b);
  });
  $('#lrows').innerHTML = ''; $('#learned').hidden = true;
  $('#moves').textContent = 'Moves 0'; $('#clock').textContent = '0:00';
  $('#pbar').hidden = st.players !== 2; updatePlayers();
  $('#hint').textContent = trio ? 'Find the 3 forms of each verb: present, past and participle.' : `Match each present verb with its ${st.mode === 'past' ? 'past' : 'participle'}.`;
  clearInterval(st.tId); st.t0 = Date.now();
  st.tId = setInterval(() => { $('#clock').textContent = fmtT(Math.floor((Date.now()-st.t0)/1000)); }, 1000);
  show('game');
}
function updatePlayers(){
  $('#p1').classList.toggle('turn', st.turn === 1); $('#p2').classList.toggle('turn', st.turn === 2);
  $('#p1s').textContent = st.score[0]; $('#p2s').textContent = st.score[1];
}
function flip(btn, i){
  if(st.lock) return;
  if(btn.classList.contains('up') || btn.classList.contains('done')) return;
  btn.classList.add('up'); btn.setAttribute('aria-label', st.cards[i].word);
  flipS(); speak(st.cards[i].word);
  st.open.push(i);
  const first = st.cards[st.open[0]];
  const allSame = st.open.every(k => st.cards[k].v === first.v);
  if(!allSame){ st.moves++; $('#moves').textContent = `Moves ${st.moves}`; mismatch(); return; }
  if(st.open.length === st.need){ st.moves++; $('#moves').textContent = `Moves ${st.moves}`; match(); }
}
function mismatch(){
  st.lock = true; miss();
  const open = st.open.slice();
  open.forEach(k => $(`.mcard[data-i="${k}"]`).classList.add('miss'));
  setTimeout(() => {
    open.forEach(k => { const el = $(`.mcard[data-i="${k}"]`); el.classList.remove('up','miss'); el.setAttribute('aria-label','Hidden card'); });
    st.open = []; st.lock = false;
    if(st.players === 2){ st.turn = st.turn === 1 ? 2 : 1; updatePlayers(); $('#hint').textContent = `Player ${st.turn}’s turn`; }
  }, 1100);
}
function match(){
  const open = st.open.slice(); st.open = [];
  const v = st.chosen[st.cards[open[0]].v];
  open.forEach(k => { const el = $(`.mcard[data-i="${k}"]`); el.classList.remove('up'); el.classList.add('done','pop'); });
  chime();
  setTimeout(() => speak(`${v[0]}, ${v[1]}, ${v[2]}`), 450);
  st.found++;
  if(st.players === 2){ st.score[st.turn-1]++; updatePlayers(); $('#hint').textContent = `Great! Player ${st.turn} plays again.`; }
  else $('#hint').textContent = `${v[0]} → ${v[1]} → ${v[2]}`;
  addRow($('#lrows'), v); $('#learned').hidden = false;
  if(st.found === st.chosen.length) setTimeout(finish, 1200);
}
function addRow(box, v){
  const r = document.createElement('div'); r.className = 'lrow';
  r.innerHTML = `<span class="f pres"></span><span class="f past"></span><span class="f part"></span><span class="es"></span>`;
  r.children[0].textContent = v[0]; r.children[1].textContent = v[1]; r.children[2].textContent = v[2]; r.children[3].textContent = v[3];
  box.prepend(r);
}
function finish(){
  clearInterval(st.tId);
  const secs = Math.floor((Date.now()-st.t0)/1000);
  const n = st.chosen.length;
  const extra = st.moves - n;
  const stars = extra <= Math.round(n*0.75) ? 3 : extra <= Math.round(n*1.75) ? 2 : 1;
  if(st.players === 2){
    const [a,b] = st.score;
    $('#end-title').textContent = a === b ? 'It’s a tie!' : `Player ${a > b ? 1 : 2} wins!`;
    $('#end-sub').textContent = `Player 1: ${a} · Player 2: ${b}`;
  } else {
    $('#end-title').textContent = stars === 3 ? 'Amazing memory!' : stars === 2 ? 'Great job!' : 'Well done!';
    $('#end-sub').textContent = 'You found all the verbs.';
  }
  $('#end-moves').textContent = `🔁 ${st.moves} moves`;
  $('#end-time').textContent = `⏱ ${fmtT(secs)}`;
  const er = $('#end-rows'); er.innerHTML = ''; st.chosen.slice().reverse().forEach(v => addRow(er, v));
  const els = document.querySelectorAll('.star'); els.forEach(s => s.classList.remove('on'));
  show('end');
  els.forEach((s,i) => { if(i < stars) setTimeout(() => { s.classList.add('on'); tones([600+i*200], .1, 'triangle'); }, 350+i*350); });
  setTimeout(() => { fanfare(); confetti(160); }, 350 + stars*350);
}
function home(){ clearInterval(st.tId); if(synth) synth.cancel(); show('start'); }

/* confetti */
const cv = $('#fx'), cx = cv.getContext('2d');
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let parts = [], fxRaf = 0;
function sizeCanvas(){ const d = window.devicePixelRatio||1; cv.width = innerWidth*d; cv.height = innerHeight*d; cx.setTransform(d,0,0,d,0,0); }
sizeCanvas(); addEventListener('resize', sizeCanvas);
function confetti(n){
  if(reduce) return;
  const cols = ['#FF8FB1','#5BC0F0','#F2B632','#4FD1A5','#B98CFF','#1B2A55'];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*.35, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4, r:Math.random()*6+4, c:cols[i%cols.length], rot:Math.random()*6, vr:(Math.random()-.5)*.3, life:0, round:Math.random()<.5});
  if(!fxRaf) fxRaf = requestAnimationFrame(drawFx);
}
function drawFx(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p => { p.vy+=.32; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c;
    if(p.round){ cx.beginPath(); cx.arc(0,0,p.r/1.6,0,Math.PI*2); cx.fill(); } else cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);
    cx.restore(); });
  parts = parts.filter(p => p.y < innerHeight+30 && p.life < 240);
  if(parts.length) fxRaf = requestAnimationFrame(drawFx); else { fxRaf = 0; cx.clearRect(0,0,innerWidth,innerHeight); }
}

$('#play').addEventListener('click', start);
$('#again').addEventListener('click', start);
$('#change').addEventListener('click', home);
$('#home').addEventListener('click', home);
})();
</script>
