<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Bóveda · MOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="mova-voice.js"></script>
<style>
:root{
  --bg:#FFF6E6; --card:#FFFFFF; --ink:#1B2A55; --muted:#5B6787; --tile:#F5F7FC; --edge:#DCE2F0; --track:#EEF1F8;
  --coral:#FF7A6B; --sky:#5BC0F0; --gold:#E9B93A; --mint:#4FD1A5; --lilac:#A98BE8; --pink:#F47FB0; --butter:#F7D96B; --purple:#8B6CE0;
  --good:#1F9A47; --good-bg:#DDF6E4; --bad:#E5484D; --bad-bg:#FDE4E4;
  --d1:rgba(255,122,107,.5); --d2:rgba(91,192,240,.5); --d3:rgba(247,217,107,.75); --d4:rgba(79,209,165,.5); --d5:rgba(169,139,232,.5); --d6:rgba(244,127,176,.45);
  --shadow:0 10px 0 rgba(27,42,85,.07),0 24px 48px rgba(27,42,85,.12);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a33;--card:#1d2748;--ink:#F3F5FF;--muted:#AEB8D8;--tile:#26315a;--edge:#36437a;--track:#2b365f;--good-bg:rgba(31,154,71,.24);--bad-bg:rgba(229,72,77,.24);--d1:rgba(255,122,107,.3);--d2:rgba(91,192,240,.3);--d3:rgba(247,217,107,.3);--d4:rgba(79,209,165,.3);--d5:rgba(169,139,232,.3);--d6:rgba(244,127,176,.3);--shadow:0 10px 0 rgba(0,0,0,.25),0 24px 48px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a33;--card:#1d2748;--ink:#F3F5FF;--muted:#AEB8D8;--tile:#26315a;--edge:#36437a;--track:#2b365f;--good-bg:rgba(31,154,71,.24);--bad-bg:rgba(229,72,77,.24);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;font-family:Poppins,"Century Gothic",system-ui,sans-serif;color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(var(--d1) 7px,transparent 8px),radial-gradient(var(--d2) 6px,transparent 7px),radial-gradient(var(--d3) 8px,transparent 9px),radial-gradient(var(--d4) 5px,transparent 6px),radial-gradient(var(--d5) 6px,transparent 7px),radial-gradient(var(--d6) 5px,transparent 6px);
  background-size:120px 120px,150px 150px,180px 180px,95px 95px,135px 135px,110px 110px;background-position:10px 20px,70px 90px,30px 130px,90px 40px,50px 60px,100px 10px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:12px}
.app{min-height:100%;display:grid;place-items:center;padding:16px 12px 28px}
.card{width:100%;max-width:600px;background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:22px 18px 24px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:inline-block;border:1.5px solid var(--ink);padding:4px 9px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.06em}
.back{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:8px 0}
.hero{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:12px}
.hero img{width:118px;height:auto;filter:drop-shadow(0 8px 10px rgba(27,42,85,.18))}
h1.title{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(38px,10.5vw,52px);line-height:.98;margin:0 0 8px;letter-spacing:-.02em;display:flex;flex-wrap:wrap;gap:0 .25em}
h1.title .w{display:inline-flex;white-space:nowrap}
h1.title .l{display:inline-block;color:var(--c);text-shadow:0 3px 0 color-mix(in srgb,var(--c) 45%,#1B2A55);transform:rotate(var(--r))}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--coral) 18%,var(--card));color:var(--ink);margin-bottom:8px}
.lead{color:var(--muted);margin:0;font-size:14.5px}
.label{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.level{display:grid;gap:2px;text-align:left;padding:11px 12px;border-radius:16px;background:color-mix(in srgb,var(--c) 12%,var(--card));border:2px solid transparent;min-height:62px}
.level b{font-size:14.5px;line-height:1.2}
.level small{font-size:12px;color:var(--muted);line-height:1.35}
.level[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 26%,var(--card))}
.play{width:100%;margin-top:20px;height:56px;border-radius:18px;background:linear-gradient(90deg,#FF7A6B,#F47FB0 35%,#A98BE8 70%,#5BC0F0);color:#fff;font-weight:700;font-size:17px;box-shadow:0 6px 0 #6E5BB8;text-shadow:0 1px 0 rgba(27,42,85,.2)}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #6E5BB8}
.ghost{width:100%;margin-top:10px;height:50px;border-radius:16px;background:var(--tile);font-weight:600}
.best{text-align:center;font-size:13px;color:var(--muted);margin:12px 0 0;min-height:20px}
.hud{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--tile);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.pill{padding:6px 12px;border-radius:999px;background:var(--tile);font-size:13.5px;font-weight:700;white-space:nowrap}
.pill.round{background:color-mix(in srgb,var(--sky) 20%,var(--card))}
.pill.score{margin-left:auto;background:var(--butter);color:#1B2A55}
.dots{display:flex;gap:5px;justify-content:center;margin:12px 0 10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--track)}
.dots i.ok{background:var(--mint)} .dots i.ko{background:var(--coral)} .dots i.now{background:var(--purple);transform:scale(1.25)}
.scene{position:relative;border-radius:22px;overflow:hidden;background:#EAE3D6;box-shadow:0 6px 0 rgba(27,42,85,.08)}
.scene>img.bg{display:block;width:100%;height:auto}
.bubble{position:absolute;background:#FFFDFA;color:#1B2A55;border-radius:16px;padding:8px 12px;font-weight:600;font-size:clamp(12.5px,3.4vw,15px);line-height:1.3;box-shadow:0 4px 0 rgba(27,42,85,.18);border:2px solid #1B2A55}
.task{text-align:center;margin:16px 0 10px}
.task h3{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(21px,5.6vw,26px);margin:0;line-height:1.15}
.task p{margin:4px 0 0;font-size:14px;color:var(--muted);font-weight:500}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{min-height:64px;border-radius:20px;background:color-mix(in srgb,var(--c) 14%,var(--card));border:2.5px solid color-mix(in srgb,var(--c) 55%,var(--card));box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,var(--card));font-family:"Bricolage Grotesque",Poppins,sans-serif;font-size:24px;font-weight:800;display:grid;place-items:center;padding:6px;line-height:1.1}
.opt small{display:block;font-family:Poppins,sans-serif;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
.opt:active{transform:scale(.97)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);box-shadow:0 4px 0 #9ED9B1}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 #F2A9AB;animation:shake .35s}
.opt.dim{opacity:.4}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.feedback{min-height:28px;text-align:center;font-weight:800;margin-top:14px;font-size:16px}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.go{display:block;margin:14px auto 0;padding:13px 30px;border-radius:16px;background:var(--purple);color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 0 #5E46B0}
.go:disabled{opacity:.4}
.end{text-align:center}
.end img.mascot{width:130px;height:auto;margin-top:6px;filter:drop-shadow(0 8px 10px rgba(27,42,85,.18))}
.end h2{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:32px;margin:6px 0 0}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.stars svg{width:44px;height:44px}
.final{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:60px;line-height:1;margin:6px 0 0;color:var(--purple)}
.final-l{color:var(--muted);margin:2px 0 14px}
.sumrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.sumrow .pill:nth-child(1){background:color-mix(in srgb,var(--mint) 22%,var(--card))}
.sumrow .pill:nth-child(2){background:var(--butter);color:#1B2A55}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.vault .bg{transition:opacity .6s}
.vault .bg.open{position:absolute;inset:0;width:100%;opacity:0}
.vault.opened .bg.open{opacity:1}
.locks{position:absolute;left:4%;right:4%;bottom:3%;display:grid;grid-template-columns:repeat(4,1fr);gap:4%;align-items:end}
.lock{position:relative;transition:transform .5s,opacity .5s;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
.lock img{width:100%;height:auto;display:block}
.lock .scr{position:absolute;left:19%;right:19%;top:47%;height:31%;display:grid;place-items:center;font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(13px,4vw,20px);color:#1B2A55}
.lock.now{animation:glow 1.2s infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 10px #F7D96B) drop-shadow(0 6px 6px rgba(0,0,0,.4))}}
.lock.shake{animation:shake .35s}
.lock.open{transform:translateY(-14%) rotate(-8deg);opacity:.55}
.lock.open:after{content:"✓";position:absolute;right:-6%;top:-4%;width:42%;aspect-ratio:1;border-radius:50%;background:#4FD1A5;color:#fff;display:grid;place-items:center;font-weight:800;font-size:clamp(12px,3.6vw,18px);border:2px solid #1B2A55}
.vtitle{position:absolute;left:50%;top:4%;transform:translateX(-50%);background:rgba(27,42,85,.88);color:#F7D96B;border:2px solid #C9A23A;border-radius:12px;padding:3px 12px;font-weight:800;font-size:clamp(11px,3.2vw,14px);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.riddle{margin-top:14px;border-radius:20px;background:#1B2A55;color:#fff;padding:14px 16px;text-align:center;box-shadow:0 5px 0 #0E1838}
.riddle small{color:#F7D96B;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.riddle .q{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(22px,6.4vw,30px);margin-top:4px;line-height:1.2}
.riddle .q.txt{font-family:Poppins,sans-serif;font-size:clamp(15px,4.2vw,18px);font-weight:600}
.code{margin:12px auto 0;min-height:56px;max-width:260px;border-radius:16px;background:var(--tile);border:2.5px solid var(--edge);display:grid;place-items:center;font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:32px;letter-spacing:.06em}
.code.empty{color:var(--muted);font-size:15px;font-family:Poppins,sans-serif;font-weight:600;letter-spacing:0}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pad button{height:54px;border-radius:14px;background:color-mix(in srgb,var(--c) 16%,var(--card));border:2px solid color-mix(in srgb,var(--c) 50%,var(--card));font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:22px}
.pad button:active{transform:scale(.95)}
.pad .ok{grid-column:1/-1;background:var(--purple);border-color:var(--purple);color:#fff;font-family:Poppins,sans-serif;font-size:17px}
.explain{margin-top:12px;border-radius:16px;background:var(--tile);padding:10px 14px;font-size:14px;line-height:1.5;text-align:left}
.explain b{font-family:"Bricolage Grotesque",Poppins,sans-serif}

</style>
</head>

<script>
(function(){
"use strict";
const $ = (s) => document.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const PAL = ["var(--coral)", "var(--sky)", "var(--gold)", "var(--mint)", "var(--purple)", "var(--pink)"];
const KEY = "boveda";
(function () { let n = 0; $("#title").innerHTML = "La Bóveda".split(" ").map((w) => `<span class="w" aria-hidden="true">${[...w].map((ch) => { const i = n++; return `<span class="l" style="--c:${PAL[i % PAL.length]};--r:${i % 2 ? 4 : -4}deg">${ch}</span>`; }).join("")}</span>`).join(""); })();

/* Voz en español y sonidos */
const synth = window.speechSynthesis || null;
function hablar(t) { if (!synth) return; try { synth.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "es-MX"; u.rate = .95; const v = synth.getVoices().find((x) => /^es[-_]MX/i.test(x.lang)) || synth.getVoices().find((x) => /^es/i.test(x.lang)); if (v) u.voice = v; synth.speak(u); } catch (e) {} }
let actx = null;
function unlock() { try { if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (actx && actx.state === "suspended") actx.resume(); } catch (e) {} }
function tones(fs, step, type, vol) { if (!actx) return; const t0 = actx.currentTime; fs.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = type || "sine"; o.frequency.value = f; const s = t0 + i * step; g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(vol || .16, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + step + .12); o.connect(g).connect(actx.destination); o.start(s); o.stop(s + step + .15); }); }
const chime = () => tones([660, 880, 1175], .08, "triangle"), buzz = () => tones([220, 180], .13, "square", .1), fanfare = () => tones([523, 659, 784, 1047], .12, "triangle"), tick = () => tones([1200], .03, "sine", .08), coinSnd = () => tones([1320, 1760], .05, "triangle", .1);

const bestKey = () => `mova-${KEY}-${st.level}`;
const getBest = () => { try { return +(localStorage.getItem(bestKey()) || 0); } catch (e) { return 0; } };
const setBest = (v) => { try { localStorage.setItem(bestKey(), String(v)); } catch (e) {} };
function show(id) { ["start", "game", "end"].forEach((s) => { $("#s-" + s).hidden = s !== id; }); window.scrollTo(0, 0); }
const st = { level: 0, round: 0, score: 0, results: [], firstTry: true, timeouts: [] };
function later(fn, ms) { st.timeouts.push(setTimeout(fn, ms)); }
function clearLater() { st.timeouts.forEach(clearTimeout); st.timeouts = []; }
function feedback(text, good) { const f = $("#feedback"); f.textContent = text; f.className = "feedback" + (good === true ? " good" : good === false ? " bad" : ""); }
const PRAISE = ["¡Muy bien!", "¡Excelente!", "¡Lo lograste!", "¡Súper!", "¡Bravo!", "¡Genial!"];

/* Niveles */
function drawLevels() {
  $("#levels").innerHTML = LEVELS.map((l, i) => `<button class="level" data-i="${i}" style="--c:${PAL[i % PAL.length]}" aria-pressed="${i === st.level}"><b>${l.name}</b><small>${l.desc}</small></button>`).join("");
  const b = getBest(); $("#best").textContent = b ? `Mejor puntaje en ${LEVELS[st.level].name}: ${b}` : "";
}
$("#levels").addEventListener("click", (e) => { const b = e.target.closest(".level"); if (b) { unlock(); st.level = +b.dataset.i; try { localStorage.setItem(`mova-${KEY}-lvl`, st.level); } catch (er) {} drawLevels(); } });

function dots() { $("#dots").innerHTML = Array.from({ length: ROUNDS }, (_, i) => `<i class="${st.results[i] === true ? "ok" : st.results[i] === false ? "ko" : i === st.round ? "now" : ""}"></i>`).join(""); }
function startGame() { unlock(); clearLater(); st.round = 0; st.score = 0; st.results = []; $("#score").textContent = "0 pts"; show("game"); nextRound(); }
function nextRound() {
  if (st.round >= ROUNDS) return finish();
  st.firstTry = true; feedback("");
  $("#round").textContent = `${ROUND_LABEL} ${st.round + 1} de ${ROUNDS}`; dots();
  newRound();
}
function win(pts, msg) {
  const p = st.firstTry ? pts : Math.round(pts / 2);
  st.score += p; $("#score").textContent = `${st.score} pts`;
  st.results[st.round] = st.firstTry; chime(); burst(40);
  feedback(`${msg || pick(PRAISE)} +${p}`, true); dots();
  st.round++; later(nextRound, 1700);
}
function miss(msg, reveal) {
  buzz(); feedback(msg, false);
  if (!st.firstTry || reveal) { st.results[st.round] = false; dots(); return true; }
  st.firstTry = false; return false;
}
function skipAfterReveal() { st.round++; later(nextRound, 2600); }
function finish() {
  clearLater(); show("end");
  const ok = st.results.filter(Boolean).length, stars = ok >= ROUNDS - 1 ? 3 : ok >= Math.ceil(ROUNDS * .6) ? 2 : ok >= Math.ceil(ROUNDS * .3) ? 1 : 0;
  $("#stars").innerHTML = [0, 1, 2].map((i) => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.5l1.3-6.6L2.5 9.3l6.6-.8z" fill="${i < stars ? "#F7D96B" : "var(--track)"}" stroke="${i < stars ? "#E9B93A" : "none"}" stroke-width="1"/></svg>`).join("");
  $("#end-title").textContent = ["¡Sigue practicando!", "¡Buen intento!", "¡Muy bien!", "¡Increíble!"][stars];
  $("#final").textContent = st.score;
  $("#sum-correct").textContent = `${ok} de ${ROUNDS} a la primera`;
  const best = getBest(); if (st.score > best) setBest(st.score);
  $("#sum-best").textContent = st.score > best ? "¡Nuevo récord!" : `Récord: ${best}`;
  if (stars >= 2) { fanfare(); burst(140); }
}
$("#play").addEventListener("click", startGame);
$("#again").addEventListener("click", startGame);
$("#change").addEventListener("click", () => { drawLevels(); show("start"); });
$("#home").addEventListener("click", () => { clearLater(); if (synth) synth.cancel(); drawLevels(); show("start"); });

const cv = $("#fx"), cx = cv.getContext("2d"); let parts = [], fxOn = false;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
function burst(n) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#FF7A6B", "#5BC0F0", "#F7D96B", "#4FD1A5", "#8B6CE0", "#F47FB0"];
  for (let i = 0; i < n; i++) parts.push({ x: cv.width / 2, y: cv.height / 3, vx: (Math.random() - .5) * 16 * devicePixelRatio, vy: (Math.random() * -12 - 4) * devicePixelRatio, r: (4 + Math.random() * 5) * devicePixelRatio, c: cols[i % cols.length], life: 90 });
  if (!fxOn) { fxOn = true; requestAnimationFrame(drawFx); }
}
function drawFx() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += .45 * devicePixelRatio; p.life--; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fill(); });
  parts = parts.filter((p) => p.life > 0 && p.y < cv.height + 40);
  if (parts.length) requestAnimationFrame(drawFx); else { fxOn = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

  const t = rnd(0, 5);
  if (t === 0) { const b = rnd(2, 5), e = b <= 3 ? 3 : 2, r = rnd(4, 10); return { q: `${b}${e === 3 ? "³" : "²"} + √${r * r}`, a: b ** e + r, e: `${b}${e === 3 ? "³" : "²"} = ${b ** e} y √${r * r} = ${r}. Suma: <b>${b ** e + r}</b>.` }; }
  if (t === 1) { const b = rnd(2, 3); return { q: `(−${b})³`, a: -(b ** 3), e: `(−${b}) × (−${b}) × (−${b}): tres signos menos dan negativo: <b>−${b ** 3}</b>.` }; }
  if (t === 2) { const a = rnd(2, 6), c = rnd(2, 5), d = rnd(1, 20); return { q: `${a}² × ${c} − ${d}`, a: a * a * c - d, e: `Potencia primero: ${a}² = ${a * a}. Luego × ${c} = ${a * a * c}. Al final − ${d} = <b>${a * a * c - d}</b>.` }; }
  return pick([hier, signs, pct])();
}
const GEN = [hier, signs, pct, master];
let R = null, opened = 0, vaultN = 1;
function locksHTML() { $("#locks").innerHTML = LKEYS.map((k, i) => `<div class="lock" id="lk${i}"><img src="${LK[k]}" alt="Candado ${i + 1}"><span class="scr">${i + 1}</span></div>`).join(""); }
function newRound() {
  const idx = st.round % 4;
  if (idx === 0) { vaultN = st.round / 4 + 1; $("#scene").classList.remove("opened"); locksHTML(); $("#vtitle").textContent = `Bóveda ${vaultN} de 2`; }
  document.querySelectorAll(".lock").forEach((l) => l.classList.remove("now"));
  $(`#lk${idx}`).classList.add("now");
  R = { ...GEN[st.level](), idx, entry: "", done: false };
  $("#riddle").innerHTML = `<small>Candado ${idx + 1} · escribe el código</small><div class="q${R.txt ? " txt" : ""}">${R.txt ? R.q : R.q + " = ?"}</div>`;
  if (idx === 0) later(() => hablar(`Bóveda ${vaultN}. Abre los cuatro candados.`), 300);
  const keys = ["7", "8", "9", "⌫", "4", "5", "6", "−", "1", "2", "3", "0"];
  $("#zone").innerHTML = `<div class="code empty" id="code">Código</div><div class="pad" id="pad">${keys.map((k, i) => `<button data-k="${k}" style="--c:${PAL[i % 6]}">${k}</button>`).join("")}<button class="ok" data-k="ok">Abrir candado</button></div><div id="exp"></div>`;
  $("#pad").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b || R.done) return; const k = b.dataset.k;
    if (k === "ok") return check();
    tick();
    if (k === "⌫") R.entry = R.entry.slice(0, -1);
    else if (k === "−") R.entry = R.entry.startsWith("−") ? R.entry.slice(1) : "−" + R.entry;
    else if (R.entry.replace("−", "").length < 5) R.entry += k;
    const c = $("#code"); c.textContent = R.entry || "Código"; c.classList.toggle("empty", !R.entry);
  });
}
function check() {
  if (!R.entry || R.entry === "−") return;
  const v = parseInt(R.entry.replace("−", "-"), 10);
  const lk = $(`#lk${R.idx}`);
  if (v === R.a) {
    R.done = true; lk.classList.remove("now"); lk.classList.add("open"); lk.querySelector(".scr").textContent = S(R.a); coinSnd();
    if (R.idx === 3) { later(() => { $("#scene").classList.add("opened"); fanfare(); burst(120); hablar("¡Abriste la bóveda!"); }, 500); }
    win(R.idx === 3 ? 150 : 100, R.idx === 3 ? "¡Abriste la bóveda!" : "¡Candado abierto!");
  } else {
    lk.classList.remove("shake"); void lk.offsetWidth; lk.classList.add("shake");

      $("#exp").innerHTML = `<div class="explain">${R.e}</div>`; feedback(`El código era ${S(R.a)}.`, false);

    }
  }
}


try { const l = +localStorage.getItem(`mova-${KEY}-lvl`); if (l >= 0 && l < LEVELS.length) st.level = l; } catch (e) {}
