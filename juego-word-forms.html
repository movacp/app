 <div class="lab" style="color:var(--mint);margin-top:14px" id="ql">WHICH UNDERLINED WORD IS WRONG?</div>
 <div class="opts g2" id="op">${q.parts.filter(p=>typeof p!=="string").map(p=>`<button data-k="${p.k}"><span class="let">${L[p.k]}</span>${p.t}</button>`).join("")}</div>
 <div class="fb" id="fb"></div><button class="next" id="nx">Fix it</button><div class="kb" id="kb">Tip: on a keyboard, press A–D to answer.</div></div>`;
 $("#bk").onclick=()=>{stop();fixIntro()};
 const ul=k=>$(`.ul[data-k="${k}"]`);let lock=false;
 const find=k=>{if(lock||step!==1)return;lock=true;stepOk=k===q.w;const bs=$$("#op button");
  bs.forEach(b=>{b.disabled=true;if(+b.dataset.k===q.w)b.classList.add("ok");else if(+b.dataset.k===k)b.classList.add("no")});
  ul(q.w).classList.add("bad");if(!stepOk)ul(k).classList.add("no");if(stepOk)st.found++;
  const fb=$("#fb");fb.className="fb show "+(stepOk?"g":"b");
  fb.innerHTML=stepOk?`<b>You found it!</b>(${L[q.w]}) <b style="display:inline">${q.parts.find(p=>p.k===q.w).t}</b> is the wrong form. Now fix it.`:`<b>Not quite.</b>The error is (${L[q.w]}) <b style="display:inline">${q.parts.find(p=>p.k===q.w).t}</b>. Now try to fix it.`;
  $("#nx").textContent="Fix it";$("#nx").classList.add("show");$("#nx").onclick=goFix;};
 const goFix=()=>{step=2;lock=false;$("#s1").classList.remove("on");$("#s1").classList.add("dn");$("#s2").classList.add("on");
  $$(".ul").forEach(u=>u.classList.remove("no"));$("#fb").className="fb";$("#nx").classList.remove("show");
  $("#ql").textContent="CHOOSE THE CORRECT FORM";
  $("#op").className="opts";$("#op").innerHTML=q.o.map((o,k)=>`<button data-k="${k}"><span class="let">${L[k]}</span>${o}</button>`).join("");
  $$("#op button").forEach(b=>b.onclick=()=>fix(+b.dataset.k));};
 const fix=k=>{if(lock||step!==2)return;lock=true;const good=k===q.a,bs=$$("#op button");
  bs[k].classList.add(good?"ok":"no");if(!good)bs[q.a].classList.add("ok");bs.forEach(b=>b.disabled=true);
  if(good)st.fixed++;const both=good&&stepOk;
  if(both){st.ok++;st.streak++;st.bestStreak=Math.max(st.bestStreak,st.streak)}else{st.streak=0;st.missed.push(q)}
  $("#sc").textContent="Score "+st.ok;$("#sk").textContent="Streak "+st.streak;
  const u=ul(q.w);u.className="ul fixed";u.innerHTML=`<s>${q.parts.find(p=>p.k===q.w).t}</s> ${q.wd[0]}<u class="hl">${q.wd[1]}</u>`;
  const fb=$("#fb");fb.className="fb show "+(both?"g":"b");
  fb.innerHTML=`<b>${both?"Correct! Both steps.":good?"Good fix! But remember to find the error first.":`Not quite. The correct form is ${q.o[q.a]}.`}</b><div class="clues"><div><em>Position</em><span>${q.e}</span></div><div><em>Ending</em><span><b>-${q.wd[1]}</b> is ${sufT(q.wd[1],q.wd.join(''))}</span></div></div>`;
  $("#nx").textContent=st.i+1<st.list.length?"Next sentence":"See results";$("#nx").classList.add("show");$("#nx").onclick=()=>{st.i++;fixQ()};};
 $$("#op button").forEach(b=>b.onclick=()=>find(+b.dataset.k));
 $$(".ul").forEach(u=>u.onclick=()=>find(+u.dataset.k));
 document.onkeydown=e=>{const k=L.indexOf(e.key.toUpperCase());if(e.key.length===1&&k>=0){if(step===1)find(k);else if(k<3)fix(k)}else if(e.key==="Enter"&&$("#nx.show"))$("#nx").click()};}
function fixDone(){stop();const n=st.list.length,acc=Math.round(st.ok/n*100);
 const g={};st.missed.forEach(q=>(g[q.c]=g[q.c]||[]).push(q));const order=Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
 const fixed=q=>q.src.replace(/\[\*[^\]]+\]/,`<b>${q.wd[0]}<u>${q.wd[1]}</u></b>`).replace(/\[([^\]]+)\]/g,"$1");
 app.innerHTML=`<div class="top"><button class="back" id="bk">${back} Word Forms</button><span class="brand">Results</span></div>
 <div class="card res"><div class="lab" style="color:var(--mint)">ROUND COMPLETE</div><div class="score">${st.ok}/${n}</div>
 <p style="color:var(--ink-2);margin:0">sentences with both steps correct</p>
 <div class="sumrow"><div><b>${st.found}/${n}</b><span>ERRORS FOUND</span></div><div><b>${st.fixed}/${n}</b><span>FORMS FIXED</span></div><div><b>${acc}%</b><span>ACCURACY</span></div></div>
 ${order.length?`<div class="rv"><h4>REVIEW THESE</h4>${order.map(k=>`<div class="rvc" style="background:${CAT[k][2]}"><b>${CAT[k][0]}</b><em>${H(CAT[k][1])}</em>${g[k].map(q=>`<p class="rvs">${fixed(q)}</p>`).join("")}</div>`).join("")}<p class="hint" style="margin-top:12px">Remember: check each underlined word. Does its ending match its position?</p></div>`:`<p style="margin-top:16px;font-weight:600;color:var(--good)">No mistakes. You’re ready for Written Expression!</p>`}
 <button class="next show" id="ag">Play again</button><button class="second" id="ch">How to play</button></div>`;
 $("#bk").onclick=home;$("#ag").onclick=fixStart;$("#ch").onclick=fixIntro;}

new MutationObserver(()=>window.scrollTo(0,0)).observe(app,{childList:true});
home();

</script><script src="mova-auth.js"></script>
</body></html>
