<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión Matemática · MOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="mova-voice.js"></script>
<style>
:root{
  --page:#1B2A55; --card:#FFFFFF; --ink:#1B2A55; --muted:#5B6787; --tile:#F3F6FC; --edge:#DCE2F0; --track:#E9EEF8;
  --sky:#5BC0F0; --pink:#F47FB0; --mint:#4FD1A5; --mustard:#F2B632; --coral:#FF7A6B; --lilac:#A98BE8;
  --good:#1F9A47; --good-bg:#DDF6E4; --bad:#E5484D; --bad-bg:#FDE4E4;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1F2B52;--ink:#F3F5FF;--muted:#B3BDDC;--tile:#28356A;--edge:#3A4880;--track:#2C3A70;--good-bg:rgba(31,154,71,.25);--bad-bg:rgba(229,72,77,.25);color-scheme:dark}}
:root[data-theme="dark"]{--card:#1F2B52;--ink:#F3F5FF;--muted:#B3BDDC;--tile:#28356A;--edge:#3A4880;--track:#2C3A70;--good-bg:rgba(31,154,71,.25);--bad-bg:rgba(229,72,77,.25);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;font-family:Poppins,"Century Gothic",system-ui,sans-serif;color:var(--ink);background:var(--page);overflow-x:hidden}
.sym{position:fixed;inset:0;z-index:0;pointer-events:none}
.sym svg{width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--mustard);outline-offset:3px;border-radius:12px}
.app{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;padding:18px 14px 28px}
.card{width:100%;max-width:580px;background:var(--card);border-radius:30px;box-shadow:0 12px 0 rgba(91,192,240,.45),0 30px 60px rgba(0,0,0,.3);padding:24px 20px 26px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:inline-block;border:1.5px solid var(--ink);padding:4px 9px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.06em}
.back{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:8px 0}
h1{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(36px,10vw,52px);line-height:.98;margin:18px 0 6px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 16px}
.label{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;background:var(--tile);border-radius:16px}
.tab{padding:10px 6px;border-radius:12px;font-size:14px;font-weight:600}
.tab[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 8px rgba(27,42,85,.15)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grade{padding:12px 8px;border-radius:16px;background:var(--tile);border:2.5px solid transparent;display:grid;gap:2px;justify-items:center}
.grade b{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:24px;line-height:1;color:var(--c)}
.grade small{font-size:12px;color:var(--muted);font-weight:500}
.grade[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card))}
.topics{font-size:13.5px;color:var(--muted);margin:12px 2px 0;line-height:1.5;min-height:40px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toggle button{padding:11px;border-radius:14px;background:var(--tile);font-weight:600;font-size:14px;border:2px solid transparent}
.toggle button[aria-pressed="true"]{border-color:var(--ink)}
.primary{width:100%;margin-top:20px;height:56px;border-radius:18px;background:var(--ink);color:var(--card);font-weight:700;font-size:17px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.primary:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.ghost{width:100%;margin-top:10px;height:50px;border-radius:16px;background:var(--tile);font-weight:600}
.best{text-align:center;font-size:13px;color:var(--muted);margin:12px 0 0;min-height:20px}
.hud{display:flex;align-items:center;gap:8px}
.pill{padding:6px 12px;border-radius:999px;background:var(--tile);font-size:13.5px;font-weight:600;white-space:nowrap}
.pill.score{margin-left:auto;background:color-mix(in srgb,var(--mustard) 25%,var(--card))}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--tile);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.space{position:relative;height:74px;margin:14px 0 6px;border-radius:18px;background:#16224A;overflow:hidden}
.space .stars{position:absolute;inset:0}
.space .earth{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:46px;height:46px}
.space .moon{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:42px;height:42px}
.space .rocket{position:absolute;left:52px;top:50%;width:46px;height:46px;transform:translate(0,-50%) rotate(90deg);transition:left .7s cubic-bezier(.3,.8,.3,1)}
.timer{height:8px;border-radius:8px;background:var(--track);overflow:hidden;margin:8px 0 4px}
.timer i{display:block;height:100%;background:var(--mint);transform-origin:left;border-radius:8px}
.timer i.low{background:var(--coral)}
.timer[hidden]{display:none}
.streak{height:22px;text-align:center;font-size:13px;font-weight:700;color:var(--coral)}
.ask{display:flex;align-items:flex-start;gap:10px;margin-top:4px}
.prompt{flex:1;font-size:15px;font-weight:600;color:var(--muted);margin:6px 0 0}
.speak{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;flex:none}
.speak svg{width:20px;height:20px}
.speak[hidden]{display:none}
.problem{margin:12px 0 16px;padding:20px 16px;border-radius:22px;background:var(--tile);text-align:center;font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(28px,8vw,42px);line-height:1.25;word-break:break-word}
.problem.text{font-family:Poppins,sans-serif;font-weight:600;font-size:clamp(17px,4.6vw,20px);line-height:1.5;text-align:left}
.problem .q{display:inline-grid;place-items:center;min-width:1.4em;padding:0 .2em;border-radius:12px;background:var(--mustard);color:#1B2A55}
.problem sup{font-size:.55em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1;margin:0 .08em;font-size:.8em}
.frac span:first-child{border-bottom:.08em solid currentColor;padding:0 .1em .06em}
.frac span:last-child{padding-top:.06em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:70px;border-radius:20px;background:var(--card);border:2.5px solid var(--edge);font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:clamp(20px,5.5vw,26px);padding:8px;box-shadow:0 5px 0 var(--edge)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);box-shadow:none}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);box-shadow:none;animation:shake .35s}
.opt.dim{opacity:.4}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{min-height:26px;margin-top:14px;font-weight:700;text-align:center}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.explain{margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--tile);font-size:14.5px;line-height:1.5}
.explain[hidden]{display:none}
.next{margin-top:12px}
.end{text-align:center}
.end-title{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:30px;margin:18px 0 2px}
.end-sub{color:var(--muted);margin:0}
.starsrow{display:flex;justify-content:center;gap:6px;margin:14px 0 4px}
.starsrow svg{width:44px;height:44px}
.final{font-family:"Bricolage Grotesque",Poppins,sans-serif;font-weight:800;font-size:60px;line-height:1;margin:4px 0 0}
.final-l{color:var(--muted);margin:2px 0 12px}
.sumrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.review{margin-top:18px;text-align:left;background:var(--tile);border-radius:18px;padding:14px 16px}
.review h3{margin:0 0 8px;font-size:14px}
.review ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14.5px;line-height:1.45}
.review b{font-weight:600}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sym" aria-hidden="true" id="sym"></div>
<canvas id="fx"></canvas>
<main class="app">
<div class="card">

  <section id="s-start">
    <div class="top"><a class="back" href="./#/games">MOVA Learning Studio</a><span class="brand">MOVA · Centro Pedagógico</span></div>
    <h1>Misión Matemática</h1>
    <p class="lead">Resuelve cada ejercicio para llevar el cohete hasta la Luna.</p>
    <div class="tabs" id="tabs" role="group" aria-label="Nivel escolar"></div>
    <div class="grades" id="grades" role="group" aria-label="Grado"></div>
    <p class="topics" id="topics"></p>
    <div class="label">Modo de juego</div>
    <div class="toggle" role="group" aria-label="Modo de juego">
      <button data-timed="1" aria-pressed="false">Con tiempo</button>
      <button data-timed="0" aria-pressed="true">Sin tiempo</button>
    </div>
    <button class="primary" id="play">Comenzar misión</button>
    <p class="best" id="best"></p>
  </section>

  <section id="s-game" hidden>
    <div class="hud">
      <button class="icon-btn" id="home" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
      <span class="pill" id="gname"></span>
      <span class="pill" id="round"></span>
      <span class="pill score" id="score">0 pts</span>
    </div>
    <div class="space" aria-hidden="true">
      <svg class="stars" viewBox="0 0 300 74" preserveAspectRatio="none"><g fill="#fff" opacity=".7"><circle cx="70" cy="14" r="1.2"/><circle cx="120" cy="54" r="1"/><circle cx="160" cy="20" r="1.4"/><circle cx="200" cy="58" r="1"/><circle cx="236" cy="16" r="1.2"/><circle cx="96" cy="36" r=".9"/><circle cx="180" cy="40" r=".9"/></g></svg>
      <svg class="earth" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#5BC0F0"/><path d="M10 16c6-2 8 3 13 2s6-6 11-4c3 1 4 5 1 7-4 3-9 0-11 4s3 7 0 10c-3 2-8 1-10-3-2-5 3-7 0-10-2-2-7-1-4-6z" fill="#4FD1A5"/></svg>
      <svg class="rocket" id="rocket" viewBox="0 0 48 48"><path d="M24 3c7 6 9 17 6 28h-12c-3-11-1-22 6-28z" fill="#FFFFFF"/><circle cx="24" cy="17" r="4.5" fill="#5BC0F0" stroke="#1B2A55" stroke-width="2"/><path d="M18 24l-7 11 7-2zM30 24l7 11-7-2z" fill="#FF7A6B"/><path d="M20 31l4 12 4-12z" fill="#F2B632"/></svg>
      <svg class="moon" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#FFF3C9"/><circle cx="17" cy="18" r="4" fill="#F2E2A6"/><circle cx="30" cy="29" r="5" fill="#F2E2A6"/><circle cx="29" cy="14" r="2.4" fill="#F2E2A6"/></svg>
    </div>
    <div class="timer" id="timer" hidden><i id="tbar"></i></div>
    <div class="streak" id="streak" aria-live="polite"></div>
    <div class="ask"><p class="prompt" id="prompt"></p><button class="speak" id="speak" aria-label="Escuchar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div class="problem" id="problem"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="explain" id="explain" hidden></div>
    <button class="primary next" id="next" hidden>Siguiente</button>
  </section>

  <section id="s-end" class="end" hidden>
    <div class="top"><a class="back" href="./#/games">MOVA Learning Studio</a><span class="brand">MOVA · Centro Pedagógico</span></div>
    <p class="end-title" id="end-title"></p>
    <p class="end-sub" id="end-sub"></p>
    <div class="starsrow" id="starsrow"></div>
    <p class="final" id="final">0</p>
    <p class="final-l">puntos</p>
    <div class="sumrow"><span class="pill" id="sum-c"></span><span class="pill" id="sum-b"></span></div>
    <div class="review" id="review" hidden><h3>Para repasar</h3><ol id="review-list"></ol></div>
    <button class="primary" id="again">Jugar otra vez</button>
    <button class="ghost" id="change">Cambiar de grado</button>
  </section>

</div>
</main>
<script>
(function(){
"use strict";
const $ = (s) => document.querySelector(s);
const ROUNDS = 10;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const NAMES = ["Ana", "Luis", "Sofía", "Mateo", "Valeria", "Pablo", "Regina", "Diego", "Camila", "Emilio"];
const fmt = (n) => { const r = Math.round(n * 1000) / 1000; return r.toLocaleString("es-MX", { maximumFractionDigits: 3 }); };
const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
const lcm = (a, b) => (a * b) / gcd(a, b);
const fr = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const simp = (n, d) => { const g = gcd(n, d); return [n / g, d / g]; };
const frS = (n, d) => { const [a, b] = simp(n, d); return b === 1 ? String(a) : `${a}/${b}`; };

/* Opciones numéricas cercanas a la respuesta */
function numOpts(ans, spread, allowNeg) {
  const s = new Set([fmt(ans)]);
  const step = Number.isInteger(ans) ? 1 : (String(ans).split(".")[1] || "").length === 1 ? 0.1 : 0.01;
  const cands = shuffle([1, -1, 2, -2, 10, -10, spread, -spread, 5, -5].map((k) => ans + k * (Math.abs(k) >= 5 ? 1 : step * (Number.isInteger(ans) ? 1 : 10))));
  for (const c of cands) { if (s.size >= 4) break; if ((allowNeg || c >= 0) && Math.abs(c - ans) > 1e-9) s.add(fmt(c)); }
  let k = 3; while (s.size < 4) s.add(fmt(ans + k++));
  return shuffle([...s]);
}
const Q = (o) => Object.assign({ prompt: "Resuelve", say: "", text: false }, o);
const num = (o) => Q(Object.assign(o, { ans: fmt(o.ans), opts: numOpts(o.ans, o.spread || 10, o.neg) }));
const choice = (o) => { const a = String(o.ans), w = [...new Set(o.wrong.map(String))].filter((x) => x !== a).slice(0, 3); return Q(Object.assign(o, { opts: shuffle([a, ...w]), ans: a })); };

/* ---------- Generadores por grado ---------- */
const GEN = {
  p1: [
    () => { const a = rnd(1, 10), b = rnd(1, 9); return num({ html: `${a} + ${b} = <span class="q">?</span>`, ans: a + b, say: `¿Cuánto es ${a} más ${b}?`, why: `Juntamos ${a} y ${b}: contamos ${b} lugares después del ${a} y llegamos a ${a + b}.`, spread: 3 }); },
    () => { const a = rnd(6, 20), b = rnd(1, a - 1); return num({ html: `${a} − ${b} = <span class="q">?</span>`, ans: a - b, say: `¿Cuánto es ${a} menos ${b}?`, why: `Si a ${a} le quitamos ${b}, quedan ${a - b}.`, spread: 3 }); },
    () => { const c = rnd(8, 20), a = rnd(1, c - 1); return num({ prompt: "¿Qué número falta?", html: `${a} + <span class="q">?</span> = ${c}`, ans: c - a, say: `${a} más qué número da ${c}`, why: `Contamos desde ${a} hasta ${c}: faltan ${c - a}.`, spread: 3 }); },
    () => { const d = rnd(1, 9) * 10; return num({ prompt: "Decenas", html: `¿Cuántas decenas hay en ${d}?`, text: true, ans: d / 10, say: `¿Cuántas decenas hay en ${d}?`, why: `Cada decena vale 10. En ${d} caben ${d / 10} decenas.`, spread: 2 }); },
    () => { const n = pick(NAMES), a = rnd(3, 9), b = rnd(2, 9); return num({ prompt: "Problema", text: true, html: `${n} tiene ${a} canicas y su abuela le regala ${b}. ¿Cuántas canicas tiene ahora?`, ans: a + b, say: `${n} tiene ${a} canicas y su abuela le regala ${b}. ¿Cuántas tiene ahora?`, why: `Regalar es agregar: ${a} + ${b} = ${a + b}.`, spread: 2 }); }
  ],
  p2: [
    () => { const a = rnd(15, 69), b = rnd(12, 29); return num({ html: `${a} + ${b} = <span class="q">?</span>`, ans: a + b, say: `¿Cuánto es ${a} más ${b}?`, why: `Sumamos unidades (${a % 10} + ${b % 10}) y luego decenas. Si las unidades pasan de 9, llevamos 1 a las decenas. Resultado: ${a + b}.` }); },
    () => { const a = rnd(40, 99), b = rnd(11, a - 10); return num({ html: `${a} − ${b} = <span class="q">?</span>`, ans: a - b, say: `¿Cuánto es ${a} menos ${b}?`, why: `Restamos unidades y luego decenas. Si no alcanza, pedimos prestada una decena. Resultado: ${a - b}.` }); },
    () => { const t = pick([2, 5, 10]), b = rnd(1, 10); return num({ html: `${t} × ${b} = <span class="q">?</span>`, ans: t * b, say: `¿Cuánto es ${t} por ${b}?`, why: `${t} × ${b} es sumar ${t} ${b} veces: ${t * b}.`, spread: t }); },
    () => { const n = rnd(3, 25) * 2; return Math.random() < .5
      ? num({ prompt: "La mitad", html: `La mitad de ${n} es <span class="q">?</span>`, ans: n / 2, say: `¿Cuál es la mitad de ${n}?`, why: `La mitad es repartir en 2 partes iguales: ${n} ÷ 2 = ${n / 2}.`, spread: 2 })
      : num({ prompt: "El doble", html: `El doble de ${n / 2} es <span class="q">?</span>`, ans: n, say: `¿Cuál es el doble de ${n / 2}?`, why: `El doble es sumar el número dos veces: ${n / 2} + ${n / 2} = ${n}.`, spread: 2 }); },
    () => { const n = pick(NAMES), a = rnd(30, 60), b = rnd(10, 25); return num({ prompt: "Problema", text: true, html: `${n} tenía ${a} estampas y regaló ${b}. ¿Cuántas le quedan?`, ans: a - b, say: `${n} tenía ${a} estampas y regaló ${b}. ¿Cuántas le quedan?`, why: `Regalar es quitar: ${a} − ${b} = ${a - b}.`, spread: 5 }); }
  ],
  p3: [
    () => { const a = rnd(2, 10), b = rnd(2, 10); return num({ html: `${a} × ${b} = <span class="q">?</span>`, ans: a * b, say: `¿Cuánto es ${a} por ${b}?`, why: `Tabla del ${a}: ${a} × ${b} = ${a * b}.`, spread: a }); },
    () => { const b = rnd(2, 9), c = rnd(2, 10); return num({ html: `${b * c} ÷ ${b} = <span class="q">?</span>`, ans: c, say: `¿Cuánto es ${b * c} entre ${b}?`, why: `Buscamos qué número por ${b} da ${b * c}: ${b} × ${c} = ${b * c}, entonces la respuesta es ${c}.`, spread: 2 }); },
    () => { const a = rnd(120, 599), b = rnd(105, 399); return num({ html: `${a} + ${b} = <span class="q">?</span>`, ans: a + b, say: `¿Cuánto es ${a} más ${b}?`, why: `Sumamos unidades, decenas y centenas, llevando cuando pasa de 9. Resultado: ${a + b}.`, spread: 100 }); },
    () => { const d = pick([2, 4]), n = d * rnd(2, 10); return num({ prompt: "Fracciones", html: `${fr(1, d)} de ${n} = <span class="q">?</span>`, ans: n / d, say: `¿Cuánto es un ${d === 2 ? "medio" : "cuarto"} de ${n}?`, why: `Dividimos ${n} en ${d} partes iguales: ${n} ÷ ${d} = ${n / d}.`, spread: 2 }); },
    () => { const n = pick(NAMES), a = rnd(3, 9), b = rnd(4, 9); return num({ prompt: "Problema", text: true, html: `${n} compra ${a} cajas con ${b} galletas cada una. ¿Cuántas galletas son en total?`, ans: a * b, say: `${n} compra ${a} cajas con ${b} galletas cada una. ¿Cuántas galletas son?`, why: `Grupos iguales se multiplican: ${a} × ${b} = ${a * b}.`, spread: b }); }
  ],
  p4: [

  $("#speak").hidden = !(synth && isYoung() && q.say);
  if (synth && isYoung() && q.say && st.grade === "p1") later(() => speak(q.say), 300);
  if (st.timed) startTimer(q.text ? 40000 : 25000);
}
$("#opts").addEventListener("click", (e) => { const b = e.target.closest(".opt"); if (b) answer(b); });
$("#speak").addEventListener("click", () => { unlock(); speak(st.q && st.q.say); });
function startTimer(ms) {
  cancelAnimationFrame(st.raf);
  const bar = $("#tbar"), t0 = performance.now();
  const loop = (now) => { const left = Math.max(0, ms - (now - t0)); bar.style.transform = `scaleX(${left / ms})`; bar.classList.toggle("low", left < 6000); if (left <= 0) { if (!st.locked) answer(null); return; } st.raf = requestAnimationFrame(loop); };
  st.raf = requestAnimationFrame(loop);
}
function moveRocket(n) { const sp = $(".space"); const w = sp.clientWidth || 300; $("#rocket").style.left = `${52 + ((w - 150) * n) / ROUNDS}px`; }
function answer(btn) {
  if (st.locked) return; st.locked = true; cancelAnimationFrame(st.raf);
  const q = st.q, ok = btn && btn.dataset.v === q.ans;
  document.querySelectorAll(".opt").forEach((b) => { if (b.dataset.v === q.ans) b.classList.add("right"); else if (b !== btn) b.classList.add("dim"); });
  const fb = $("#feedback");
  if (ok) {
    st.correct++; st.streak++; const pts = 100 + Math.min(st.streak - 1, 5) * 20; st.score += pts; chime();
    fb.className = "feedback good"; fb.textContent = `¡Correcto! +${pts}`;
    $("#streak").textContent = st.streak >= 3 ? `${st.streak} seguidas` : "";
    moveRocket(st.correct);
    later(next, 1000);
  } else {
    if (btn) btn.classList.add("wrong");
    st.streak = 0; $("#streak").textContent = ""; buzz();
    fb.className = "feedback bad"; fb.textContent = btn ? `La respuesta es ${q.ans.replace(/\^(\d+)/g, "^$1")}` : `Se acabó el tiempo. La respuesta es ${q.ans}`;
    const ex = $("#explain"); ex.innerHTML = q.why; ex.hidden = false; $("#next").hidden = false;
    st.missed.push({ html: q.html.replace(/<br>/g, " · "), ans: q.ans, why: q.why });
  }
  $("#score").textContent = `${st.score} pts`;
}
$("#next").addEventListener("click", next);
function finish() {
  clearLater(); show("end");
  const pct = st.correct / ROUNDS, stars = pct >= .9 ? 3 : pct >= .6 ? 2 : pct >= .3 ? 1 : 0;
  $("#starsrow").innerHTML = [0, 1, 2].map((i) => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.5l1.3-6.6L2.5 9.3l6.6-.8z" fill="${i < stars ? "#F2B632" : "var(--track)"}"/></svg>`).join("");
  $("#end-title").textContent = st.correct === ROUNDS ? "¡Llegaste a la Luna!" : ["Sigue practicando", "Buen intento", "¡Muy bien!", "¡Excelente!"][stars];
  $("#end-sub").textContent = gradeName();
  $("#final").textContent = st.score;
  $("#sum-c").textContent = `${st.correct} / ${ROUNDS} correctas`;
  const best = getBest(); if (st.score > best) setBest(st.score);
  $("#sum-b").textContent = st.score > best ? "Nuevo récord" : `Récord: ${best}`;
  $("#review").hidden = !st.missed.length;
  $("#review-list").innerHTML = st.missed.map((m) => `<li><b>${m.html.replace(/<span class="q">\?<\/span>/, "?")}</b> → ${m.ans.replace(/\^(\d+)/g, "<sup>$1</sup>")}<br>${m.why}</li>`).join("");
  if (stars >= 2) { fanfare(); burst(120); }
}
$("#play").addEventListener("click", start);
$("#again").addEventListener("click", start);
$("#change").addEventListener("click", () => { renderStart(); show("start"); });
$("#home").addEventListener("click", () => { clearLater(); if (synth) synth.cancel(); renderStart(); show("start"); });
addEventListener("resize", () => moveRocket(st.correct));

/* ---------- Fondo de símbolos ---------- */
(function () {
  const cols = ["#5BC0F0", "#F47FB0", "#4FD1A5", "#F2B632", "#FF7A6B", "#A98BE8"], syms = ["+", "−", "×", "÷", "=", "%", "π", "√", "²", "½"];
  let s = '<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">';
  for (let i = 0; i < 46; i++) { const x = (i * 97) % 400, y = (i * 173) % 800, r = (i * 37) % 60 - 30; s += `<text x="${x}" y="${y}" font-family="Bricolage Grotesque, Poppins, sans-serif" font-weight="800" font-size="${18 + (i % 4) * 8}" fill="${cols[i % cols.length]}" opacity=".32" transform="rotate(${r} ${x} ${y})">${syms[i % syms.length]}</text>`; }
  $("#sym").innerHTML = s + "</svg>";
})();

/* ---------- Confeti ---------- */
const cv = $("#fx"), cx = cv.getContext("2d"); let parts = [], fxOn = false;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
function burst(n) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#5BC0F0", "#F47FB0", "#4FD1A5", "#F2B632", "#A98BE8"];
  for (let i = 0; i < n; i++) parts.push({ x: cv.width / 2, y: cv.height / 3, vx: (Math.random() - .5) * 16 * devicePixelRatio, vy: (Math.random() * -12 - 4) * devicePixelRatio, r: (4 + Math.random() * 5) * devicePixelRatio, c: cols[i % cols.length], life: 90 });
  if (!fxOn) { fxOn = true; requestAnimationFrame(draw); }
}
function draw() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += .45 * devicePixelRatio; p.life--; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fill(); });
  parts = parts.filter((p) => p.life > 0 && p.y < cv.height + 40);
  if (parts.length) requestAnimationFrame(draw); else { fxOn = false; cx.clearRect(0, 0, cv.width, cv.height); }
}
})();
</script>
</body>
