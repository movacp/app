<!doctype html>
<html lang="en">
<head>
<script src="mova-gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My path · MOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="mova-voice.js"></script>
<script src="ruta-data.js"></script>
<script src="fc-extra.js"></script>
<script src="kids-visual.js"></script>
<script src="children-visual.js"></script>
<script src="teens-visual.js"></script>
<style>
:root{--bg:#F5F3FA;--ink:#15192B;--navy:#1A1B2E;--navy2:#2C3060;--muted:#6A6F85;--line:#ECE9F3;--lime:#D3F36B;--lav:#E6E2FF;--peri:#C9D2FF;--pink:#FF8FC0;--pinkSoft:#FFE1EE;--butter:#FFE58A;--mint:#BDF0D8;--okSoft:#E4F8B0;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
a{color:inherit}
:focus-visible{outline:3px solid #8FA2FF;outline-offset:3px;border-radius:14px}
h1,h2,h3,.bg{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px 48px}
.back{display:inline-flex;align-items:center;gap:10px;margin:2px 0 14px;text-decoration:none}
.back i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.6px solid var(--ink);background:#fff}
.back i svg{width:18px;height:18px}
.back small{display:block;font-size:12px;color:var(--muted);font-weight:700}.back b{font-family:"Bricolage Grotesque";font-size:19px}
.sub{margin:0 4px 16px;color:var(--muted);font-size:14px;line-height:1.55}
h1.t{font-size:32px;margin:2px 4px 4px}
[hidden]{display:none!important}

/* stages */
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stg button{border-radius:18px;padding:11px 10px;border:2px solid transparent}
.stg b{display:block;font-family:"Bricolage Grotesque";font-size:16px}.stg small{font-size:11.5px;font-weight:700;color:var(--muted)}
.stg .on{border-color:var(--ink)}
.stg [data-s=kids]{background:#ECFBC8}.stg [data-s=children]{background:var(--lav)}.stg [data-s=teens]{background:#FFE6F2}

/* route */
.route{position:relative;padding-left:34px}
.route:before{content:"";position:absolute;left:15px;top:22px;bottom:34px;width:4px;border-radius:4px;background:repeating-linear-gradient(var(--ink) 0 8px,transparent 8px 14px);opacity:.22}
.lv{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:22px;padding:14px 16px;margin-bottom:10px}
.lv .dot{position:absolute;left:-30px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--bg);background:#fff;box-shadow:inset 0 0 0 2px #D9D4EA}
.lv .dot svg{width:13px;height:13px}
.lv .code{font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;width:64px;flex:none;white-space:nowrap}
.lv .tx{flex:1;min-width:0;font-size:14px;font-weight:800;line-height:1.3}.lv .tx small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.bar{display:block;height:7px;border-radius:7px;background:var(--line);margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);border-radius:7px}
.lv.done .dot{background:var(--ink);color:var(--lime);box-shadow:none}
.lv.cur{background:var(--ink);color:#fff}.lv.cur .tx small{color:#C9C3F2}.lv.cur .dot{background:var(--lime);box-shadow:0 0 0 6px rgba(211,243,107,.35)}.lv.cur .bar{background:var(--navy2)}.lv.cur .bar i{background:var(--lime)}
.lv .tag{flex:none;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:var(--lime);color:var(--ink)}
.lv.adv{background:transparent;border:2px dashed #CFC9E2}.lv.adv .dot{background:var(--bg);box-shadow:inset 0 0 0 2px #CFC9E2}
.lv .soon{flex:none;font-size:11px;font-weight:800;color:#8A7FB8}
.badgesBtn{display:flex;align-items:center;gap:12px;width:100%;background:var(--navy);color:#fff;border-radius:22px;padding:14px 16px;margin-top:8px}
.badgesBtn .mini{display:flex}.badgesBtn .mini span{width:30px;height:30px;margin-right:-8px;border-radius:50%;border:2px solid var(--navy);overflow:hidden;background:var(--navy2)}
.badgesBtn .mini .bimg{display:block;width:100%;height:100%}.badgesBtn .mini img,.badgesBtn .mini svg{width:100%;height:100%;display:block;object-fit:cover}
.badgesBtn p{margin:0 0 0 10px;flex:1;font-weight:800;font-size:14.5px}.badgesBtn p small{display:block;color:#C9C3F2;font-size:12px;font-weight:700}
.badgesBtn>svg{width:18px;height:18px;color:var(--lime)}

/* level */
.lvh{position:relative;overflow:hidden;border-radius:28px;padding:18px 18px 16px;background:var(--lav)}
.lvh .blob{position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.45)}
.lvh small{position:relative;font-size:12px;font-weight:800;letter-spacing:.06em}
.lvh h1{position:relative;font-size:44px;margin:4px 0 0;line-height:1}.lvh p{position:relative;margin:2px 0 0;font-size:14px;font-weight:700}
.lvh .bar{position:relative;height:9px;background:rgba(255,255,255,.75);margin-top:12px}.lvh .cnt{position:relative;display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-top:6px}
.lvh[data-s=kids]{background:#E3F8B5}.lvh[data-s=teens]{background:#FFD9EA}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px -16px 14px;padding:0 16px 4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 14px;border-radius:999px;font-weight:800;font-size:13.5px;background:#fff}
.tabs .on{background:var(--ink);color:#fff}
.u{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:20px;padding:13px 14px;margin-bottom:8px;border:2px solid transparent}
.u .n{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-family:"Bricolage Grotesque";font-weight:800;flex:none;background:var(--bg);color:var(--muted)}
.u .n svg{width:16px;height:16px}
.u .tx{flex:1;min-width:0;font-weight:800;font-size:14.5px;line-height:1.3}.u .tx small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.u .st{flex:none;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;white-space:nowrap}
.u.ok .n{background:var(--ink);color:var(--lime)}
.u.next{border-color:var(--ink)}.u.next .n{background:var(--lime);color:var(--ink)}
.u.soon{opacity:.6;cursor:default}
.stars{display:inline-flex;gap:2px}.stars svg{width:15px;height:15px}
.panel{background:#fff;border-radius:22px;padding:16px;margin-bottom:10px}
.panel h3{margin:0 0 4px;font-size:19px}.panel p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.lk{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:8px;text-decoration:none}
.lk span.ic{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;flex:none}
.lk span.ic svg{width:18px;height:18px}
.lk b{flex:1;font-size:14.5px}.lk b small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.lk>svg{width:16px;height:16px;color:var(--muted)}
.empty{background:#fff;border-radius:22px;padding:22px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.55}
.empty b{display:block;color:var(--ink);font-family:"Bricolage Grotesque";font-size:19px;margin-bottom:4px}

/* lesson */
.steps{display:flex;gap:6px;margin-bottom:12px}.steps i{flex:1;height:7px;border-radius:7px;background:#E2DDEF}.steps i.on{background:var(--ink)}
.card{background:#fff;border-radius:28px;padding:20px 18px 20px;box-shadow:0 16px 36px -20px rgba(54,40,120,.25)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.card h2{font-size:28px;margin:6px 0 12px;line-height:1.1}
.exp{margin:0;padding:0;list-style:none}
.exp li{position:relative;padding:10px 12px 10px 38px;background:var(--bg);border-radius:14px;margin-bottom:7px;font-size:15px;line-height:1.5}
.exp li:before{content:"";position:absolute;left:14px;top:17px;width:10px;height:10px;border-radius:3px;background:var(--lime);box-shadow:0 0 0 2px var(--ink)}
.exp b{font-weight:800}
.exs{margin-top:14px}
.ex{display:flex;align-items:flex-start;gap:10px;padding:11px 2px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex button{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--lav)}.ex button svg{width:16px;height:16px}
.ex p{margin:0;font-size:16px;font-weight:700;line-height:1.4}.ex p small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.cta{display:block;width:100%;margin-top:18px;background:var(--ink);color:#fff;border-radius:999px;padding:15px;font-weight:800;font-size:16px;text-align:center;box-shadow:0 5px 0 var(--lime)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lime)}
.cta:disabled{opacity:.35}
.cta.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.row2{display:flex;gap:10px}.row2 .cta{flex:1}
/* builder */
.slot{min-height:64px;border-radius:18px;border:2px dashed #CFC9E2;padding:10px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;margin:12px 0}
.slot.good{border:2px solid #8BC34A;background:#F3FCE0}.slot.bad{border:2px solid var(--pink);background:#FFF2F7}
.pool{display:flex;flex-wrap:wrap;gap:7px;min-height:44px}
.chip{padding:9px 13px;border-radius:12px;background:var(--lav);font-weight:800;font-size:16px;box-shadow:0 3px 0 #C3BBEA}
.slot .chip{background:#fff;box-shadow:0 0 0 1.5px var(--ink)}
.fb{margin-top:12px;border-radius:16px;padding:11px 14px;font-size:14px;line-height:1.5;font-weight:600}
.fb.good{background:var(--okSoft)}.fb.bad{background:var(--pinkSoft)}
.fb b{display:block;font-weight:800}
/* quiz */
.qtext{font-family:"Bricolage Grotesque";font-weight:700;font-size:24px;line-height:1.3;margin:8px 0 16px}
.opt{display:block;width:100%;background:var(--bg);border-radius:16px;padding:14px 16px;margin-bottom:8px;font-weight:800;font-size:16px;border:2px solid transparent}
.opt.good{background:var(--okSoft);border-color:#8BC34A}.opt.bad{background:var(--pinkSoft);border-color:var(--pink)}
.opt:disabled{cursor:default}
/* result */
.res{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:28px;padding:24px 20px;text-align:center}
.res .ring{position:absolute;left:-60px;bottom:-80px;width:210px;height:210px;border-radius:50%;border:32px solid var(--navy2)}
.res .k{position:relative;display:inline-block;background:var(--lime);color:var(--navy);border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px}
.res h2{position:relative;font-size:56px;margin:14px 0 2px;line-height:1}.res h2 small{font-size:20px;color:#C9C3F2}
.res p{position:relative;margin:6px auto 0;color:#C9C3F2;font-size:14.5px;line-height:1.5;max-width:32ch}
.res .stars{position:relative;margin-top:12px}.res .stars svg{width:30px;height:30px}
.newb{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px;margin-top:12px}
.newb .bimg{width:64px;height:64px;flex:none}
.newb p{margin:0;font-size:13px;color:var(--muted);font-weight:700}.newb p b{display:block;color:var(--ink);font-family:"Bricolage Grotesque";font-size:18px}
.saved{text-align:center;font-size:13px;color:var(--muted);font-weight:700;margin-top:12px}
.saved button{text-decoration:underline;font-weight:800;color:var(--ink)}
/* flashcards */
.vis{margin:2px 0 12px}.pb{background:var(--lav);border-radius:20px;padding:12px 12px 4px;margin-bottom:10px}.pbk{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;background:var(--ink);color:var(--lime);border-radius:999px;padding:4px 9px;margin-bottom:8px}.pr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:9px}.pr .lb{width:100%;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}.pk{padding:7px 11px;border-radius:12px;font-weight:800;font-size:16.5px;line-height:1.15;box-shadow:0 2.5px 0 rgba(21,25,43,.18);background:#fff}.pk.ks{background:#FFC7E2}.pk.kv{background:var(--lime)}.pk.kq{background:var(--butter)}.pk.kn{background:var(--pink)}.pk.kw{background:#fff}.vt{border-radius:18px;overflow:hidden;box-shadow:0 0 0 2px var(--line);margin-bottom:10px}.vt table{width:100%;border-collapse:collapse;font-size:15px}.vt th{background:var(--ink);color:#fff;font-family:"Bricolage Grotesque";font-size:14px;text-align:left;padding:9px 10px}.vt td{padding:9px 10px;background:#fff;border-top:1.5px solid var(--line);font-weight:600;line-height:1.3}.vt tr:nth-child(even) td{background:#FAF9FD}.vt td b{background:var(--lime);border-radius:5px;padding:0 4px;font-weight:800}.vt td:first-child{font-weight:800}mark.mk{background:var(--lime);color:var(--ink);border-radius:6px;padding:0 3px}.vpics{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-bottom:10px}.vpics div{background:var(--bg);border-radius:16px;padding:8px 6px 8px;text-align:center}.vpics svg{display:block;width:100%;max-width:110px;margin:0 auto}.vpics b{display:inline-block;margin-top:4px;font-family:"Bricolage Grotesque";font-size:15px;background:var(--lime);border-radius:8px;padding:2px 8px}.vsw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}.vsw div{text-align:center}.vsw i{display:block;width:38px;height:38px;margin:0 auto 4px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(21,25,43,.18)}.vsw b{font-size:12.5px}.vnum{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}.vnum div{border-radius:14px;padding:7px 2px;text-align:center}.vnum b{display:block;font-family:"Bricolage Grotesque";font-size:22px;line-height:1}.vnum small{font-size:11px;font-weight:800}.vfq{display:grid;gap:6px;margin-bottom:10px}.vfq div{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:14px;padding:9px 12px}.vfq b{font-family:"Bricolage Grotesque";font-size:16px}.vfq span{display:flex;gap:5px}.vfq i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink)}.vfq i.on{background:var(--ink);box-shadow:none}
.vis.teen .fm{background:var(--ink);color:#fff}.vis.teen .fm .pbk{background:var(--lime);color:var(--ink)}.vis.teen .fm .lb{color:#C9CCE0}.pl{font-style:normal;font-weight:800;color:#6A6F85;font-size:16px;margin:0 1px}.vis.teen .pk{box-shadow:none;color:var(--ink)}.vis.teen .pk.ks{background:#C9D2FF}.vis.teen .pk.kq{background:#FFE58A}.vtl{background:var(--bg);border-radius:18px;padding:6px 8px 10px;margin-bottom:10px;text-align:center}.vtl svg{display:block;width:100%;height:auto}.vtl small{font-size:12px;font-weight:700;color:var(--muted)}.vt.cmp th:nth-child(2){background:var(--lime);color:var(--ink)}.vt.cmp th:nth-child(3){background:var(--pink);color:var(--ink)}.vt.cmp td:first-child{background:var(--lav);font-size:13px}
.vtl{background:#FFF7D6}.vbars{display:flex;justify-content:center;align-items:flex-end;gap:26px;background:var(--bg);border-radius:18px;padding:14px 10px 10px;margin-bottom:10px}.vbars div{text-align:center}.vbars i{display:block;width:46px;border-radius:12px 12px 6px 6px;border:2.5px solid var(--ink);margin:0 auto 6px}.vbars b{font-family:"Bricolage Grotesque";font-size:15px}.vsort{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.vsort div{border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}.vsort b{width:100%;font-family:"Bricolage Grotesque";font-size:16px}.vsort span{background:#fff;border-radius:10px;padding:4px 9px;font-weight:700;font-size:13.5px}
.mds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#fff;border-radius:20px;padding:6px;margin:12px 0 14px;box-shadow:0 10px 30px -20px rgba(54,40,120,.35)}.mds button{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 6px;border-radius:15px;font-weight:800;font-size:14.5px;color:var(--ink)}.mds button svg{width:18px;height:18px}.mds .on{background:var(--ink);color:#fff}.mds .on svg{color:var(--lime)}.dkh{margin:2px 4px 0}.fc .b small.exs{display:block;font-size:14.5px;font-weight:600;font-style:italic;color:var(--muted);margin-top:10px;line-height:1.4}.fc.ex3{height:250px}.mt{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin-top:4px}.mt.pic{grid-template-columns:1fr}.mt.pic .mc{grid-template-columns:1fr 1fr}.mt.pic .mc+.mc{margin-top:4px}.mc{display:grid;gap:8px;align-content:start}.mw,.md{display:flex;align-items:center;justify-content:center;min-height:62px;width:100%;padding:10px;border-radius:16px;background:var(--bg);border:2px solid transparent;font-weight:800;font-size:15.5px;text-align:center;line-height:1.25;transition:transform .12s,background .2s}.md span{font-size:13.5px;font-weight:700}.mt.pic .md{padding:6px;min-height:0}.md img{width:100%;max-width:104px;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:12px}.mw.sel,.md.sel{border-color:var(--ink);background:#fff;transform:scale(1.02)}.mw.done,.md.done{background:var(--okSoft);border-color:#8BC34A;opacity:.55;pointer-events:none}.mw.bad,.md.bad{background:var(--pinkSoft);border-color:var(--pink);animation:shk .35s}@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fc{perspective:900px;height:210px;margin:6px 0 12px}.fc.pic{height:330px}.fc .f img{display:block;width:190px;height:190px;object-fit:contain;margin:0 auto 6px;background:#fff;border-radius:22px}.fc .b small.def{display:block;font-size:19px;font-weight:700;color:#15192B;opacity:.85;margin-top:6px;line-height:1.3}.fc .b img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:18px;display:block;margin:0 auto 8px}.opts-pic{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt.pic{padding:8px;display:grid;place-items:center}.opt.pic img{width:100%;max-width:150px;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:16px}
.fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;border-radius:24px;display:grid;place-items:center;text-align:center;padding:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc .f{background:var(--lav)}.fc .b{background:var(--lime);transform:rotateY(180deg)}
.fc b{font-family:"Bricolage Grotesque";font-size:34px;line-height:1.1}.fc small{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-top:8px}
.fcnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fcnav span{font-weight:800;font-size:13px;color:var(--muted)}
.round{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--ink)}.round svg{width:18px;height:18px}
/* badges */
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bd{background:#fff;border-radius:22px;padding:16px 12px;text-align:center}
.bd .bimg{width:92px;height:92px;margin:0 auto 8px}
.bd b{display:block;font-family:"Bricolage Grotesque";font-size:16px}.bd small{display:block;font-size:12px;color:var(--muted);font-weight:700;line-height:1.4;margin-top:3px}
.bd.off .bimg{filter:grayscale(1);opacity:.35}
.bimg img,.bimg svg{width:100%;height:100%;display:block;object-fit:contain}
/* print */
#sheet{display:none}
@media print{
  body{background:#fff}.wrap{display:none!important}#sheet{display:block!important}
  @page{margin:16mm}
}
.sheet{font-family:"Plus Jakarta Sans",sans-serif;color:#15192B}

(function(){

/* ---------- progreso ---------- */

function ready(t){return !!t.exp;}
function lvStats(st,code){var L=D[st][code],o=S(),r=L.topics.filter(ready),d=r.filter(function(t){return o.done[t.id];});return {ready:r.length,done:d.length,total:L.topics.length,pct:r.length?Math.round(d.length/r.length*100):0};}

/* ---------- insignias ---------- */

function bArt(id){

  var fb='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="'+c+'" stroke="#15192B" stroke-width="4"/><circle cx="50" cy="50" r="34" fill="#fff" stroke="#15192B" stroke-width="3"/><path d="M50 30l6 12.5 13.5 2-9.8 9.5 2.3 13.5L50 61l-12 6.5 2.3-13.5-9.8-9.5 13.5-2z" fill="'+c+'" stroke="#15192B" stroke-width="3" stroke-linejoin="round"/></svg>';

function award(o,id){if(o.badges[id])return null;o.badges[id]=Date.now();return id;}

  [n>=1&&"first-step",quizScore===6&&"perfect-score",n>=5&&"grammar-explorer",n>=15&&"grammar-builder",o.built>=20&&"sentence-pro",

function curStage(){
  var o=S();if(o.stage)return o.stage;var u=user();
  if(u&&u.stage){var s=String(u.stage).toLowerCase();if(/kid/.test(s))return "kids";if(/child/.test(s))return "children";if(/teen/.test(s))return "teens";}

}
function curLevel(st){var o=S();if(o.stage===st&&o.level&&D[st][o.level])return o.level;var k=Object.keys(D[st]);for(var i=0;i<k.length;i++){if(D[st][k[i]].topics.some(ready))return k[i];}return k[0];}

/* ---------- inicio: My path ---------- */

  var html=back("./#/learn","Learn")+'<h1 class="t">My path</h1><p class="sub">'+(STG[st].lang==="es"?"Tu etapa y tu nivel, paso a paso. Cada nivel tiene gramática, vocabulario, práctica, hojas para imprimir y un examen final.":"Your stage and level, step by step. Each level has grammar, vocabulary, practice, worksheets and a final check.")+'</p>';
  html+='<div class="stg" role="radiogroup">'+ORDER.map(function(k){return '<button data-s="'+k+'" class="'+(k===st?"on":"")+'" role="radio" aria-checked="'+(k===st)+'"><b>'+STG[k].name+'</b><small>'+STG[k].ages+'</small></button>';}).join("")+"</div>";
  html+='<div class="route">'+Object.keys(lv).map(function(code){
    var L=lv[code],s=lvStats(st,code),passed=(o.checks[st+"|"+code]||0)>=75,isCur=code===cur;
    var cls="lv"+(passed?" done":"")+(isCur?" cur":"")+(L.adv&&!isCur?" adv":"");

    var right=isCur?'<span class="tag">You are here</span>':(!s.ready?'<span class="soon">COMING SOON</span>':(L.adv?'<span class="soon">ADVANCED</span>':""));
    return '<button class="'+cls+'" data-l="'+code+'"><span class="dot">'+(passed?IC.check:"")+'</span><span class="code">'+code+'</span><span class="tx">'+L.name+'<small>'+info+'</small>'+(s.ready&&!passed?'<span class="bar"><i style="width:'+s.pct+'%"></i></span>':"")+'</span>'+right+'</button>';
  }).join("")+"</div>";
  var nb=Object.keys(o.badges).length;
  html+='<button class="badgesBtn" id="bb"><span class="mini">'+BADGES.slice(0,4).map(function(b){return '<span>'+bArt(b[0])+'</span>';}).join("")+'</span><p>My badges<small>'+nb+' of '+BADGES.length+' earned</small></p>'+IC.chev+'</button>';

  document.getElementById("bb").onclick=function(){go("badges");};
}

/* ---------- página del nivel ---------- */
var GAMES={kids:[["juego-word-quest.html","Word Quest","Vocabulary and grammar"],["juego-sentence-scramble.html","Sentence Scramble","Order the words"],["juego-verb-memory.html","Verb Memory","Match the verbs"],["juego-likes-dislikes.html","Likes & Dislikes","I like / I don't like"],["juego-sopa-de-letras.html","Word Search","Find the words"],["juego-speaking.html","Speaking Lab","Read aloud",1]],
 children:[["juego-sentence-builder.html","Sentence Builder","Build sentences"],["juego-sentence-scramble.html","Sentence Scramble","Order the words"],["juego-word-quest.html","Word Quest","Vocabulary and grammar"],["juego-word-forms.html","Word Forms","Nouns, verbs, adjectives"],["juego-verb-memory.html","Verb Memory","Irregular verbs"],["juego-level-up.html","Level Up","Mixed skills"],["juego-speaking.html","Speaking Lab","Read aloud",1]],
 teens:[["juego-level-up.html","Level Up","Mixed skills"],["juego-word-forms.html","Word Forms","Nouns, verbs, adjectives"],["juego-sentence-builder.html","Sentence Builder","Build sentences"],["juego-word-quest.html","Word Quest","Vocabulary and grammar"],["juego-toefl-practice.html","TOEFL Practice","Exam training"],["juego-speaking.html","Speaking Lab","Read aloud",1]]};
function level(st,code,tab){
  var o=S();o.stage=st;o.level=code;W(o);
  var L=D[st][code],s=lvStats(st,code),es=STG[st].lang==="es";
  var tabs=[["grammar","Grammar"]].concat(st==="kids"?[["phonics","Phonics"]]:[]).concat([["writing","Writing"],["vocabulary","Vocabulary"],["practice","Practice"],["check","Check"]]);
  var html=back("#/stage/"+st,"My path")+'<div class="lvh" data-s="'+st+'"><span class="blob"></span><small>MOVA '+STG[st].name.toUpperCase()+'</small><h1>'+code+'</h1><p>'+L.name+'</p><span class="bar"><i style="width:'+s.pct+'%"></i></span><div class="cnt"><span>'+s.done+' of '+(s.ready||s.total)+' topics</span><span>'+s.pct+'%</span></div></div>';
  html+='<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-t="'+t[0]+'" class="'+(t[0]===tab?"on":"")+'" aria-selected="'+(t[0]===tab)+'">'+t[1]+"</button>";}).join("")+"</div><div id='tb'></div>";
  app.innerHTML=html;
  app.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){history.replaceState(null,"","#/lv/"+st+"/"+encodeURIComponent(code)+"/"+b.dataset.t);level(st,code,b.dataset.t);};});
  var tb=document.getElementById("tb"),nt=nextTopic(st,code);
  if(!s.ready&&(tab==="grammar"||tab==="check")){tb.innerHTML='<div class="empty"><b>Coming soon</b>'+(es?"Estamos preparando los temas de este nivel. Mientras tanto, revisa el temario:":"We're preparing this level. Here is the syllabus:")+"</div>"+L.topics.map(function(t,i){return '<div class="u soon"><span class="n">'+(i+1)+'</span><span class="tx">'+esc(t.t)+'<small>'+esc(t.s)+'</small></span></div>';}).join("");return;}
  if(tab==="grammar"){
    tb.innerHTML=L.topics.map(function(t,i){
      var d=o.done[t.id],isN=nt&&nt.id===t.id;
      if(!ready(t))return '<div class="u soon"><span class="n">'+(i+1)+'</span><span class="tx">'+esc(t.t)+'<small>'+esc(t.s)+'</small></span><span class="st" style="background:var(--bg)">Soon</span></div>';
      return '<button class="u'+(d?" ok":"")+(isN?" next":"")+'" data-id="'+t.id+'"><span class="n">'+(d?IC.check:(i+1))+'</span><span class="tx">'+esc(t.t)+'<small>'+esc(t.s)+'</small></span>'+(d?stars(d.stars):(isN?'<span class="st" style="background:var(--butter)">Up next</span>':""))+'</button>';
    }).join("");
    tb.querySelectorAll("button.u").forEach(function(b){b.onclick=function(){go("t/"+b.dataset.id);};});
  } else if(tab==="writing"||tab==="phonics"){
    var list=L[tab]||[],nx=list.filter(function(t){return !o.done[t.id];})[0];
    tb.innerHTML=list.length?'<p class="sub" style="margin-top:-4px">'+(tab==="writing"?(es?"Mayúsculas, puntuación y ortografía de este nivel.":"Capital letters, punctuation and spelling for this level."):"Sounds and words to help you read. Turn up the volume or use headphones.")+'</p>'+list.map(function(t,i){var d=o.done[t.id],isN=nx&&nx.id===t.id;return '<button class="u'+(d?" ok":"")+(isN?" next":"")+'" data-id="'+t.id+'"><span class="n">'+(d?IC.check:(i+1))+'</span><span class="tx">'+esc(t.t)+'<small>'+esc(t.s)+'</small></span>'+(d?stars(d.stars):(isN?'<span class="st" style="background:var(--butter)">Up next</span>':""))+'</button>';}).join(""):'<div class="empty"><b>Coming soon</b>'+(es?"Estamos preparando "+(tab==="writing"?"Writing":"Phonics")+" para este nivel.":"We're preparing Writing for this level.")+"</div>";
    tb.querySelectorAll("button.u").forEach(function(b){b.onclick=function(){go("t/"+b.dataset.id);};});
  } else if(tab==="vocabulary"){
    tb.innerHTML=L.vocab.length?L.vocab.map(function(v,i){var sc=o.vocab[st+"|"+code+"|"+i];return '<button class="u'+(sc>=8?" ok":"")+'" data-i="'+i+'"><span class="n">'+(sc>=8?IC.check:(i+1))+'</span><span class="tx">'+esc(v.n)+'<small>'+v.w.length+' words · study, match and quiz</small></span>'+(sc!=null?'<span class="st" style="background:'+(sc>=8?"var(--okSoft)":"var(--butter)")+'">'+sc+'/10</span>':"")+"</button>";}).join(""):'<div class="empty"><b>Coming soon</b>'+(es?"El vocabulario de este nivel está en preparación.":"Vocabulary for this level is on the way.")+"</div>";
    tb.querySelectorAll("button.u").forEach(function(b){b.onclick=function(){go("vocab/"+st+"/"+encodeURIComponent(code)+"/"+b.dataset.i);};});
  } else if(tab==="practice"){
    tb.innerHTML='<button class="lk" id="mx" style="width:100%"><span class="ic" style="background:var(--lime)">'+IC.mix+'</span><b>Mixed review<small>'+(es?"10 preguntas de los temas de este nivel":"10 questions from this level's topics")+'</small></b>'+IC.chev+'</button><h3 style="font-family:Bricolage Grotesque;margin:18px 4px 10px">'+(es?"Juegos recomendados":"Recommended games")+'</h3>'+
      GAMES[st].map(function(g){return '<a class="lk" href="'+g[0]+'"><span class="ic" style="background:'+(g[3]?"var(--pink)":"var(--lav)")+'">'+(g[3]?IC.mic:IC.game)+'</span><b>'+g[1]+'<small>'+g[2]+'</small></b>'+IC.chev+'</a>';}).join("");
    document.getElementById("mx").onclick=function(){go("mix/"+st+"/"+encodeURIComponent(code));};
  } else {
    var pc=o.checks[st+"|"+code],locked=s.done<s.ready;
    tb.innerHTML='<div class="res" style="text-align:left"><span class="ring"></span><span class="k">LEVEL CHECK · '+code+'</span><h2 style="font-size:28px;margin-top:12px">'+(pc!=null?"Best score: "+pc+"%":"12 questions")+'</h2><p style="margin:6px 0 0">'+(locked?(es?"Se desbloquea al terminar los "+s.ready+" temas del nivel. Llevas "+s.done+".":"Unlocks when you finish all "+s.ready+" topics. You've done "+s.done+"."):(es?"Preguntas de todos los temas del nivel. Con 75% o más apruebas el nivel.":"Questions from every topic in this level. Score 75% or more to pass."))+'</p></div><button class="cta" id="ck" '+(locked?"disabled":"")+'>'+(locked?"Locked":"Start level check")+'</button>';
    document.getElementById("ck").onclick=function(){go("check/"+st+"/"+encodeURIComponent(code));};

var KINDS={topics:"Grammar",writing:"Writing",phonics:"Phonics"};
function findTopic(id){for(var st in D)for(var code in D[st])for(var kind in KINDS){var ts=D[st][code][kind]||[];for(var i=0;i<ts.length;i++)if(ts[i].id===id)return {st:st,code:code,t:ts[i],i:i,kind:kind,list:ts};}return null;}

/* ---------- tema: explicación → construir → quiz ---------- */
function topic(id,from){
  var f=findTopic(id);if(!f||!ready(f.t))return go("");
  var t=f.t,es=STG[f.st].lang==="es",step=0,builtOk=0,qi=0,score=0,qs=null,bi=0;
  var tabName=f.kind==='topics'?'grammar':f.kind,lvlHref=from==="g"?"./#/structures":"#/lv/"+f.st+"/"+encodeURIComponent(f.code)+"/"+tabName,hasB=t.b&&t.b.length,NS=hasB?3:2;
  function steps(n){if(!hasB&&n===2)n=1;return '<div class="steps">'+(hasB?[0,1,2]:[0,1]).map(function(i){return '<i class="'+(i<=n?"on":"")+'"></i>';}).join("")+"</div>";}
  function head(){return back(lvlHref,from==="g"?"Grammar":STG[f.st].name+" · "+f.code);}
  var VZ=(window.MOVA_KIDS_VIS&&MOVA_KIDS_VIS[id])||(window.MOVA_CHILDREN_VIS&&MOVA_CHILDREN_VIS[id])||(window.MOVA_TEENS_VIS&&MOVA_TEENS_VIS[id]);
  function learn(){
    app.innerHTML=head()+steps(0)+'<div class="card"><span class="kicker">'+(es?"1 · APRENDE":"1 · LEARN")+'</span><h2>'+esc(t.t)+'</h2>'+visHtml(VZ)+'<ul class="exp">'+((VZ&&VZ.exp)||t.exp).map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul><div class="exs">'+t.ex.map(function(x,i){return '<div class="ex"><button data-i="'+i+'" aria-label="Listen">'+IC.spk+'</button><p>'+markEx(esc(x[0]),VZ&&VZ.mark)+(x[1]?"<small>"+esc(x[1])+"</small>":"")+'</p></div>';}).join("")+'</div><div class="row2">'+(f.kind!=='phonics'?'<button class="cta ghost" id="pr">'+(es?"Imprimir hoja":"Print worksheet")+'</button>':'')+'<button class="cta" id="nx">'+(es?"Practicar":"Practice")+'</button></div></div>';
    app.querySelectorAll(".ex button").forEach(function(b){b.onclick=function(){say(t.ex[+b.dataset.i][0]);};});
    var pr=document.getElementById("pr");if(pr)pr.onclick=function(){printSheet(f.st,f.code,id,true);};
    document.getElementById("nx").onclick=function(){bi=0;if(hasB)build();else startQuiz();};
  }
  function build(){
    var target=t.b[bi],words=target.split(" "),pool=shuffle(words.map(function(w,i){return {w:w,i:i};})),picked=[],tries=0;

    if(rounds.length>1&&rounds[rounds.length-1].length<3){var last=rounds.pop();rounds[rounds.length-1]=rounds[rounds.length-1].concat(last);}
    rounds=rounds.slice(0,3);var total=rounds.reduce(function(a,x){return a+x.length;},0),ri=0;
    function one(){
      var R=rounds[ri],L=shuffle(R),Rt=shuffle(R),sel=null,ok=0;
      app.innerHTML=head()+'<div class="steps">'+rounds.map(function(_,i){return '<i class="'+(i<=ri?"on":"")+'"></i>';}).join("")+'</div><div class="card"><span class="kicker">ROUND '+(ri+1)+' / '+rounds.length+'</span><div class="qtext">'+(pic?"Match each word with its picture.":"Match each word with its meaning.")+'</div><div class="mt'+(pic?" pic":"")+'"><div class="mc">'+L.map(function(w){return '<button class="mw" data-w="'+esc(w[0])+'"><b>'+esc(w[0])+'</b></button>';}).join("")+'</div><div class="mc">'+Rt.map(function(w){return '<button class="md" data-w="'+esc(w[0])+'">'+(pic?'<img src="'+w[2]+'" alt="">':'<span>'+esc(w[1])+'</span>')+'</button>';}).join("")+'</div></div><div id="mfb"></div></div>';
      wire();
      function pick(b){
        if(b.classList.contains("done"))return;
        if(!sel||sel.className.split(" ")[0]===b.className.split(" ")[0]){app.querySelectorAll(".mw.sel,.md.sel").forEach(function(x){x.classList.remove("sel");});sel=b;b.classList.add("sel");if(b.classList.contains("mw"))say(b.dataset.w,.85);return;}
        var a=sel;sel=null;a.classList.remove("sel");
        if(a.dataset.w===b.dataset.w){a.classList.add("done");b.classList.add("done");ok++;found++;
          if(ok===R.length){document.getElementById("mfb").innerHTML='<button class="cta" id="mn">'+(ri<rounds.length-1?"Next round":"See my result")+'</button>';document.getElementById("mn").onclick=function(){ri++;if(ri<rounds.length)one();else end();};}
        }else{miss++;[a,b].forEach(function(x){x.classList.add("bad");setTimeout(function(){x.classList.remove("bad");},550);});}
      }
      app.querySelectorAll(".mw,.md").forEach(function(b){b.onclick=function(){pick(b);};});
    }
    function end(){
      var st=miss===0?3:miss<=3?2:1;
      app.innerHTML=head()+'<div class="res"><span class="ring"></span><span class="k">MATCH</span><h2>'+found+'<small> / '+total+'</small></h2>'+stars(st)+'<p>'+(miss===0?"Perfect! No mistakes.":miss===1?"Great job! Only 1 mistake.":"Well done! "+miss+" mistakes. Try again to beat it.")+'</p></div><div class="row2"><button class="cta ghost" id="ma">Play again</button><button class="cta" id="mq">Take the quiz</button></div>';
      wire();document.getElementById("ma").onclick=match;document.getElementById("mq").onclick=function(){mode="quiz";quizV();};
    }
    one();
  }
  function quizV(){
    var qs=shuffle(V.w).slice(0,10).map(function(w){
      if(pic){var ot=shuffle(V.w.filter(function(x){return x!==w;})).slice(0,3).map(function(x){return {x:x[0],img:x[2],ok:false};});return {q:"Listen and tap the picture.",say:w[0],o:shuffle(ot.concat([{x:w[0],img:w[2],ok:true}])),why:w[0]+": "+w[1]};}
      var others=shuffle(V.w.filter(function(x){return x!==w;})).slice(0,3).map(function(x){return {x:x[1],ok:false};});
      return {q:c.ask?c.ask.replace("%",w[0]):"What does “"+w[0]+"” mean?",o:shuffle(others.concat([{x:w[1],ok:true}])),why:w[0]+": "+w[1]};});
    runQuiz({qs:qs,es:false,kicker:esc(V.n.toUpperCase()),backHref:c.bh,backLabel:c.bl,done:function(sc,n){
      var o=S(),kk=c.key;if(o.vocab[kk]==null||sc>o.vocab[kk])o.vocab[kk]=sc;var nb=checkBadges(o,null);W(o);
      var saved=saveCloud(c.log,sc,n,{kind:"score",stage:c.st,level:c.code});
      app.innerHTML=back(c.bh,c.bl)+'<div class="res"><span class="ring"></span><span class="k">'+esc(V.n.toUpperCase())+'</span><h2>'+sc+'<small> / '+n+'</small></h2>'+stars(sc>=10?3:sc>=8?2:1)+'</div>'+newBadgesHtml(nb)+'<div class="row2"><button class="cta ghost" id="ag">Study again</button><button class="cta" id="bk">Back to '+esc(c.bl)+'</button></div><p class="saved" id="sv"></p>';
      document.getElementById("ag").onclick=function(){mode="study";k=0;study();};
      document.getElementById("bk").onclick=goBack;savedNote(saved,false);}});
  }
  study();
}
