<!DOCTYPE html>
<html lang="es">
<head>

<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --paper:#F5F3FA; --surface:#fff; --surface2:#ECE9F3; --navy:#15192B; --ink:#15192B; --ink2:#4E5268; --muted:#6A6F85; --line:#E4E0EE;
  --lime:#D3F36B; --limeS:#F1FBD0; --limeD:#4F6B00;
  --lila:#9C8BFF; --lilaS:#E6E2FF; --lilaD:#4B3BB0;
  --rosa:#FF8FC0; --rosaS:#FFE6F2; --rosaD:#A3345C;
  --yel:#FFD54A; --yelS:#FFF1C2; --yelD:#7A5A00;
  --cream:#F5F3FA; --white:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3,.big,.ttl{font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--lila);outline-offset:3px}
.app{max-width:560px;margin:0 auto;padding:16px 16px 48px}
/* encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px;min-height:56px}
.bkw{display:flex;align-items:center;gap:12px;text-align:left}
.bk{flex:none;width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;background:transparent}
.bkw small{display:block;font-size:13px;color:var(--muted);font-weight:500;line-height:1.1}
.bkw b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:21px;line-height:1.15}
.pill{font-size:12px;font-weight:800;padding:8px 14px;border-radius:999px;background:var(--navy);color:#fff}
/* vitrina principal, igual a la app */
.ms-hero{position:relative;overflow:hidden;background:var(--c,#C7B5FF);color:#15192B;border-radius:30px;padding:24px 22px 26px;min-height:200px;margin:0 0 18px}
.ms-hero h1{font-size:clamp(34px,9.5vw,46px);line-height:.98;letter-spacing:-.03em;margin:14px 0 10px;color:#15192B}
.ms-hero p{margin:0;font-size:15px;line-height:1.55;color:#2B2F45;max-width:30ch}
.ms-hx{position:relative;z-index:2;max-width:64%}
.ms-art{position:absolute;right:-6px;bottom:-12px;width:44%;max-width:210px;z-index:1;pointer-events:none}
.ms-art svg{width:100%;height:auto;display:block}
.ms-dot{position:absolute;border-radius:50%;background:#fff;opacity:.45}
.ms-dot.a{width:120px;height:120px;right:-32px;top:-36px}
.ms-dot.b{width:14px;height:14px;right:46%;top:28px;opacity:.8}
.ms-dot.c{width:9px;height:9px;right:36%;top:66px;background:#15192B;opacity:.18}
.ms-dk{background:#15192B;color:#fff}
.ms-dk h1{color:#fff}.ms-dk p{color:#C9CCE0}
.ms-dk .ms-dot.a{background:#2A3150;opacity:1}.ms-dk .ms-dot.b{background:#FFD54A;opacity:1}.ms-dk .ms-dot.c{background:#FF8FC0;opacity:1}
.mp-k{display:inline-block;background:#fff;color:#15192B;font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:8px 15px;border-radius:999px}
.ms-dk .mp-k{background:var(--lime)}
.ms-h{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;margin:22px 4px 4px}
.ms-sub{margin:0 4px 14px;color:var(--muted);font-size:14px;line-height:1.45}
/* vitrinas de Prácticas y Juegos */
.vit{display:block;background:#fff;border-radius:28px;padding:8px 8px 18px;text-decoration:none;color:var(--ink);box-shadow:0 10px 30px -18px rgba(54,40,120,.45);margin-bottom:14px;width:100%;text-align:left}
.vit:active{transform:scale(.985)}
.vit .th{display:block;position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:var(--lilaS)}
.vit .th img{width:100%;height:100%;object-fit:cover;display:block}
.vit .th .k{position:absolute;left:14px;top:14px;background:#15192B;color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;border-radius:999px}
.vit .tx{display:block;padding:14px 12px 0}
.vit b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:28px;line-height:1.05;letter-spacing:-.02em}
.vit .d{display:block;font-size:15px;color:var(--muted);line-height:1.5;margin-top:6px}
.vit .ft{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips em{font-style:normal;font-size:11.5px;font-weight:700;border-radius:999px;padding:5px 10px}
.c1{background:#FFE1EA;color:#A3345C}.c2{background:#E6E2FF;color:#4B3BB0}.c3{background:#DCF4EA;color:#1F6E4E}.c4{background:#FFF1C2;color:#7A5A00}
.goB{flex:none;width:44px;height:44px;border-radius:50%;background:#15192B;color:#fff;display:grid;place-items:center}
.mini{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:24px;padding:14px 16px;box-shadow:0 10px 30px -18px rgba(54,40,120,.45);text-decoration:none;color:var(--ink)}
.mini .ic{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--yelS);color:var(--ink)}
.mini b{display:block;font-size:16px;color:var(--ink)}.mini span{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
/* grados */
.sect{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:700;margin:22px 4px 10px;display:flex;align-items:center;gap:10px}
.sect i{width:12px;height:12px;border-radius:50%;display:inline-block}
.sect small{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gr{border-radius:22px;padding:16px 8px 14px;text-align:center;background:#fff;box-shadow:0 10px 26px -18px rgba(54,40,120,.5)}
.gr b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:32px;line-height:1}
.gr span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:5px}
.pc{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border-radius:24px;padding:16px;margin-bottom:10px;box-shadow:0 10px 30px -18px rgba(54,40,120,.45)}
.pc .ic{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
.pc b{display:block;font-size:16px;line-height:1.3;color:var(--ink)}
.pc span{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:3px}
.pc .tg{display:inline-block;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;margin-top:8px}
.pc[disabled]{cursor:default}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gm{display:flex;flex-direction:column;background:#fff;border-radius:22px;padding:7px 7px 12px;text-decoration:none;color:var(--ink);box-shadow:0 8px 24px -16px rgba(54,40,120,.4)}
.gm img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;background:#EEE9FB}
.gm b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:16px;line-height:1.15;padding:10px 6px 0}
.gm span{display:block;font-size:12.5px;color:var(--muted);padding:4px 6px 0;line-height:1.35}
.empty{background:#fff;border-radius:24px;padding:20px;color:var(--muted);font-size:14px;line-height:1.5}
/* tarjetas de práctica */
.card{background:#fff;border-radius:30px;padding:24px 20px;box-shadow:0 10px 30px -18px rgba(54,40,120,.45);margin-bottom:16px}
h1{font-size:30px;line-height:1.05;margin:6px 0 10px;font-weight:800}
h2{font-size:23px;line-height:1.15;margin:0 0 8px;font-weight:700}
h3{font-size:18px;margin:0 0 6px;font-weight:700}
p{margin:0 0 12px;line-height:1.6;font-size:15px}
.muted{color:var(--muted)}
.signs{display:flex;gap:8px;margin-bottom:14px}
.sg{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--navy)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.fact{font-size:13px;font-weight:700;padding:8px 12px;border-radius:14px;background:var(--paper)}
label.f{display:block;font-size:14px;font-weight:700;margin:18px 0 8px}
input.name{width:100%;font:inherit;font-size:16px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.levels{display:grid;gap:10px;margin-top:4px}
.lvl{text-align:left;padding:16px;border-radius:20px;background:#fff;border:2px solid var(--line);display:flex;gap:14px;align-items:center}
.lvl .dot{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800}
.lvl b{display:block;font-size:15px;color:var(--ink)}
.lvl span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.lvl[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 3px rgba(21,25,43,.08)}
.btn{display:block;width:100%;padding:17px;border-radius:999px;background:var(--navy);color:#fff;font-weight:800;font-size:16px;margin-top:18px;box-shadow:0 4px 0 var(--lime)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn.ghost{background:#fff;color:var(--navy);border:2.5px solid var(--navy);box-shadow:none}
.err{color:var(--rosaD);font-size:13px;margin-top:8px;min-height:18px}
.tchip{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;padding:7px 12px;border-radius:999px}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1.5px dashed var(--line)}
.rule:first-of-type{border-top:0}
.rule .n{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px}
.rule p{margin:0;font-size:14.5px}
.visual{background:var(--paper);border-radius:20px;padding:14px;margin:14px 0}
.visual svg{display:block;width:100%;height:auto}
.steps{margin:6px 0 0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;padding:10px 0;border-top:1.5px dashed var(--line);font-size:15px;line-height:1.5}
.steps li:first-child{border-top:0}
.steps .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.expr{font-weight:800;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em}.fr b{font-weight:inherit;border-bottom:.07em solid currentColor;padding:0 .14em}.fr i{font-style:normal;padding:0 .14em}
.big svg{max-width:100%;height:auto;display:block;margin-top:8px}
.tb{border-collapse:separate;border-spacing:0;font-size:18px;margin-top:6px;border-radius:14px;overflow:hidden;border:2px solid var(--line)}.tb td,.tb th{padding:8px 16px;text-align:center;border-bottom:1.5px solid var(--line)}.tb th{background:var(--paper);font-size:14px}.tb tr:last-child td{border-bottom:0}.tb .q{background:var(--yelS);font-weight:800}
.opt .fr{font-size:1.15em}
.big.wrap{white-space:normal;font-size:clamp(20px,5.4vw,26px);line-height:1.35}
.progress{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;border-radius:999px;transition:width .35s ease}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.qnum{font-size:13px;color:var(--muted);font-weight:700}
.recuerda{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:8px 12px;border-radius:999px;background:var(--yelS)}
.prompt{font-size:15px;color:var(--muted);margin:14px 0 4px}
.big{font-size:clamp(28px,8vw,40px);font-weight:800;margin:4px 0 16px;overflow-x:auto;white-space:nowrap}
.ansbox{display:flex;align-items:center;justify-content:center;height:64px;border-radius:18px;border:2.5px solid var(--line);font-size:30px;font-weight:800;margin-bottom:12px;background:#fff;font-family:'Bricolage Grotesque',sans-serif}
.ansbox.empty{color:#B9B5C9;font-size:16px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{height:56px;border-radius:16px;background:var(--paper);font-size:22px;font-weight:800}
.pad button.sp{font-size:15px}
.vt{display:inline-block;text-align:right;font-variant-numeric:tabular-nums;line-height:1.12;letter-spacing:.06em;margin:4px 0}.vt div:last-child{border-bottom:.09em solid currentColor;padding-bottom:2px}.vt span{float:left;margin-right:.45em}
.pad button:active{transform:scale(.97)}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:16px;border-radius:18px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--paper)}
.fb{border-radius:22px;padding:18px;margin-top:14px}
.fb.ok{background:var(--limeS)} .fb.no{background:var(--rosaS)}
.fb h3{display:flex;align-items:center;gap:8px}
.fb .steps li{border-color:rgba(21,25,43,.12)}
.sheet{position:fixed;inset:0;background:rgba(21,25,43,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.sheet.on{display:flex}
.sheet .in{background:#fff;width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.score{display:flex;align-items:center;gap:18px;margin:8px 0 6px}
.ring{flex:none;width:118px;height:118px}
.bars{margin-top:8px}
.bar{margin:12px 0}
.bar .l{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
.bar .t{height:12px;border-radius:999px;background:var(--paper);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:999px}
.letter{background:var(--paper);border-radius:22px;padding:20px}
.letter p{font-size:15px}
.sign{font-weight:800;font-size:14px;margin-top:6px}
.rec{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;border:2px solid var(--line);margin-top:10px}
.rec .ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.rec b{display:block;font-size:15px;color:var(--ink)}
.rec span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.foot{display:none}
/* barra inferior de la app (solo vista previa) */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:536px;background:#15192B;border-radius:30px;padding:8px;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;z-index:20;pointer-events:none}
.nav span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:22px;color:#A9ADC4;font-size:11px;font-weight:700}
.nav span.on{background:var(--lime);color:#15192B}
.nav svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="app" id="app"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Recuerda"><div class="in" id="sheetIn"></div></div>

<script>
(function(){
"use strict";
var $app=document.getElementById('app'), $sheet=document.getElementById('sheet'), $sheetIn=document.getElementById('sheetIn');

/* ---------- utilidades ---------- */
function W(obj,val,tag,ans){if(Math.abs(val-ans)>1e-9&&obj[KEY(val)]===undefined)obj[KEY(val)]=tag}
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function NZ(a,b){var n;do{n=R(a,b)}while(n===0);return n}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var M='\u2212';
function f(n){return n<0?M+Math.abs(n):String(n)}
function t(n){return n<0?'('+M+Math.abs(n)+')':String(n)}
function E(s){return '<span class="expr">'+s+'</span>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sgnW(n){return n<0?'negativo':'positivo'}
function KEY(v){return String(Math.round(v*1e6)/1e6)}
function NF(n){if(typeof n!=='number'||isNaN(n))return String(n);var r=Math.round(n*1e6)/1e6;return (r<0?M:'')+Math.abs(r).toLocaleString('es-MX',{maximumFractionDigits:6})}

/* ---------- temas ---------- */
var ALLT={
 sig:{id:'sig',name:'Leyes de los signos',short:'Leyes de los signos',c:'--lime',s:'--limeS',d:'--limeD'},
 jer:{id:'jer',name:'Jerarquía de operaciones',short:'Jerarquía de operaciones',c:'--lila',s:'--lilaS',d:'--lilaD'},
 frd:{id:'frd',name:'Fracciones y decimales',short:'Fracciones y decimales',c:'--rosa',s:'--rosaS',d:'--rosaD'},
 por:{id:'por',name:'Porcentajes',short:'Porcentajes',c:'--yel',s:'--yelS',d:'--yelD'},
 dv:{id:'dv',name:'Divisibilidad y números primos',short:'Divisibilidad',c:'--lime',s:'--limeS',d:'--limeD'},
 mcd:{id:'mcd',name:'MCD y mcm',short:'MCD y mcm',c:'--lila',s:'--lilaS',d:'--lilaD'},
 pot:{id:'pot',name:'Potencias y raíces',short:'Potencias',c:'--rosa',s:'--rosaS',d:'--rosaD'},
 nc:{id:'nc',name:'Notación científica',short:'Notación científica',c:'--yel',s:'--yelS',d:'--yelD'},
 ec:{id:'ec',name:'Ecuaciones de primer grado',short:'Ecuaciones',c:'--lime',s:'--limeS',d:'--limeD'},
 suc:{id:'suc',name:'Sucesiones',short:'Sucesiones',c:'--lila',s:'--lilaS',d:'--lilaD'},
 pol:{id:'pol',name:'Polígonos',short:'Polígonos',c:'--rosa',s:'--rosaS',d:'--rosaD'},
 est:{id:'est',name:'Histogramas y medidas de tendencia central',short:'Estadística',c:'--yel',s:'--yelS',d:'--yelD'}
};
var TOPICS=[ALLT.sig,ALLT.jer,ALLT.frd,ALLT.por];
function cv(v){return 'var('+v+')'}

var TAGS={
 sigSuma:{topic:'sig',say:'al sumar números con distinto signo a veces te queda el signo equivocado',fix:'Si los signos son diferentes, resta y deja el signo del número más grande (sin contar el signo).'},
 sigResta:{topic:'sig',say:'al restar un número negativo a veces se te olvida que dos menos juntos se vuelven más',fix:'Restar un negativo es sumar: 5 − (−3) = 5 + 3.'},
 sigMult:{topic:'sig',say:'en multiplicaciones y divisiones con signo a veces el resultado queda con el signo contrario',fix:'Signos iguales dan positivo; signos diferentes dan negativo.'},
 jerOrden:{topic:'jer',say:'a veces resuelves de izquierda a derecha sin respetar la jerarquía',fix:'Primero paréntesis, luego potencias, después multiplicaciones y divisiones, y al final sumas y restas.'},
 jerParen:{topic:'jer',say:'a veces no empiezas por lo que está dentro del paréntesis',fix:'Lo primero que se resuelve es lo que está dentro de los paréntesis.'},
 frDen:{topic:'frd',say:'al sumar fracciones en algunos casos sumas también los denominadores',fix:'Busca un denominador común y suma solo los numeradores.'},
 frMult:{topic:'frd',say:'al multiplicar fracciones a veces multiplicas en cruz',fix:'Para multiplicar: numerador por numerador y denominador por denominador.'},
 frDiv:{topic:'frd',say:'al dividir fracciones a veces multiplicas derecho',fix:'Para dividir, multiplica en cruz: el numerador de la primera por el denominador de la segunda.'},

/* ---------- ayudas ---------- */
function NZ(a,b){var v=0;while(v===0)v=R(a,b);return v}
function SG(n){return n<0?M+Math.abs(n):String(n)}
function PAR(n){return n<0?'('+M+Math.abs(n)+')':String(n)}
function FR(n,d){return '<span class="fr"><b>'+n+'</b><i>'+d+'</i></span>'}
function gcd(a,b){return b?gcd(b,a%b):Math.abs(a)}
function lcm(a,b){return a/gcd(a,b)*b}
function SF(n,d){var g=gcd(n,d);return d/g===1?String(n/g):FR(n/g,d/g)}
function PF(maxd){var d=R(2,maxd),n=R(1,d-1);while(gcd(n,d)!==1)n=R(1,d-1);return[n,d]}
function SUP(b,e){return b+'<sup>'+SG(e)+'</sup>'}
function optsFrom(correct,wrongs){
  var all=[{t:correct,c:1}].concat(wrongs.filter(function(w,i,a){return w.t!==correct&&a.findIndex(function(x){return x.t===w.t})===i}));
  all=shuffle(all);return{opts:all.map(function(x){return x.t}),ans:all.findIndex(function(x){return x.c})};
}
function OPT(o){var x=optsFrom(o.correct,o.wrongs);o.type='opt';o.opts=x.opts;o.ans=x.ans;return o}
var TXT='font-family="Plus Jakarta Sans" font-weight="800"';
function isPrime(n){if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true}
function factors(n){var f={},p=2;while(n>1){while(n%p===0){f[p]=(f[p]||0)+1;n/=p}p++}return f}
function factStr(f){return Object.keys(f).map(function(p){return f[p]>1?SUP(p,f[p]):p}).join(' × ')}

function both(topic,fn){GEN[topic].base=(GEN[topic].base||[]).concat([function(){return fn('base')}]);GEN[topic].grado=(GEN[topic].grado||[]).concat([function(){return fn('grado')}])}

function grade(g){
  S.inPractice=false;
  var G=GR.filter(function(x){return x.g===g})[0];
  var h=hero({k:G.lv,h:G.full,p:'Tus prácticas de matemáticas.',c:HC[G.lv],art:TRI});
  if(!G.plan.length)h+='<div class="empty">Estamos preparando las prácticas de este grado. Muy pronto las vas a encontrar aquí.</div>';
  ['exam','grado','nivel'].forEach(function(sk){
    var items=G.plan.filter(function(x){return x[0]===sk});if(!items.length)return;
    h+='<div class="sect" style="display:block">'+SECS[sk][0]+'<small>'+SECS[sk][1]+'</small></div>';
    items.forEach(function(it){var P=PR[it[1]];
      h+='<button class="pc" data-p="'+it[1]+'" data-s="'+sk+'"'+(P.ready?'':' disabled')+'><span class="ic" style="background:'+cv(P.c)+'">'+pico(P.ic,P.d==='--navy'?'#15192B':getComputedStyle(document.documentElement).getPropertyValue(P.d).trim())+'</span><span><b>'+P.title+'</b><span>'+P.desc+'</span>'+
        (P.ready?'<span class="tg" style="background:var(--limeS);color:var(--limeD)">Lista para practicar</span>':'<span class="tg" style="background:var(--paper);color:var(--muted)">En preparación</span>')+'</span></button>'});
  });
  render(h,practicas,'Prácticas');
  [].forEach.call(document.querySelectorAll('.pc:not([disabled])'),function(b){b.onclick=function(){S.from=g;practiceHome(b.dataset.s==='nivel'?'base':'grado')}});
}

/* ---------- inicio de la práctica ---------- */
function who(){try{var u=(window.MovaAuth&&MovaAuth.user())||JSON.parse(localStorage.getItem('mova_student')||'null');if(u&&u.name)return String(u.name).trim().split(/\s+/)[0]}catch(e){}return ''}
var Q=(function(){var o={};location.search.replace(/^\?/,'').split('&').forEach(function(kv){var p=kv.split('=');if(p[0])o[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||'')});return o})();
function toList(){location.href='index.html#/matematicas/practicas'+(S.from?'/'+S.from:'')}
function practiceHome(pre){
  S.inPractice=false;S.level=null;var lv=pre||null,pt=S.part||(CONF.parts&&CONF.parts[Q.parte]?Q.parte:null);
  render('<div class="card">'+
    CONF.home()+
    '<label class="f" for="nm">¿Cómo te llamas?</label><input class="name" id="nm" autocomplete="given-name" placeholder="Escribe tu nombre" value="'+esc(S.name)+'">'+
    (CONF.parts?'<label class="f">Elige la parte</label><div class="levels">'+Object.keys(CONF.parts).map(function(k,i){var P=CONF.parts[k],c=['lime','lila','rosa'][i%3];return '<button class="lvl prt" data-p="'+k+'" aria-pressed="'+(pt===k)+'"><span class="dot" style="background:var(--'+c+'S);color:var(--'+c+'D)">'+k+'</span><span><b>'+P.name+'</b><span>'+P.desc+'</span></span></button>'}).join('')+'</div>':'')+
    '<label class="f">Elige tu nivel</label><div class="levels">'+
     '<button class="lvl" data-l="base" aria-pressed="'+(lv==='base')+'"><span class="dot" style="background:var(--limeS);color:var(--limeD)">1</span><span><b>Nivelación</b><span>'+CONF.lvBase+'</span></span></button>'+
     '<button class="lvl" data-l="grado" aria-pressed="'+(lv==='grado')+'"><span class="dot" style="background:var(--lilaS);color:var(--lilaD)">2</span><span><b>Mi grado</b><span>'+CONF.lvGrado+'</span></span></button>'+
    '</div><div class="err" id="er"></div>'+
    '<button class="btn" id="go">Empezar la práctica</button></div>',toList,'Prácticas');
  var w=who();if(w){S.name=w;var nm=document.getElementById('nm');nm.value=w;nm.parentNode.removeChild(nm.previousElementSibling);nm.parentNode.removeChild(nm);}
  [].forEach.call(document.querySelectorAll('.lvl:not(.prt)'),function(b){b.onclick=function(){lv=b.dataset.l;[].forEach.call(document.querySelectorAll('.lvl:not(.prt)'),function(x){x.setAttribute('aria-pressed',x===b)})}});
  [].forEach.call(document.querySelectorAll('.prt'),function(b){b.onclick=function(){pt=b.dataset.p;[].forEach.call(document.querySelectorAll('.prt'),function(x){x.setAttribute('aria-pressed',x===b)})}});
  document.getElementById('go').onclick=function(){
    var ne=document.getElementById('nm'),n=ne?ne.value.trim():S.name;
    if(!n){document.getElementById('er').textContent='Escribe tu nombre para empezar.';return}
    if(CONF.parts&&!pt){document.getElementById('er').textContent='Elige una parte para empezar.';return}
    if(!lv){document.getElementById('er').textContent='Elige un nivel para empezar.';return}
    if(CONF.parts){S.part=pt;CONF.setPart(pt)}
    S.name=n.split(/\s+/)[0];S.name=S.name.charAt(0).toUpperCase()+S.name.slice(1);
    start(lv);
  };
}
function start(lv){S.inPractice=true;S.level=lv;S.set=buildSet(lv);S.i=0;S.res=[];S.topicIdx=0;lesson(0)}

/* ---------- lección ---------- */
function lesson(ti){
  var tp=TOPICS[ti],L=LESSON[tp.id];
  var shown=1;
  function draw(){
    var st=L.example.steps.map(function(s,i){return i<shown?'<li><span class="k">'+(i+1)+'</span><span>'+s+'</span></li>':''}).join('');
    render(progress()+'<div class="card">'+
      '<span class="tchip" style="background:'+cv(tp.s)+';color:'+cv(tp.d)+'">Tema '+(ti+1)+' de '+TOPICS.length+'</span>'+
      '<h2 style="margin-top:12px">'+tp.name+'</h2><p class="muted">'+L.intro+'</p>'+
      '<div class="visual">'+L.visual()+'</div>'+
      L.rules.map(function(r,i){return '<div class="rule"><span class="n" style="background:'+cv(tp.s)+';color:'+cv(tp.d)+'">'+(i+1)+'</span><p>'+r+'</p></div>'}).join('')+
      '</div><div class="card"><h3>Ejemplo paso a paso</h3><div class="big" style="font-size:30px;margin:8px 0 6px">'+L.example.disp+'</div><ol class="steps">'+st+'</ol>'+
      (shown<L.example.steps.length?'<button class="btn ghost" id="nx">Ver el siguiente paso</button>':'<button class="btn" id="pr">Practicar este tema</button>')+'</div>');
    var nx=document.getElementById('nx');if(nx)nx.onclick=function(){shown++;draw()};
    var pr=document.getElementById('pr');if(pr)pr.onclick=function(){S.topicIdx=ti;question()};
  }
  draw();
}
function progress(){
  var pct=Math.round(S.i/S.set.length*100),col=cv(TOPICS[S.set[Math.min(S.i,S.set.length-1)].ti].c);
  return '<div class="progress" aria-label="Avance '+pct+'%"><i style="width:'+Math.max(pct,3)+'%;background:'+col+'"></i></div>';
}

/* ---------- ejercicio ---------- */
function question(){
  var q=S.set[S.i],tp=TOPICS.filter(function(x){return x.id===q.topic})[0],inTopic=q.k+1;
  S.entry='';S.choice=null;S.answered=false;
  var body='<div class="card"><div class="qhead"><span class="tchip" style="background:'+cv(tp.s)+';color:'+cv(tp.d)+'">'+tp.short+'</span>'+
    '<button class="recuerda" id="rc">'+ico('bulb')+'Recuerda</button></div>'+
    '<div class="qnum">Ejercicio '+inTopic+' de '+q.n+'</div>'+
    '<div class="prompt">'+(q.prompt||'Resuelve:')+'</div><div class="big'+(q.wrap?' wrap':'')+'">'+q.disp+(q.type==='num'&&!q.noEq?' =':'')+'</div>';
  if(q.type==='num'){
    body+='<div class="ansbox empty" id="ab" aria-live="polite">Tu respuesta</div><div class="pad" id="pad"'+(CONF.padCols?' style="grid-template-columns:repeat('+CONF.padCols+',1fr)"':'')+'>'+
      (CONF.keys||['7','8','9','⌫','4','5','6',M,'1','2','3','0']).map(function(k){return '<button data-k="'+k+'" class="'+(k==='⌫'||k===M?'sp':'')+'" aria-label="'+(k==='⌫'?'Borrar':k===M?'Cambiar signo':k==='.'?'Punto decimal':k)+'">'+(k===M?'+/'+M:k)+'</button>'}).join('')+'</div>';
  }else{
    body+='<div class="opts">'+q.opts.map(function(o,i){return '<button class="opt" data-o="'+i+'" aria-pressed="false">'+o+'</button>'}).join('')+'</div>';
  }
  body+='<div id="fbz"></div><button class="btn" id="ck" disabled>Comprobar</button></div>';
  render(progress()+body);
  document.getElementById('rc').onclick=function(){openRecuerda(q.topic)};
  var ck=document.getElementById('ck');
  if(q.type==='num'){
    var ab=document.getElementById('ab');
    var upd=function(){if(!S.entry||S.entry===M){ab.className='ansbox'+(S.entry?'':' empty');ab.textContent=S.entry||'Tu respuesta';ck.disabled=true}else{ab.className='ansbox';ab.textContent=S.entry;ck.disabled=false}};
    [].forEach.call(document.querySelectorAll('#pad button'),function(b){b.onclick=function(){if(S.answered)return;var k=b.dataset.k;
      if(k==='⌫')S.entry=S.entry.slice(0,-1);
      else if(k===M)S.entry=S.entry.charAt(0)===M?S.entry.slice(1):M+S.entry;
      else if(k==='.'){if(S.entry.indexOf('.')<0)S.entry=(S.entry||'0')+'.'}
      else if(S.entry.replace(M,'').length<7)S.entry=(S.entry===M+'0'||S.entry==='0')?S.entry.replace('0',k):S.entry+k;
      upd()}});
  }else{
    [].forEach.call(document.querySelectorAll('.opt'),function(b){b.onclick=function(){if(S.answered)return;S.choice=+b.dataset.o;
      [].forEach.call(document.querySelectorAll('.opt'),function(x){x.setAttribute('aria-pressed',x===b)});ck.disabled=false}});
  }
  ck.onclick=function(){if(S.answered){next();return}check(q)};
}
function check(q){
  S.answered=true;var ok,given,tag=null;
  if(q.type==='num'){given=parseFloat(S.entry.replace(M,'-'));ok=Math.abs(given-q.ans)<1e-9;
    if(!ok){tag=q.w[KEY(given)]||q.w[given]||q.def||null;
      if(!tag&&q.tagAbs){tag=(Math.sign(given)===Math.sign(q.ans))?q.tagAbs:'calculo'}
      if(!tag)tag='calculo';}}
  else{given=S.choice;ok=given===q.ans;if(!ok)tag=q.tag}
  S.res.push({topic:q.topic,ok:ok,tag:tag,disp:q.disp,given:q.type==='num'?NF(given):q.opts[given],ans:q.type==='num'?NF(q.ans):q.opts[q.ans],type:q.type});
  var fb=ok?'<div class="fb ok"><h3>'+ico('ok','#4F6B00')+'Correcto</h3><ol class="steps">'+q.steps.map(function(s,i){return '<li><span class="k">'+(i+1)+'</span><span>'+s+'</span></li>'}).join('')+'</ol></div>'
    :'<div class="fb no"><h3>'+ico('no','#C2387A')+'<span>La respuesta es '+(q.type==='num'?NF(q.ans):q.opts[q.ans])+'</span></h3>'+
      (tag&&TAGS[tag]?'<p style="font-size:14px;margin:0 0 6px">'+TAGS[tag].fix+'</p>':'')+
      '<ol class="steps">'+q.steps.map(function(s,i){return '<li><span class="k">'+(i+1)+'</span><span>'+s+'</span></li>'}).join('')+'</ol></div>';
  document.getElementById('fbz').innerHTML=fb;
  var ck=document.getElementById('ck');ck.textContent=S.i===S.set.length-1?'Ver mis resultados':(q.k===q.n-1?'Continuar al siguiente tema':'Siguiente ejercicio');
  ck.scrollIntoView({behavior:'smooth',block:'end'});
}
function next(){S.i++;if(S.i>=S.set.length){results();return}if(S.set[S.i].k===0){lesson(S.set[S.i].ti)}else question()}

/* ---------- recuerda ---------- */
function openRecuerda(tid){
  var tp=TOPICS.filter(function(x){return x.id===tid})[0],L=LESSON[tid];
  $sheetIn.innerHTML='<div class="qhead"><span class="tchip" style="background:'+cv(tp.s)+';color:'+cv(tp.d)+'">'+ico('bulb')+'Recuerda</span></div><h2 style="margin-top:10px">'+tp.name+'</h2>'+
    '<div class="visual">'+L.visual()+'</div>'+L.rules.map(function(r,i){return '<div class="rule"><span class="n" style="background:'+cv(tp.s)+';color:'+cv(tp.d)+'">'+(i+1)+'</span><p>'+r+'</p></div>'}).join('')+
    '<button class="btn" id="cl">Volver al ejercicio</button>';
  $sheet.classList.add('on');document.getElementById('cl').focus();
  document.getElementById('cl').onclick=closeSheet;
}
function closeSheet(){$sheet.classList.remove('on')}
$sheet.onclick=function(e){if(e.target===$sheet)closeSheet()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

/* ---------- resultados y retroalimentación ---------- */
function results(){
  var total=S.res.length,good=S.res.filter(function(r){return r.ok}).length,grade=Math.round(good/total*100)/10;
  var per=TOPICS.map(function(tp){var r=S.res.filter(function(x){return x.topic===tp.id});var g=r.filter(function(x){return x.ok}).length;return{tp:tp,g:g,n:r.length,p:g/r.length}});
  var tags={};S.res.forEach(function(r){if(!r.ok){if(!tags[r.tag])tags[r.tag]={n:0,ex:r};tags[r.tag].n++}});
  var tagList=Object.keys(tags).sort(function(a,b){return tags[b].n-tags[a].n});
  var strong=per.filter(function(x){return x.p>=.75}),weak=per.slice().sort(function(a,b){return a.p-b.p})[0];

  /* carta en primera persona */
  var L=[];
  L.push(S.name+', ya revisé tu práctica.');
  if(strong.length===TOPICS.length)L.push('Hiciste un trabajo excelente en todos los temas: se nota que entiendes las reglas y que las aplicas con cuidado.');
  else if(strong.length)L.push('Me da mucho gusto ver que dominas '+strong.map(function(x){return x.tp.short.toLowerCase()}).join(' y ')+'; ahí trabajaste con mucha seguridad.');
  else L.push('Veo que te esforzaste en cada ejercicio y no te rendiste; eso es justo lo que se necesita para mejorar.');
  if(tagList.length){
    var parts=tagList.slice(0,2).map(function(k,ix){var e=tags[k].ex,txt=(ix?'También noto que ':'Noto que ')+TAGS[k].say;
      if(e.type==='num'&&!/<svg|<table/.test(e.disp)&&e.disp.replace(/<[^>]+>/g,'').length<45)txt+=': por ejemplo, en '+E(e.disp)+' respondiste '+E(e.given)+' y el resultado es '+E(e.ans);
      return txt+'. '+TAGS[k].fix});
    L.push(parts.join(' '));
  }else L.push('No tuviste ningún error. Te felicito.');
  var recP,recG,LV=function(l){return l==='base'?'Nivelación':'Mi grado'};
  if(grade>=9&&S.level==='base'){L.push('Ya puedes pasar al nivel Mi grado. Mi recomendación es que lo hagas en tu siguiente práctica.');recP={t:CONF.short+' · Mi grado',d:CONF.upTxt,l:'grado'}}
  else if(grade>=9){L.push(CONF.readyTxt);recP={t:CONF.short+' · Mi grado',d:'Repítela con ejercicios nuevos para mantener la práctica.',l:'grado'}}
  else{L.push('Mi recomendación es que repitas esta práctica poniendo especial atención en '+weak.tp.short.toLowerCase()+'. Los ejercicios cambian cada vez, así que vas a practicar con ejercicios nuevos.');recP={t:CONF.short+' · '+LV(S.level),d:'Ejercicios nuevos, enfocándote en '+weak.tp.short.toLowerCase()+'.',l:S.level}}
  recG=CONF.game(weak.tp.id);
  L.push('Y para practicar jugando, te recomiendo '+recG.t+'. ¡Vas por muy buen camino!');

  try{if(window.MovaAuth)MovaAuth.save(CONF.slug,CONF.short+' · '+(S.level==='base'?'Nivelación':'Mi grado'),good,total,{area:'math',level:S.level,grade:S.from||null,topics:per.map(function(x){return {t:x.tp.id,ok:x.g,n:x.n}}),errors:tagList})}catch(e){}
  var msg=grade>=9?'Excelente trabajo':grade>=7?'Muy buen avance':grade>=5?'Vamos por buen camino':'Vamos a reforzarlo juntos';
  var ringCol=grade>=8?'#D3F36B':grade>=6?'#9C8BFF':'#FF8FC0',C=2*Math.PI*48;
  var ring='<svg class="ring" viewBox="0 0 118 118" role="img" aria-label="Calificación '+grade+' de 10"><circle cx="59" cy="59" r="48" fill="none" stroke="#F5F3FA" stroke-width="13"/><circle cx="59" cy="59" r="48" fill="none" stroke="'+ringCol+'" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+(C*good/total)+' '+C+'" transform="rotate(-90 59 59)"/><text x="59" y="66" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="30" font-weight="800" fill="#15192B">'+(grade%1?grade.toFixed(1):grade)+'</text></svg>';

  render('<div class="card"><span class="tchip" style="background:var(--cream)">Resultados</span>'+
    '<div class="score">'+ring+'<div><h2 style="margin:0">'+msg+', '+esc(S.name)+'</h2><p class="muted" style="margin:4px 0 0">'+good+' de '+total+' ejercicios correctos</p></div></div>'+
    '<div class="bars">'+per.map(function(x){return '<div class="bar"><div class="l"><span>'+x.tp.short+'</span><span>'+x.g+'/'+x.n+'</span></div><div class="t"><i style="width:'+Math.max(x.p*100,2)+'%;background:'+cv(x.tp.c)+'"></i></div></div>'}).join('')+'</div></div>'+
    '<div class="card"><h3>Retroalimentación</h3><div class="letter">'+L.map(function(p){return '<p>'+p+'</p>'}).join('')+'<div class="sign">Miss Karla Rodríguez · Academic Coordinator</div></div></div>'+
    '<div class="card"><h3>Te recomiendo</h3>'+
     '<button class="rec" id="rp" style="width:100%;text-align:left;background:#fff"><span class="ic" style="background:var(--lilaS);color:var(--lilaD)">'+ico(recP.l!==S.level?'up':'redo')+'</span><span><b>'+recP.t+'</b><span>'+recP.d+'</span></span></button>'+
     '<div class="rec"><span class="ic" style="background:var(--rosaS);color:var(--rosaD)">'+ico('vault')+'</span><span><b>'+recG.t+'</b><span>'+recG.d+'</span></span></div>'+
     '<button class="btn ghost" id="hm">Volver a mis prácticas</button></div>');
  document.getElementById('rp').onclick=function(){start(recP.l)};
  document.getElementById('hm').onclick=toList;
}

S.from=Q.g||null;practiceHome(Q.nivel==='base'||Q.nivel==='grado'?Q.nivel:null);
})();
</script>
<script src="mova-auth.js"></script>
</body>
